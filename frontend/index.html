                    const biometricEnabled = document.getElementById('ls-tp-mode').value === 'biometric';
                    const visual = trustPathUiState.visualFile, acoustic = trustPathUiState.acousticFile;
                    const reference = trustPathUiState.referenceFile, test = trustPathUiState.testFile;
                    const suppliedCount = [text, visual, acoustic, biometricEnabled && reference && test].filter(Boolean).length;
                    if (suppliedCount < 2) return showDialog('More evidence required', 'TrustPath analysis needs at least 2 independent evidence sources.');
                    if (biometricEnabled && ((reference && !test) || (!reference && test))) return showDialog('Biometric evidence incomplete', 'Select both a Reference Voice and a Test Voice before running the biometric scenario.');
                    const run = document.getElementById('ls-tp-run'); run.disabled = true; run.innerHTML = '<span class="ls-tp-run-spinner"></span> Analyzing…'; setStatus('ANALYZING');
                    const resultHost = document.getElementById('ls-result');
                    if (resultHost) {
                        resultHost.innerHTML = `<section class="ls-tp3-processing"><div class="ls-tp3-processing-core"><div class="ls-tp3-processing-ring"></div><div class="ls-tp3-processing-dot"></div></div><span class="ls-tp3-processing-kicker">TRUSTPATH ${biometricEnabled ? 'BIOMETRIC' : 'STANDARD'} INVESTIGATION</span><strong id="ls-tp3-processing-title">INGESTING EVIDENCE</strong><small id="ls-tp3-processing-sub">Preparing supplied sources for correlated analysis.</small><div class="ls-tp3-processing-steps"><i class="active">01</i><i>02</i><i>03</i><i>04</i></div></section>`;
                    }
                    if (text) setChannelProcessing('text', 'processing'); if (visual) setChannelProcessing('visual', 'processing'); if (acoustic) setChannelProcessing('acoustic', 'processing');
                    if (biometricEnabled) { if (reference) setChannelProcessing('reference', 'processing'); if (test) setChannelProcessing('test', 'processing'); }
                    const tpSteps = biometricEnabled
                        ? [['ENROLLING REFERENCE', 'Building the authorized voice baseline.'], ['VERIFYING TEST VOICE', 'Comparing the supplied test sample against the reference.'], ['CORRELATING EVIDENCE', 'Mapping modality findings into one TrustPath case.'], ['BUILDING ASSESSMENT', 'Preparing the evidence-led result.']]
                        : [['INGESTING EVIDENCE', 'Preparing supplied sources for correlated analysis.'], ['RUNNING MODULES', 'Executing the requested evidence analyzers.'], ['CORRELATING EVIDENCE', 'Mapping modality findings into one TrustPath case.'], ['BUILDING ASSESSMENT', 'Preparing the evidence-led result.']];
                    let tpStepIndex = 0;
                    const tpStepTimer = window.setInterval(() => {
                        const titleEl = document.getElementById('ls-tp3-processing-title');
                        const subEl = document.getElementById('ls-tp3-processing-sub');
                        const stepsEl = document.querySelector('.ls-tp3-processing-steps');
                        if (!titleEl || !subEl || !stepsEl) return;
                        const current = tpSteps[Math.min(tpStepIndex, tpSteps.length - 1)];
                        titleEl.classList.remove('is-changing'); void titleEl.offsetWidth; titleEl.classList.add('is-changing');
                        titleEl.textContent = current[0]; subEl.textContent = current[1];
                        [...stepsEl.children].forEach((el, idx) => el.classList.toggle('active', idx <= tpStepIndex));
                        tpStepIndex = Math.min(tpStepIndex + 1, tpSteps.length - 1);
                    }, 850);
                    try {
                        const p = { text, visual, acoustic, reference_voice: biometricEnabled ? reference : null, test_voice: biometricEnabled ? test : null, age: 'adult', manifest: { text: !!text, visual: !!visual, acoustic: !!acoustic, biometric: !!(biometricEnabled && reference && test) } };
                        const raw = await analyzeTrustPath(p);
                        const caseData = raw?.case || raw;
                        const moduleStatus = raw?.module_status || caseData?.module_status || {};
                        const getStatus = key => String(moduleStatus[key] ?? moduleStatus[`${key}_analysis`] ?? moduleStatus[key?.toUpperCase()] ?? '').toLowerCase();
                        [['text', text], ['visual', visual], ['acoustic', acoustic], ['reference', biometricEnabled && reference], ['test', biometricEnabled && test]].forEach(([kind, present]) => { if (!present) return; const lookup = kind === 'reference' || kind === 'test' ? 'biometric' : kind; const ss = getStatus(lookup); setChannelProcessing(kind, (ss.includes('fail') || ss.includes('error')) ? 'failed' : 'done'); });
                        window.clearInterval(tpStepTimer);
                        showResult('TrustPath', caseData); setStatus('CASE READY'); run.disabled = false; run.innerHTML = 'Run TrustPath again';
                    } catch (e) {
                        window.clearInterval(tpStepTimer);
                        setStatus('ERROR', false);[['text', text], ['visual', visual], ['acoustic', acoustic], ['reference', biometricEnabled && reference], ['test', biometricEnabled && test]].forEach(([kind, present]) => { if (present) setChannelProcessing(kind, 'failed'); }); run.disabled = false; run.innerHTML = 'Run TrustPath'; showDialog('TrustPath failed', 'The investigation could not be completed.', e.message);
                    }
                };
            }

            const renderers = { text: textView, visual: visualView, acoustic: acousticView, biometric: bioView, live: liveView, trustpath: trustView };

            document.querySelectorAll('.ls-nav button').forEach(btn => btn.addEventListener('click', () => {
                const k = btn.dataset.module;
                document.querySelectorAll('.ls-nav button').forEach(x => x.classList.toggle('active', x.dataset.module === k));
                nameEl.textContent = { text: 'TEXT ANALYSIS', visual: 'VISUAL ANALYSIS', acoustic: 'ACOUSTIC ANALYSIS', biometric: 'BIOMETRIC', live: 'LIVE', trustpath: 'TRUSTPATH' }[k];
                setStatus('READY');
                setLuiAvailability(k);
                announceLuiTab(k);
                renderers[k]();
            }));

            setLuiAvailability('text');
            renderers.text();

        })();
    </script>
