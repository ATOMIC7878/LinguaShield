            function luiWarmChat(text) {
                return /^(hi|hello|hey|hiya|thanks|thank you|great|good|awesome|nice|love it|cool)[!.\s]*$/i.test(String(text || '').trim());
            }

            async function handleLuiChatRequest(data) {
                luiDbg('chat:request-enter', { currentTab: lui.currentTab, allowed: luiAllowed(lui.currentTab), chatStreaming: lui.chatStreaming, analysisBusy: lui.analysisBusy, frameReady: lui.frameReady, assetId: b.assetId, generation: b.generation, message: luiDebugPayload(data?.message, 900) });
                if (!luiAllowed(lui.currentTab)) {
                    luiDbgWarn('chat:drop', { reason: 'tab_not_allowed', tab: lui.currentTab });
                    return;
                }
                const text = String(data?.message || '').trim();
                if (!text) {
                    luiDbgWarn('chat:drop', { reason: 'empty_message' });
                    return;
                }
                if (lui.chatStreaming) {
                    // Never discard an operator question because a previous chat request
                    // is still finishing. Queue it and process it immediately afterward.
                    if (lui.chatQueue.length < 3) {
                        lui.chatQueue.push(data);
                        luiDbg('chat:queued', { queueLength: lui.chatQueue.length, reason: 'chat_streaming' });
                    } else {
                        luiDbgWarn('chat:queue-full', { queueLength: lui.chatQueue.length });
                    }
                    return;
                }
                if (!b.assetId) {
                    luiDbgWarn('chat:no-asset', { sessionId: b.sessionId, tab: lui.currentTab });
                    const noAssetReply = 'Analyze evidence in an analytical module before asking for a case-specific forensic explanation. TrustPath automatic investigation responses remain disabled.';
                    recordLuiLedgerEvent('CHAT_BOT', lui.currentTab, { message: noAssetReply }, { role: 'assistant', state: 'inquisitive', language: data?.language || lui.language });
                    luiPost('LUI_ASSISTANT_MESSAGE', { role: 'assistant', state: 'inquisitive', text: noAssetReply });
                    return;
                }
                const warm = luiWarmChat(text);
                recordLuiLedgerEvent('CHAT_USER', lui.currentTab, { message: text }, { role: 'user', state: 'inquisitive', language: data?.language || lui.language });
                setLuiExpression('inquisitive', true);
                setLuiBusy(true, warm ? 'chat_delight' : 'chat');
                try {
                    luiDbg('chat:backend-request', { endpoint: '/api/chat/message', sessionId: b.sessionId, assetId: b.assetId, generation: b.generation, tab: lui.currentTab, language: data?.language || lui.language, message: luiDebugPayload(text, 900) });
                    const answer = await streamEndpointText(`${API_BASE_URL}/api/chat/message`, {
                        session_id: b.sessionId,
                        asset_id: b.assetId,
                        generation: b.generation,
                        tab: lui.currentTab,
                        message: text,
                        demographic: document.getElementById('ls-age')?.value || 'adult',
                        language: data?.language || lui.language,
                        result_context: data?.resultContext || null,
                        interaction_type: data?.interactionType || 'chat'
                    }, b.activeController);
                    const assistantState = 'inquisitive';
                    luiDbg('chat:backend-success', { answerLength: answer?.length || 0, answerPreview: luiDebugPayload(answer, 1200) });
                    setLuiExpression(assistantState, false);
                    recordLuiLedgerEvent('CHAT_BOT', lui.currentTab, { message: answer || 'No response was returned by Lui Core.' }, { role: 'assistant', state: assistantState, language: data?.language || lui.language });
                    const assistantPayload = {
                        role: 'assistant',
                        kind: 'chat',
                        source: 'LUI_CHAT',
                        state: assistantState,
                        tab: lui.currentTab,
                        text: answer || 'No response was returned by Lui Core.',
                        interactionType: data?.interactionType || 'chat'
                    };
                    queueLuiAssistant(assistantPayload);
                } catch (e) {
                    luiDbgError('chat:backend-error', { name: e?.name || '', message: e?.message || String(e), aborted: e?.name === 'AbortError' });
                    if (e.name !== 'AbortError') {
                        const errorPayload = { role: 'assistant', state: 'inquisitive', tab: lui.currentTab, text: 'Connection to Lui Core failed for this question.' };
                        queueLuiAssistant(errorPayload);
                    }
                } finally {
                    setLuiBusy(false, warm ? 'chat_delight_complete' : 'chat_complete');
                    const next = lui.chatQueue.shift();
                    if (next) queueMicrotask(() => handleLuiChatRequest(next));
                }
            }

            function buildLocalizedLuiFallback(context, lang) {
                const isHindi = lang === 'hi';
                const isMarathi = lang === 'mr';
                const parts = [];
                if (context?.threat === true) {
                    parts.push(isHindi ? 'बैकएंड ने इस परिणाम को खतरे के रूप में चिह्नित किया है।' : isMarathi ? 'बॅकएंडने हा परिणाम धोका म्हणून चिन्हांकित केला आहे.' : 'The backend marked this result as a threat.');
                } else if (context?.threat === false) {
                    parts.push(isHindi ? 'बैकएंड ने इस परिणाम को स्पष्ट/सत्यापित के रूप में चिह्नित किया है।' : isMarathi ? 'बॅकएंडने हा परिणाम स्पष्ट/सत्यापित म्हणून चिन्हांकित केला आहे.' : 'The backend marked this result as clear.');
                } else {
                    parts.push(isHindi ? `${String(context?.tab || 'मॉड्यूल').toUpperCase()} का बैकएंड परिणाम प्राप्त हुआ है।` : isMarathi ? `${String(context?.tab || 'मॉड्यूल').toUpperCase()} चा बॅकएंड परिणाम प्राप्त झाला आहे.` : `${String(context?.tab || 'Module').toUpperCase()} backend result received.`);
                }
                if (context?.riskClassification) {
                    parts.push(isHindi ? `वर्गीकरण: ${String(context.riskClassification)}.` : isMarathi ? `वर्गीकरण: ${String(context.riskClassification)}.` : `Classification: ${String(context.riskClassification)}.`);
                }
                if (Number.isFinite(Number(context?.confidence))) {
                    parts.push(isHindi ? `विश्वास: ${Number(context.confidence).toFixed(2)}%.` : isMarathi ? `आत्मविश्वास: ${Number(context.confidence).toFixed(2)}%.` : `Confidence: ${Number(context.confidence).toFixed(2)}%.`);
                }
                return parts.join('\n\n');
            }

            async function handleLuiLanguageRequest(data) {
                const lang = ['hi', 'mr'].includes(data?.language) ? data.language : 'en';
                const messageId = String(data?.messageId || '');
                if (!messageId) return;

                const cacheEntry = lui.explanationCache.get(messageId) || {};
                const cached = cleanLuiBridgeText(cacheEntry?.[lang] || '');
                const cachedSource = cleanLuiBridgeText(lui.resultContextCache.get(messageId)?.sourceText || '');
                const cachedValidated = cacheEntry?.translationValidation?.[lang] === true
                    && !!cachedSource
                    && !!cached;
                if (cached && cachedValidated) {
                    luiDbg('language:cache-hit', { messageId, language: lang, length: cached.length, validated: true });
                    luiPost('LUI_EXPLANATION', { messageId, language: lang, text: cached, validated: true, translationOnly: true, validationSchema: 'v5', sourceLanguage: 'en' });
                    return;
                }
                if (cached && !cachedValidated) {
                    // Never trust a legacy/in-memory localized value that lacks the
                    // current validation marker. Force a fresh translation from English.
                    cacheEntry[lang] = '';
                    cacheEntry.translationValidation = cacheEntry.translationValidation || {};
                    cacheEntry.translationValidation[lang] = false;
                    lui.explanationCache.set(messageId, cacheEntry);
                }

                // Translation is anchored to the exact result that owns this messageId.
                // The current Workbench tab/asset is never substituted for an older result.
                const context = lui.resultContextCache.get(messageId) || {
                    sessionId: data?.sessionId || '',
                    assetId: data?.assetId || '',
                    generation: data?.generation ?? null,
                    tab: String(data?.tab || lui.currentTab || '').toLowerCase()
                };
                if (!context.assetId || !lui.frameReady) {
                    luiDbgWarn('language:skip', { messageId, language: lang, reason: !context.assetId ? 'no_result_asset' : 'frame_not_ready' });
                    return;
                }

                const inFlightKey = `${messageId}::${lang}`;
                let request = lui.explanationInFlight.get(inFlightKey);
                if (!request) {
                    // At most one backend request may be in flight for a given result/language.
                    // Repeated clicks share this same promise instead of issuing duplicate work.
                    request = streamTranslationText(`${API_BASE_URL}/api/chat/debrief`, {
                        session_id: context.sessionId || b.sessionId,
                        asset_id: context.assetId,
                        generation: context.generation,
                        tab: context.tab || String(data?.tab || '').toLowerCase(),
                        language: lang,
                        translation_only: true,
                        source_language: 'en',
                        source_text: context.sourceText || ''
                    });
                    lui.explanationInFlight.set(inFlightKey, request);
                } else {
                    luiDbg('language:inflight-hit', { messageId, language: lang });
                }

                try {
                    const result = await request;
                    const out = cleanLuiBridgeText(result?.text || '');
                    if (
                        result?.validated !== true
                        || result?.translationOnly !== true
                        || result?.validationSchema !== 'v5'
                        || result?.sourceLanguage !== 'en'
                        || !out
                    ) {
                        luiDbgWarn('language:rejected', { messageId, language: lang, validated: !!result?.validated, translationOnly: result?.translationOnly === true, validationSchema: result?.validationSchema || '', sourceLanguage: result?.sourceLanguage || '', length: out.length });
                        luiPost('LUI_EXPLANATION_UNAVAILABLE', { messageId, language: lang });
                    } else {
                        const entry = lui.explanationCache.get(messageId) || { en: '', hi: '', mr: '' };
                        entry[lang] = out;
                        entry.translationValidation = entry.translationValidation || {};
                        entry.translationValidation[lang] = true;
                        lui.explanationCache.set(messageId, entry);
                        luiPost('LUI_EXPLANATION', { messageId, language: lang, text: out, validated: true, translationOnly: true, validationSchema: 'v5', sourceLanguage: 'en' });
                    }
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        luiDbgWarn('language:unavailable', { messageId, language: lang, reason: e?.message || String(e) });
                        luiPost('LUI_EXPLANATION_UNAVAILABLE', { messageId, language: lang });
                    }
                } finally {
                    if (lui.explanationInFlight.get(inFlightKey) === request) lui.explanationInFlight.delete(inFlightKey);
                }
            }

                const safeCase = String(currentCaseId() || b.sessionId || 'UNASSIGNED').replace(/[^a-z0-9_-]+/gi, '_');
                a.href = url;
                a.download = `LinguaShield-Case-Ledger-${safeCase}.csv`;
                const filename = a.download;
                document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                if (lui.frameReady) {
                    luiPost('LUI_CASE_LEDGER_READY', { count: rows.length, filename });
                }
                setLuiFabExpression(lui.expression);
                return { count: rows.length, filename };
            }

            function openLuiExport(scope = 'session') {
                try {
                    const api = luiFrame?.contentWindow?.LUI;
                    if (!api?.openExport) return false;
                    const doc = luiFrame.contentDocument;
                    const radio = doc?.querySelector(`input[name="luiV2ExportScope"][value="${scope}"]`);
                    if (radio) radio.checked = true;
                    api.openExport();
                    return true;
                } catch (_) { return false; }
            }

            function setLuiHostLanguage(lang) {
                const selected = ['en', 'hi', 'mr'].includes(lang) ? lang : 'en';
                lui.language = selected;
                localStorage.setItem('lingua_language', selected);
                try {
                    const api = luiFrame?.contentWindow?.LUI;
                    if (api?.setLanguage) api.setLanguage(selected);

                recordLuiLedgerEvent('LANGUAGE_CHANGED', lui.currentTab, { language: selected }, { language: selected });

            document.getElementById('lui-export-btn')?.addEventListener('click', () => openLuiExport('session'));

            document.getElementById('lui-host-language')?.addEventListener('change', e => setLuiHostLanguage(e.target.value));

            // Same-origin primary bridge for child -> parent chat. postMessage remains
            // the fallback for every other integration event.
            window.LINGUASHIELD_LUI_HOST = Object.freeze({
                chat: payload => handleLuiChatRequest(payload || {})
            });

            window.addEventListener('message', async event => {
                if (event.source !== luiFrame?.contentWindow) {
                    if (window.__LINGUASHIELD_LUI_DEBUG__) luiDbgWarn('bridge:ignored-message', { reason: 'source_mismatch', origin: event.origin, type: event?.data?.type || '' });
                    return;
                }
                if (event.origin !== window.location.origin) {
                    luiDbgWarn('bridge:ignored-message', { reason: 'origin_mismatch', origin: event.origin, expected: window.location.origin, type: event?.data?.type || '' });
                    return;
                }
                const data = event.data;
                if (!data || typeof data !== 'object') return;
                const p = data.payload || {};
                luiDbg('bridge:child->host', { type: data.type, payload: luiDebugPayload(p, 1300) });
                if (data.type === 'LUI_READY') {
                    lui.frameReady = true;
                    updateLuiHostToolbarMeta();
                    syncLuiContext();
                    syncLuiExpressionToFrame(lui.expression || 'idle', luiExpressionRevision);

                    // Deliver authoritative investigation/chat records only after the
                    // child has explicitly declared itself ready. Do not put a tab
                    // briefing after a pending/current result.
                    const hadPendingResult = !!lui.pendingResult;
                    const hadPendingAssistant = !!lui.pendingAssistant;
                    const resultSent = dispatchPendingLuiResult();
                    const assistantSent = dispatchPendingLuiAssistant();
                    luiDbg('ready:delivery-summary', { hadPendingResult, hadPendingAssistant, resultSent, assistantSent, resultClaimCount: lui.resultClaimedKeys.size });
                    const activeResultKey = luiResultKey(lui.currentTab, b.assetId, b.generation);
                    const activeResultClaimed = lui.resultClaimedKeys.has(activeResultKey);
                    requestAnimationFrame(() => {
                        if (!hadPendingResult && !lui.pendingResult && !activeResultClaimed) announceLuiTab(lui.currentTab);
                    });
                    return;
                }
                if (data.type === 'LUI_RESULT_ACK') {
                    luiDbg('result:ack', { messageId: p.messageId, success: p.success, error: p.error || '' });
                    if (p.messageId && lui.pendingResult?.messageId === p.messageId && p.success !== false) {
                        lui.resultAckedId = p.messageId;
                        lui.pendingResult = null;
                    }
                    return;
                }
                if (data.type === 'LUI_ASSISTANT_ACK') {
                    luiDbg('assistant:ack', { messageId: p.messageId, success: p.success, error: p.error || '' });
                    if (p.messageId && lui.pendingAssistant?.messageId === p.messageId && p.success !== false) {
                        lui.assistantAckedId = p.messageId;
                        lui.pendingAssistant = null;
                    }
                    return;
                }
                if (data.type === 'LUI_EXPRESSION_CHANGED' || data.type === 'LUI_EXPRESSION_APPLIED') {
                    const childState = String(p.state || data.state || '').toLowerCase();
                    const childRevision = Number(p.revision ?? data.revision ?? -1);
                    if (childState !== lui.expression || (childRevision >= 0 && childRevision < luiExpressionRevision)) {
                        syncLuiExpressionToFrame(lui.expression, luiExpressionRevision);
                    }
                    return;
                }
                if (data.type === 'LUI_EXPRESSION_REQUEST') {
                    const requested = String(p.state || data.state || 'idle').toLowerCase();
                    if (requested === 'inquisitive' && !lui.streaming && ['idle', 'inquisitive'].includes(lui.expression)) {
                        setLuiExpression('inquisitive', true);
                    }
                    return;
                }
                if (data.type === 'LUI_CHAT_REQUEST') { await handleLuiChatRequest(p); return; }
                if (data.type === 'LUI_LANGUAGE_REQUEST') { await handleLuiLanguageRequest(p); return; }
                if (data.type === 'LUI_LANGUAGE_CHANGED') {
                    const selected = String(p.language || 'en');
                    lui.language = ['en', 'hi', 'mr'].includes(selected) ? selected : 'en';
                    localStorage.setItem('lingua_language', lui.language);
                    recordLuiLedgerEvent('LANGUAGE_CHANGED', lui.currentTab, { language: selected }, { language: selected });
                    updateLuiHostToolbarMeta();
                    syncLuiContext();
                    return;
                }
                if (data.type === 'LUI_HISTORY_REQUEST') { sendLuiHistory(); return; }
                if (data.type === 'LUI_EXPORT_REQUEST' && p.scope === 'history') { exportHistoryToBrowser(p); return; }
            });

            if (luiExpressionChannel) {
                luiExpressionChannel.addEventListener('message', event => {
                    const m = event.data || {};
                    const state = String(m.state || '').toLowerCase();
                    const revision = Number(m.revision);
                    if (!LUI_FAB_STATES.has(state) || !Number.isFinite(revision)) return;
                    if (revision > luiExpressionRevision) {
                        luiExpressionRevision = revision;
                        lui.expression = state;
                        setLuiFabExpression(state);
                        if (['working', 'processing', 'suspect', 'riskfree'].includes(state)) stopLuiAmbientCycle();
                    }
                });
            }

            function installLuiIntegration() {
                luiDbg('integration:install', { sessionId: b.sessionId, tab: lui.currentTab, expression: lui.expression });
                // Both surfaces start from the same neutral state. The child then
                // follows this authoritative state through direct sync + fallback buses.
                setLuiExpression('idle', true);
                setLuiFabExpression('idle');
                setLuiAvailability(lui.currentTab);
                announceLuiTab(lui.currentTab);
                startLuiExpressionWatchdog();
            }

            installLuiIntegration();

            function setStatus(t, ok = true) {
                statusEl.textContent = t;
                document.querySelector('.ls-dot').style.background = ok ? 'var(--ok)' : 'var(--critical)';
            }

            function shell(k, t, d, e, body) {
                stage.innerHTML = `<section class="ls-workspace"><div class="ls-workspace-head"><div><div class="ls-kicker">${k}</div><div class="ls-title">${t}</div><div class="ls-desc">${d}</div></div><div class="ls-endpoint">${e}</div></div><div class="ls-workspace-body">${body}</div><div id="ls-result"></div></section>`;
            }

            function getTextSignals(data) {
                const vectors = data?.manipulation_vectors
                    || data?.manipulation_signals
                    || data?.signals?.manipulation
                    || {};

                const readNumber = (...keys) => {
                    for (const key of keys) {
                        const value = vectors?.[key];

                        if (value === null || value === undefined || value === '') {
                            continue;
                        }

                        const number = Number(value);

                        if (!Number.isFinite(number)) {
                            continue;
                        }

                        return pct(number <= 1 ? number * 100 : number);
                    }

                    return null;
                };

                return {
                    urgency: readNumber(
                        'urgency',
                        'urgency_pressure',
                        'urgency_score'
                    ),
                    authority: readNumber(
                        'authority',
                        'authority_claim',
                        'authority_score'
                    ),
                    isolation: readNumber(
                        'isolation',
                        'isolation_pressure',
                        'isolation_score'
                    ),
                    financialLure: readNumber(
                        'compound_financial_lure_score',
                        'financial_lure_score'
                    )
                };
            }

            function getDisplayedSignalValue(value) {
                return value === null ? 'N/R' : `${value.toFixed(0)}%`;
            }

            function getDisplayedConfidence(value) {
                const number = Number(value);

                if (!Number.isFinite(number)) {
                    return '—';
                }

                return `${number.toFixed(2)}%`;
            }

            function classifyTextCues(text) {
                const groups = [
                    {
                        name: 'URGENT',
                        pattern: /\b(?:immediately|urgent|urgently|now|today|asap|right away|within\s+(?:\d+\s+)?minutes?|within\s+\d+\s+hours?)\b/i,
                    },
                    {
                        name: 'AUTHORITY',
                        pattern: /\b(?:bank|manager|officer|police|government|security|support|department|official|administrator|account\s+manager)\b/i,
                    },
                    {
                        name: 'ACTION',
                        pattern: /\b(?:verify|verification|confirm|send|pay|transfer|click|open|share|provide|submit|download|call|reply)\b/i,
                    },
                    {
                        name: 'CONSEQUENCE',
                        pattern: /\b(?:suspend|suspended|blocked|freeze|frozen|close|closed|penalty|fine|arrest|terminate|lose|lost|deactivate)\b/i,
                    },
                    {
                        name: 'ISOLATION',
                        pattern: /\b(?:don't\s+tell|do\s+not\s+tell|keep\s+this\s+private|confidential|only\s+you|stay\s+on\s+the\s+line|do\s+not\s+contact)\b/i,
                    },
                    {
                        name: 'RISK_CLAIM',
                        pattern: /\b(?:flagged|suspicious|suspicious\s+activity|account\s+issue|security\s+alert)\b/i,
                    }
                ];

                const tokenPattern = /\b(?:account|manager|flagged|suspicious|verification|verify|identity|immediately|urgent|urgently|suspended|suspend|blocked|freeze|confirm|payment|pay|transfer|click|official|police|security|confidential|private|only|send|share|provide|submit)\b/gi;
                const tokens = [];
                let match;

                while ((match = tokenPattern.exec(text)) !== null) {
                    let signal = '';

                    for (const group of groups) {
                        if (group.pattern.test(match[0])) {
                            signal = group.name;
                            break;
                        }
                    }

                    tokens.push({
                        start: match.index,
                        end: match.index + match[0].length,
                        word: match[0],
                        signal
                    });
                }

                return tokens;
            }

            function pressureMarkup(text) {
                const cues = classifyTextCues(text);
                const classified = cues
                    .filter(cue => cue.signal)
                    .sort((a, b) => a.start - b.start);

                let output = '';
                let position = 0;

                classified.forEach(cue => {
                    if (cue.start < position) {
                        return;
                    }

                    output += esc(text.slice(position, cue.start));
                    output += `<span class="ls-pressure-token" data-signal="${esc(cue.signal)}" data-word="${esc(cue.word)}">${esc(cue.word)}</span>`;
                    position = cue.end;
                });

                output += esc(text.slice(position));

                return {
                    html: output,
                    cues: classified
                };
            }

            function groupLexicalCues(cues) {
                const groups = new Map();

                cues.forEach(cue => {
                    if (!cue.signal) {
                        return;
                    }

                    if (!groups.has(cue.signal)) {
                        groups.set(cue.signal, []);
                    }

                    groups.get(cue.signal).push(cue.word);
                });

                return groups;
            }

            function buildPressureChain(cues) {
                const orderedSignals = [];
                const seen = new Set();

                cues.forEach(cue => {
                    if (!cue.signal || seen.has(cue.signal)) {
                        return;
                    }

                    seen.add(cue.signal);
                    orderedSignals.push(cue.signal);
                });

                if (!orderedSignals.length) {
                    return `
                        <div class="ls-empty-data">
                            No lexical pressure chain was detected in the supplied text.
                        </div>
                    `;
                }

                return `
                    <div class="ls-pressure-chain-row">
                        ${orderedSignals.map((signal, index) => `
                            ${index > 0 ? '<span class="ls-chain-link">→</span>' : ''}
                            <button
                                type="button"
                                class="ls-chain-node"
                                data-chain-signal="${esc(signal)}"
                            >
                                ${esc(signal)}
                            </button>
                        `).join('')}
                    </div>
                `;
            }

            function renderSignalRows(signals) {
                const rows = [
                    {
                        key: 'urgency',
                        label: 'Urgency',
                        className: '',
                    },
                    {
                        key: 'authority',
                        label: 'Authority',
                        className: 'authority',
                    },
                    {
                        key: 'isolation',
                        label: 'Isolation',
                        className: 'isolation',
                    },
                    {
                        key: 'financialLure',
                        label: 'Financial lure',
                        className: 'financial',
                    }
                ];

                return rows.map(row => {
                    const value = signals[row.key];
                    const width = value === null ? 0 : value;

                    return `
                        <div class="ls-signal-row">
                            <div class="ls-signal-name">${esc(row.label)}</div>
                            <div class="ls-signal-track">
                                <div
                                    class="ls-signal-fill ${esc(row.className)}"
                                    style="width:${width.toFixed(1)}%"
                                ></div>
                            </div>
                            <div class="ls-signal-value">${esc(getDisplayedSignalValue(value))}</div>
                        </div>
                    `;
                }).join('');
            }

            function renderLexicalCueSummary(groupedCues) {
                if (!groupedCues.size) {
                    return `
                        <div class="ls-empty-data">
                            No lexical cue groups were detected in the supplied text.
                        </div>
                    `;
                }

                const labels = {
                    URGENT: 'Urgency',
                    AUTHORITY: 'Authority',
                    ACTION: 'Action',
                    CONSEQUENCE: 'Consequence',
                    ISOLATION: 'Isolation',
                    RISK_CLAIM: 'Risk context'
                };

                return Array.from(groupedCues.entries()).map(([signal, words]) => {
                    const uniqueWords = [...new Set(words)];

                    return `
                        <span
                            class="ls-cue-chip"
                            data-cue-signal="${esc(signal)}"
                            title="${esc(uniqueWords.join(', '))}"
                        >
                            ${esc(labels[signal] || signal)} · ${uniqueWords.length}
                        </span>
                    `;
                }).join('');
            }

            function getSignalLabel(signal) {
                const labels = {
                    URGENT: 'Urgency',
                    AUTHORITY: 'Authority',
                    ACTION: 'Action',
                    CONSEQUENCE: 'Consequence',
                    ISOLATION: 'Isolation',
                    RISK_CLAIM: 'Risk context'
                };

                return labels[signal] || signal;
            }

            function buildRelationshipGraph(cues) {
                const ordered = [];
                const seen = new Set();

                cues.forEach(cue => {
                    if (!cue.signal || seen.has(cue.signal)) {
                        return;
                    }

                    seen.add(cue.signal);
                    ordered.push(cue.signal);
                });

                if (!ordered.length) {
                    return `
                        <div class="ls-empty-data">
                            No classified lexical cues were detected in the supplied text.
                        </div>
                    `;
                }

                const counts = ordered.reduce((acc, signal) => {
                    acc[signal] = cues.filter(cue => cue.signal === signal).length;
                    return acc;
                }, {});

                const positions = ordered.slice(0, 6).map((signal, index, list) => {
                    const width = 1000;
                    const height = 390;
                    const left = 120;
                    const right = 120;
                    const usable = Math.max(1, list.length - 1);
                    const x = list.length === 1
                        ? width / 2
                        : left + ((width - left - right) * index / usable);
                    const y = index % 2 === 0 ? 150 : 245;

                    return { signal, x, y, count: counts[signal] };
                });

                const edgeMarkup = positions.slice(1).map((node, index) => {
                    const prev = positions[index];
                    const midX = (prev.x + node.x) / 2;
                    const midY = Math.min(prev.y, node.y) - 42;

                    return `
                        <path
                            class="ls-graph-edge-line"
                            data-from="${esc(prev.signal)}"
                            data-to="${esc(node.signal)}"
                            d="M ${prev.x} ${prev.y} Q ${midX} ${midY} ${node.x} ${node.y}"
                            fill="none"
                            marker-end="url(#ls-graph-arrow)"
                        ></path>
                    `;
                }).join('');

                const nodeMarkup = positions.map(node => `
                    <g
                        class="ls-graph-node-group"
                        data-graph-signal="${esc(node.signal)}"
                        tabindex="0"
                        role="button"
                        aria-label="${esc(getSignalLabel(node.signal))} lexical cue group"
                    >
                        <circle
                            class="ls-graph-node-circle"
                            cx="${node.x}"
                            cy="${node.y}"
                            r="38"
                        ></circle>
                        <text class="ls-graph-node-index" x="${node.x}" y="${node.y - 52}">${String(positions.indexOf(node) + 1).padStart(2, '0')}</text>
                        <text class="ls-graph-node-label" x="${node.x}" y="${node.y - 3}">${esc(getSignalLabel(node.signal).toUpperCase())}</text>
                        <text class="ls-graph-node-count" x="${node.x}" y="${node.y + 14}">${node.count} CUE${node.count === 1 ? '' : 'S'}</text>
                    </g>
                `).join('');

                return `
                    <div class="ls-forensic-graph">
                        <div class="ls-forensic-graph-head">
                            <div>
                                <div class="ls-panel-cap" style="padding:0;border:0">LINGUISTIC CUE SEQUENCE · OBSERVED ORDER</div>
                                <div class="ls-graph-head-sub">The arrows indicate order of detected lexical cue groups only.</div>
                            </div>
                            <div class="ls-forensic-graph-note">Observed order only · not author intent</div>
                        </div>

                        <div class="ls-graph-wrap">
                            <div class="ls-graph-order-rail" aria-hidden="true">
                                <span>01</span><i></i><span>02</span><i></i><span>03</span><i></i><span>04</span><i></i><span>05</span>
                            </div>
                            <svg class="ls-graph-svg" viewBox="0 0 1000 390" role="img" aria-label="Observed lexical cue sequence graph">
                                <defs>
                                    <marker id="ls-graph-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                                        <path d="M0,0 L8,4 L0,8 z" fill="rgba(121,197,207,.50)"></path>
                                    </marker>
                                </defs>
                                ${edgeMarkup}
                                ${nodeMarkup}
                            </svg>
                        </div>

                        <div class="ls-graph-legend">
                            ${ordered.slice(0, 6).map((signal, index) => `
                                <span><b>${String(index + 1).padStart(2, '0')}</b>${esc(getSignalLabel(signal))} · ${counts[signal]}</span>
                            `).join('')}
                            <em>01 → ${String(ordered.slice(0, 6).length).padStart(2, '0')} observed sequence</em>
                        </div>
                    </div>
                `;
            }

            function splitTextIntoSentences(text) {
                return text
                    .split(/(?<=[.!?])\s+/)
                    .map(sentence => sentence.trim())
                    .filter(Boolean);
            }

            function buildSentencePressureFlow(text) {
                const sentences = splitTextIntoSentences(text);

                if (!sentences.length) {
                    return `
                        <div class="ls-empty-data">
                            No sentence-level source text is available for this view.
                        </div>
                    `;
                }

                const sentenceData = sentences.map((sentence, index) => {
                    const cues = classifyTextCues(sentence).filter(cue => cue.signal);
                    return { sentence, index, cues };
                });

                const maxCueCount = Math.max(1, ...sentenceData.map(item => item.cues.length));

                return `
                    <div class="ls-sentence-flow">
                        <div class="ls-panel-cap">SENTENCE PRESSURE FLOW · LEXICAL CUE COUNT</div>

                        ${sentenceData.map(item => {
                    const grouped = groupLexicalCues(item.cues);
                    const density = Math.round((item.cues.length / maxCueCount) * 100);

                    return `
                                <article class="ls-sentence-row">
                                    <div class="ls-sentence-index">S${String(item.index + 1).padStart(2, '0')}</div>
                                    <div class="ls-sentence-copy">${esc(item.sentence)}</div>

                                    <div class="ls-sentence-cues">
                                        ${grouped.size
                            ? Array.from(grouped.entries()).map(([signal, words]) => `
                                                <button
                                                    type="button"
                                                    class="ls-sentence-cue"
                                                    data-sentence-signal="${esc(signal)}"
                                                    title="${esc([...new Set(words)].join(', '))}"
                                                >
                                                    ${esc(getSignalLabel(signal))}
                                                    <em>${[...new Set(words)].length}</em>
                                                </button>
                                            `).join('')
                            : '<span class="ls-sentence-cue" style="cursor:default">No classified cues</span>'}
                                    </div>

                                    <div class="ls-sentence-density">
                                        <label>Relative cue load</label>
                                        <div class="ls-sentence-density-track">
                                            <span class="ls-sentence-density-fill" style="width:${density}%"></span>
                                        </div>
                                        <b>${item.cues.length}</b>
                                    </div>
                                </article>
                            `;
                }).join('')}
                    </div>
                `;
            }

            function wireTextRelationshipInteractions(root) {
                const nodeGroups = [...root.querySelectorAll('[data-graph-signal]')];
                const tokens = [...root.querySelectorAll('.ls-pressure-token')];

                const clear = () => {
                    nodeGroups.forEach(node => node.classList.remove('active', 'is-dimmed'));
                    tokens.forEach(token => token.classList.remove('is-linked', 'is-dimmed'));
                };

                const highlight = signal => {
                    nodeGroups.forEach(node => {
                        const match = node.dataset.graphSignal === signal;
                        node.classList.toggle('active', match);
                        node.classList.toggle('is-dimmed', !match);
                    });

                    tokens.forEach(token => {
                        const match = token.dataset.signal === signal;
                        token.classList.toggle('is-linked', match);
                        token.classList.toggle('is-dimmed', !match);
                    });
                };

                nodeGroups.forEach(node => {
                    node.addEventListener('mouseenter', () => highlight(node.dataset.graphSignal));
                    node.addEventListener('mouseleave', clear);
                    node.addEventListener('focus', () => highlight(node.dataset.graphSignal));
                    node.addEventListener('blur', clear);
                });
            }

            function wireSentenceFlowInteractions(root) {
                const controls = [...root.querySelectorAll('[data-sentence-signal]')];

                controls.forEach(control => {
                    control.addEventListener('mouseenter', () => {
                        controls.forEach(item => {
                            item.classList.toggle('active', item.dataset.sentenceSignal === control.dataset.sentenceSignal);
                        });
                    });

                    control.addEventListener('mouseleave', () => {
                        controls.forEach(item => item.classList.remove('active'));
                    });
                });
            }

            function textResultView(kind, data) {
                const text = String(
                    data?.__input_text
                    || data?.extracted_text
                    || data?.processed_text
                    || ''
                );

                const signals = getTextSignals(data);
                const pressure = pressureMarkup(text);
                const groupedCues = groupLexicalCues(pressure.cues);
                const textContext = data?.text_context || {};
                const explanation = data?.forensic_explanation || data?.forensicExplanation || {};

                const verdict = data?.is_scam === true
                    ? 'THREAT'
                    : norm(
                        data?.risk_classification
                        || data?.decision_basis
                        || textContext?.decision_basis
                        || 'RESULT RETURNED'
                    );

                const confidence = pct(data?.confidence);

                if (kind === 'pressure') {
                    return `
                        <div class="ls-text-visual">
                            <div class="ls-pressure-layout">
                                <section class="ls-pressure-panel">
                                    <div class="ls-panel-cap">
                                        LINGUISTIC PRESSURE MAP · SUPPLIED TEXT

            function getForensicScenario(data) {
                const raw = String(data?.risk_classification || '').trim();
                const upper = raw.toUpperCase();
                if (!raw || upper.includes('CLEARED') || upper.includes('LOW RISK') || upper.includes('NO THREAT')) {
                    return { label: 'NO ATTACK SCENARIO', detail: 'No threat scenario returned', isThreat: false };
                }

                const mappings = [
                    ['DIGITAL ARREST', 'DIGITAL ARREST / AUTHORITY IMPERSONATION'],
                    ['BANK / FINANCIAL IMPERSONATION', 'BANK / FINANCIAL IMPERSONATION'],
                    ['FINANCIAL INVESTMENT TRAP', 'FINANCIAL INVESTMENT / CRYPTO SCAM'],
                    ['DEVICE TAKEOVER', 'DEVICE / REMOTE ACCESS TAKEOVER'],
                    ['REMOTE ACCESS TAKEOVER', 'DEVICE / REMOTE ACCESS TAKEOVER'],
                    ['CREDENTIAL HARVESTING', 'CREDENTIAL HARVESTING / PHISHING'],
                    ['PHISHING', 'PHISHING / ACCOUNT TAKEOVER'],
                    ['REFUND / INVOICE FRAUD', 'REFUND / INVOICE FRAUD'],
                    ['CORPORATE / CEO IMPERSONATION', 'CORPORATE / CEO IMPERSONATION'],
                    ['CORPORATE CEO IMPERSONATION', 'CORPORATE / CEO IMPERSONATION'],
                    ['ROMANCE SCAM', 'ROMANCE / RELATIONSHIP SCAM'],
                    ['URGENCY EXPLOITATION', 'URGENCY / PRESSURE EXPLOITATION'],
                    ['SOCIAL ENGINEERING', 'SOCIAL ENGINEERING'],
                ];
                const hit = mappings.find(([key]) => upper.includes(key));
                if (hit) return { label: hit[1], detail: raw, isThreat: true };

                const colon = raw.indexOf(':');
                const detail = colon >= 0 ? raw.slice(colon + 1).trim() : raw;
                return { label: detail || 'THREAT SCENARIO', detail: raw, isThreat: true };
            }

            // Single source of truth for voice-origin presentation across the UI.
            // 0–35% HUMAN | 36–39% INCONCLUSIVE | 40–100% AI
            const VOICE_HUMAN_MAX = 35;
            const VOICE_AI_MIN = 40;
            const classifyVoiceOrigin = (scoreRaw, detected = false, decision = '') => {
                const score = Number(scoreRaw);
                if (Number.isFinite(score)) {
                    if (score >= VOICE_AI_MIN) return { state: 'AI', cls: 'ls-origin-ai', label: 'AI', big: 'AI-GENERATED VOICE', note: 'AI-origin signal is in the AI range (40–100%).' };
                    if (score <= VOICE_HUMAN_MAX) return { state: 'HUMAN', cls: 'ls-origin-human', label: 'HUMAN', big: 'HUMAN VOICE', note: 'AI-origin signal is in the human range (0–35%).' };
                    return { state: 'INCONCLUSIVE', cls: 'ls-origin-inconclusive', label: 'INCONCLUSIVE', big: 'INCONCLUSIVE', note: 'AI-origin signal is between the human and AI thresholds (36–39%).' };
                }
                const d = String(decision || '').toUpperCase();
                if (detected || d === 'AI_GENERATED_LIKELY') return { state: 'AI', cls: 'ls-origin-ai', label: 'AI', big: 'AI-GENERATED VOICE', note: 'Backend returned an explicit synthetic-voice finding.' };
                if (d === 'HUMAN_LIKE') return { state: 'HUMAN', cls: 'ls-origin-human', label: 'HUMAN', big: 'HUMAN VOICE', note: 'Backend returned an explicit human-like finding.' };
                return { state: 'INCONCLUSIVE', cls: 'ls-origin-inconclusive', label: 'INCONCLUSIVE', big: 'INCONCLUSIVE', note: 'No conclusive AI-origin score was returned.' };
            };

            function layoutTrustPathConnections() {
                const map = document.querySelector('.ls-tp3-correlation-map');
                const svg = map?.querySelector('.ls-tp3-connection-overlay');
                const routeLayer = svg?.querySelector('.tp3-routes');
                if (!map || !svg || !routeLayer) return;

                const node = (sel) => map.querySelector(sel);
                const isBiometric = Boolean(node('.m-id'));
                const nodes = {
                    text: node('.m-text'),
                    visual: node('.m-visual'),
                    acoustic: isBiometric ? node('.m-id') : node('.m-audio')
                };
                const box = map.getBoundingClientRect();
                if (!box.width || !box.height || Object.values(nodes).some(n => !n)) return;

                const center = (el) => {
                    const r = el.getBoundingClientRect();
                    return {
                        x: r.left - box.left + r.width / 2,
                        y: r.top - box.top + r.height / 2
                    };
                };

                const edgePoint = (a, b) => {
                    const ra = a.getBoundingClientRect();
                    const rb = b.getBoundingClientRect();
                    const ac = center(a), bc = center(b);
                    const dx = bc.x - ac.x, dy = bc.y - ac.y;
                    const len = Math.hypot(dx, dy) || 1;
                    const ux = dx / len, uy = dy / len;
                    const halfW = ra.width / 2, halfH = ra.height / 2;
                    const halfWb = rb.width / 2, halfHb = rb.height / 2;
                    const scaleA = Math.min(Math.abs(halfW / (ux || 1e-6)), Math.abs(halfH / (uy || 1e-6)));
                    const scaleB = Math.min(Math.abs(halfWb / (ux || 1e-6)), Math.abs(halfHb / (uy || 1e-6)));
                    return {
                        x1: ac.x + ux * scaleA,
                        y1: ac.y + uy * scaleA,
                        x2: bc.x - ux * scaleB,
                        y2: bc.y - uy * scaleB
                    };
                };

                svg.setAttribute('viewBox', `0 0 ${Math.max(1, box.width)} ${Math.max(1, box.height)}`);
                svg.setAttribute('preserveAspectRatio', 'none');

                const links = [
                    ['text', 'visual'],
                    ['text', 'acoustic'],
                    ['visual', 'acoustic']
                ];
                routeLayer.innerHTML = '';
                const routeState = (aName, bName) => {
                    const A = aName.toUpperCase(), B = bName.toUpperCase();
                    const returned = pairList.some(p =>
                        ((p.a.includes(A) && p.b.includes(B)) || (p.a.includes(B) && p.b.includes(A))) &&
                        p.status !== 'NO RETURNED LINK'
                    );
                    if (returned) return 'returned';
                    const contextual = isBiometric && (
                        (A === 'TEXT' && B === 'ACOUSTIC') ||
                        (A === 'ACOUSTIC' && B === 'TEXT') ||
                        (A === 'VISUAL' && B === 'ACOUSTIC') ||
                        (A === 'ACOUSTIC' && B === 'VISUAL')
                    );
                    return contextual ? 'context' : null;
                };

                links.forEach(([aName, bName]) => {
                    const state = routeState(aName, bName);
                    if (!state || !nodes[aName] || !nodes[bName]) return;
                    const p = edgePoint(nodes[aName], nodes[bName]);
                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                    line.setAttribute('class', `tp3-route ${state === 'returned' ? 'active' : 'context'}`);
                    line.setAttribute('x1', p.x1.toFixed(2));
                    line.setAttribute('y1', p.y1.toFixed(2));
                    line.setAttribute('x2', p.x2.toFixed(2));
                    line.setAttribute('y2', p.y2.toFixed(2));
                    routeLayer.appendChild(line);
                });
            }

                const voiceClassification = classifyVoiceOrigin(syntheticScore, syntheticDetected);

                    const mappings = [

            function getVisualSignalData(data) {
                const signals = getTextSignals(data);
                return [

                    { key: 'authority', label: 'Authority', value: signals.authority },
                    { key: 'isolation', label: 'Isolation', value: signals.isolation },
                    { key: 'financial', label: 'Financial lure', value: signals.financialLure }
                ];
            }

            function formatVisualExplanation(value) {
                if (value === null || value === undefined || value === '') {
                    return '';
                }

                if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') {
                    return String(value);
                }

                if (Array.isArray(value)) {
                    return value
                        .map(item => formatVisualExplanation(item))
                        .filter(Boolean)
                        .join('\n\n');
                }

                if (typeof value === 'object') {
                    const preferred = [
                        ['english', 'EN'], ['en', 'EN'],
                        ['hindi', 'HI'], ['hi', 'HI'],
                        ['marathi', 'MR'], ['mr', 'MR'],
                        ['summary', 'SUMMARY'], ['explanation', 'EXPLANATION'],
                        ['text', 'TEXT'], ['message', 'MESSAGE']
                    ];

                    const rendered = [];
                    const used = new Set();

                    preferred.forEach(([key, label]) => {
                        if (Object.prototype.hasOwnProperty.call(value, key)) {
                            const text = formatVisualExplanation(value[key]);
                            if (text) {
                                rendered.push(`${label}\n${text}`);
                                used.add(key);
                            }
                        }
                    });

                    Object.entries(value).forEach(([key, item]) => {
                        if (used.has(key)) return;
                        const text = formatVisualExplanation(item);
                        if (text) {
                            rendered.push(`${norm(key)}\n${text}`);
                        }
                    });

                    return rendered.join('\n\n');
                }

                return String(value);
            }

                    return {
                        x: rect.left - stageRect.left,
                        y: rect.top - stageRect.top,
                        w: rect.width,
                        h: rect.height
                    };

                    const minSize = Math.max(42, Math.min(cropImageRect.w, cropImageRect.h) * .08);

                    cropBox.style.left = `${cropImageRect.x + cropState.x}px`;
                    cropBox.style.top = `${cropImageRect.y + cropState.y}px`;
                    cropBox.style.width = `${cropState.w}px`;
                    cropBox.style.height = `${cropState.h}px`;
                };

                const resetCropFrame = () => {
                    cropImageRect = getImageRect();
                    if (!cropImageRect) return;
                    // Default frame is always the complete displayed image (100%).
                    // Users can then shrink/move it deliberately when cropping.
                    cropState.w = cropImageRect.w;
                    cropState.h = cropImageRect.h;
                    cropState.x = 0;
                    cropState.y = 0;
                    renderCropFrame();
                };

                const pointerPosition = event => {
                    const stageRect = cropStage.getBoundingClientRect();
                    return {
                        x: event.clientX - stageRect.left,
                        y: event.clientY - stageRect.top
                    };
                };

                const beginCropInteraction = (event, mode) => {
                    if (!cropImageRect) return;
                    event.preventDefault();
                    const p = pointerPosition(event);
                    const imageX = p.x - cropImageRect.x;
                    const imageY = p.y - cropImageRect.y;
                    cropInteraction = {
                        mode,
                        startX: imageX,
                        startY: imageY,
                        originX: cropState.x,
                        originY: cropState.y,
                        originW: cropState.w,
                        originH: cropState.h
                    };
                    cropStage.setPointerCapture?.(event.pointerId);
                };

                const updateCropInteraction = event => {
                    if (!cropInteraction || !cropImageRect) return;
                    const p = pointerPosition(event);
                    const imageX = p.x - cropImageRect.x;
                    const imageY = p.y - cropImageRect.y;
                    const dx = imageX - cropInteraction.startX;
                    const dy = imageY - cropInteraction.startY;

                    if (cropInteraction.mode === 'move') {
                        cropState.x = cropInteraction.originX + dx;
                        cropState.y = cropInteraction.originY + dy;
                    } else {
                        const minSize = Math.max(42, Math.min(cropImageRect.w, cropImageRect.h) * .08);
                        cropState.w = cropInteraction.originW + dx;
                        cropState.h = cropInteraction.originH + dy;
                        cropState.w = Math.max(minSize, cropState.w);
                        cropState.h = Math.max(minSize, cropState.h);
                    }
                    renderCropFrame();
                };

                const endCropInteraction = () => {
                    if (cropInteraction) cropStatus.textContent = 'FRAME LOCKED';
                    cropInteraction = null;
                };

                const applyCrop = async () => {
                    if (!activeFile || !cropImage.naturalWidth || !cropImage.naturalHeight || !cropImageRect) return;
                    const sx = Math.round((cropState.x / cropImageRect.w) * cropImage.naturalWidth);
                    const sy = Math.round((cropState.y / cropImageRect.h) * cropImage.naturalHeight);
                    const sw = Math.max(1, Math.round((cropState.w / cropImageRect.w) * cropImage.naturalWidth));
                    const sh = Math.max(1, Math.round((cropState.h / cropImageRect.h) * cropImage.naturalHeight));
                    const canvas = document.createElement('canvas');
                    canvas.width = sw;
                    canvas.height = sh;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) {
                        showDialog('Crop unavailable', 'The browser could not create the crop canvas.');
                        return;
                    }

                    cropStatus.textContent = 'RENDERING CROP';
                    ctx.drawImage(cropImage, sx, sy, sw, sh, 0, 0, sw, sh);
                    const blob = await new Promise(resolve => canvas.toBlob(resolve, activeFile.type || 'image/png', .94));
                    if (!blob) {
                        showDialog('Crop unavailable', 'The selected evidence could not be rendered as a cropped image.');
                        cropStatus.textContent = 'ERROR';
                        return;
                    }
                    const croppedName = activeFile.name.replace(/(\.[^.]+)?$/, '-crop$1');
                    const croppedFile = new File([blob], croppedName, { type: blob.type || activeFile.type || 'image/png', lastModified: Date.now() });
                    setInputFile(croppedFile);
                    setPreview(croppedFile);
                    closeCropTool();
                };

                input.onchange = () => {
                    const selected = input.files[0] || null;
                    setPreview(selected);
                };

                cropTrigger.onclick = openCropTool;
                document.getElementById('ls-visual-crop-close').onclick = closeCropTool;
                document.getElementById('ls-visual-crop-cancel').onclick = closeCropTool;
                document.getElementById('ls-visual-crop-reset').onclick = () => {
                    resetCropFrame();
                    cropStatus.textContent = 'FRAME RESET';
                };
                document.getElementById('ls-visual-crop-apply').onclick = () => {
                    applyCrop().catch(e => {
                        cropStatus.textContent = 'ERROR';
                        showDialog('Crop failed', 'The selected crop could not be applied.', e.message);
                    });
                };

                cropBox.addEventListener('pointerdown', event => beginCropInteraction(event, 'move'));
                cropHandle.addEventListener('pointerdown', event => {
                    event.stopPropagation();
                    beginCropInteraction(event, 'resize');
                });
                cropStage.addEventListener('pointermove', updateCropInteraction);
                cropStage.addEventListener('pointerup', endCropInteraction);
                cropStage.addEventListener('pointercancel', endCropInteraction);
                window.addEventListener('resize', () => {

                    if (!cropImageRect || !previousRect) return;
                    const sx = cropImageRect.w / previousRect.w;
                    const sy = cropImageRect.h / previousRect.h;
                    cropState.x = previous.x * sx;
                    cropState.y = previous.y * sy;
                    cropState.w = previous.w * sx;
                    cropState.h = previous.h * sy;
                    renderCropFrame();
                });

                document.getElementById('ls-run').onclick = async () => {
                    const f = activeFile || input.files[0];
                    if (!f)
                        return showDialog('Visual evidence required', 'Choose an image before starting the analysis.');
                    try {

                        setStatus('RESULT READY');
                    }
                    catch (e) {
                        setStatus('ERROR', false);
                        showDialog('Visual analysis failed', 'The backend request could not be completed.', e.message);
                    }
                };
            }


            function acousticSafe(value, fallback = '') {
                if (value === null || value === undefined || value === '') return fallback;
                if (typeof value === 'object') return JSON.stringify(value);
                return String(value);
            }

            function acousticExplanationText(value) {
                if (value === null || value === undefined || value === '') return '';
                if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') return String(value);
                if (Array.isArray(value)) return value.map(item => acousticExplanationText(item)).filter(Boolean).join('\n\n');
                if (typeof value === 'object') {
                    const preferred = [['english', 'EN'], ['en', 'EN'], ['hindi', 'HI'], ['hi', 'HI'], ['marathi', 'MR'], ['mr', 'MR'], ['summary', 'SUMMARY'], ['explanation', 'EXPLANATION'], ['text', 'TEXT'], ['message', 'MESSAGE']];
                    const rendered = [], used = new Set();
                    preferred.forEach(([key, label]) => {
                        if (Object.prototype.hasOwnProperty.call(value, key)) {
                            const text = acousticExplanationText(value[key]);
                            if (text) { rendered.push(`${label}\n${text}`); used.add(key); }
                        }
                    });
                    Object.entries(value).forEach(([key, item]) => {
                        if (used.has(key)) return;
                        const text = acousticExplanationText(item);
                        if (text) rendered.push(`${norm(key)}\n${text}`);
                    });
                    return rendered.join('\n\n');
                }
                return String(value);
            }

            function getAcousticDiagnostics(data) {
                const a = data?.acoustic_forensics || {};
                const d = a?.feature_diagnostics || {};
                return {
                    spectral_centroid_hz: Number(d.spectral_centroid_hz),
                    spectral_centroid_std_hz: Number(d.spectral_centroid_std_hz),
                    spectral_bandwidth_hz: Number(d.spectral_bandwidth_hz),
                    spectral_flatness: Number(d.spectral_flatness),
                    high_frequency_ratio_3khz: Number(d.high_frequency_ratio_3khz),
                    high_frequency_ratio_4khz: Number(d.high_frequency_ratio_4khz),
                    normalized_spectral_flux: Number(d.normalized_spectral_flux),
                    energy_cv: Number(d.energy_cv),
                    zcr_dispersion: Number(d.zcr_dispersion)
                };
            }

            function acousticDiagnosticRows(diag) {
                const rows = [
                    ['CENTROID', diag.spectral_centroid_hz, 'Hz', 2200, v => Math.min(v / 2200 * 100, 100)],
                    ['BANDWIDTH', diag.spectral_bandwidth_hz, 'Hz', 1800, v => Math.min(v / 1800 * 100, 100)],
                    ['FLATNESS', diag.spectral_flatness, '', .25, v => Math.min(v / .25 * 100, 100)],
                    ['HF ENERGY >3K', diag.high_frequency_ratio_3khz, '', .20, v => Math.min(v / .20 * 100, 100)],
                    ['HF ENERGY >4K', diag.high_frequency_ratio_4khz, '', .20, v => Math.min(v / .20 * 100, 100)],
                    ['SPECTRAL FLUX', diag.normalized_spectral_flux, '', .10, v => Math.min(v / .10 * 100, 100)],
                    ['ENERGY VARIATION', diag.energy_cv, '', 1.50, v => Math.min(v / 1.50 * 100, 100)],
                    ['ZCR DISPERSION', diag.zcr_dispersion, '', 1.50, v => Math.min(v / 1.50 * 100, 100)]
                ];
                return rows.filter(r => Number.isFinite(r[1]));
            }

            function acousticDisplayValue(value, unit = '') {
                if (!Number.isFinite(Number(value))) return 'N/R';
                const n = Number(value);
                if (unit === 'Hz') return `${n.toFixed(0)} Hz`;
                return n < .01 ? n.toFixed(4) : n < 1 ? n.toFixed(3) : n.toFixed(2);
            }

            function acousticExplanationColumns(value) {
                const source = value && typeof value === 'object' ? value : {};
                const aliases = [['en', 'ENGLISH'], ['hi', 'HINDI'], ['mr', 'MARATHI']];
                return aliases.map(([key, label]) => {
                    const block = source[key] ?? source[key.toUpperCase()] ?? null;
                    if (!block) return { key, label, items: [] };
                    if (typeof block === 'string') return { key, label, items: [['REPORT', block]] };
                    const items = Object.entries(block).map(([itemKey, itemValue]) => {
                        const text = typeof itemValue === 'string' ? itemValue : acousticExplanationText(itemValue);
                        return [norm(itemKey), String(text || '').trim()];
                    }).filter(([, text]) => text);
                    return { key, label, items };
                });
            }

                const ctx = waveformCanvas.getContext('2d');
                const sctx = spectralCanvas.getContext('2d');
                if (!ctx || !sctx) return;
                const drawFallback = () => {
                    ctx.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);

                        const SH = spectralCanvas.height = Math.max(260, Math.floor(205 * devicePixelRatio));

                        const waveTone = voiceVisualState === 'ai' ? 'rgba(239,108,47,.92)' : voiceVisualState === 'human' ? 'rgba(126,180,139,.92)' : 'rgba(121,197,207,.82)'; ctx.strokeStyle = waveTone; ctx.lineWidth = Math.max(1, devicePixelRatio); ctx.beginPath();
                        const step = Math.max(1, Math.floor(data.length / W));
                        for (let x = 0; x < W; x++) { let lo = 1, hi = -1; const st = x * step, en = Math.min(data.length, st + step); for (let i = st; i < en; i++) { const v = data[i]; if (v < lo) lo = v; if (v > hi) hi = v; } const y1 = H / 2 + lo * (H * .42), y2 = H / 2 + hi * (H * .42); if (x === 0) ctx.moveTo(x, y1); ctx.lineTo(x, y2); } ctx.stroke();
                        const bins = Math.min(190, Math.max(90, Math.floor(SW / 6))), fftSize = 512, half = fftSize / 2;

                            for (let k = 2; k < half; k += 2) { let re = 0, im = 0; for (let n = 0; n < fftSize; n++) { const v = (data[Math.min(data.length - 1, center + n)] || 0) * (0.5 - 0.5 * Math.cos(2 * Math.PI * n / (fftSize - 1))); const a = 2 * Math.PI * k * n / fftSize; re += v * Math.cos(a); im -= v * Math.sin(a); } const mag = Math.sqrt(re * re + im * im) / fftSize; const norm = Math.max(0, Math.min(1, Math.log10(1 + mag * 220) / 2.35)); const y = SH - Math.floor((k / half) * SH); const x = Math.floor((bx / bins) * SW), cellW = Math.ceil(SW / bins) + 1; const tint = voiceVisualState === 'ai' ? [239, 108, 47] : voiceVisualState === 'human' ? [126, 180, 139] : [121, 197, 207]; sctx.fillStyle = `rgba(${tint[0] + Math.floor(norm * (255 - tint[0]))},${tint[1] + Math.floor(norm * (215 - tint[1]))},${tint[2] + Math.floor(norm * (175 - tint[2]))},${.10 + norm * .78})`; sctx.fillRect(x, y, cellW, Math.max(2, SH / half * 2.2)); }
                        }

            function biometricMeaning(data, state) {

                    return `The recorded test voice is sufficiently similar to the enrolled reference. This is a biometric verification finding, not a statement about whether the spoken content itself is safe.`;

                    return `The recorded test voice does not sufficiently match the enrolled reference. Treat the identity claim as potentially impersonated and review the surrounding case evidence.`;

            async function biometricTrace(file, canvas, accent) {
                if (!file || !canvas) return;
                try {
                    const AC = window.AudioContext || window.webkitAudioContext;
                    if (!AC) return;
                    const ctx = new AC();
                    const buf = await ctx.decodeAudioData(await file.arrayBuffer());
                    const channel = buf.getChannelData(0);
                    const dpr = Math.min(2, window.devicePixelRatio || 1);
                    const rect = canvas.getBoundingClientRect();
                    const w = Math.max(360, Math.floor(rect.width * dpr));
                    const h = Math.max(110, Math.floor(rect.height * dpr));
                    canvas.width = w; canvas.height = h;
                    const c = canvas.getContext('2d');
                    c.clearRect(0, 0, w, h);
                    c.fillStyle = '#070a0c'; c.fillRect(0, 0, w, h);
                    c.strokeStyle = 'rgba(242,240,235,.045)'; c.lineWidth = 1;
                    for (let x = 0; x <= w; x += Math.max(28, Math.floor(w / 18))) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
                    for (let y = 0; y <= h; y += Math.max(24, Math.floor(h / 5))) { c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke(); }
                    const css = accent === 'test' ? '#ef6c2f' : '#79c5cf';
                    c.strokeStyle = css; c.globalAlpha = .92; c.lineWidth = 1.5 * dpr;
                    c.beginPath();
                    const mid = h / 2;
                    const step = Math.max(1, Math.floor(channel.length / Math.max(1, w)));
                    for (let x = 0; x < w; x++) {
                        const a = x * step, end = Math.min(channel.length, a + step);
                        let mn = 1, mx = -1;
                        for (let i = a; i < end; i++) { const v = channel[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
                        const y1 = mid + mn * mid * .78;
                        const y2 = mid + mx * mid * .78;
                        c.moveTo(x, y1); c.lineTo(x, y2);
                    }
                    c.stroke();
                    c.globalAlpha = 1;
                    await ctx.close();
                } catch (e) {
                    console.warn('[LUI] biometric trace preview failed', e);
                }
            }
