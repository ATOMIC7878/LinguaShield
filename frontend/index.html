<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#090a0c">
    <meta name="description" content="LinguaShield Investigation Workspace">
    <title>Investigation Workbench</title>
    <link rel="icon" type="image/png" href="LS.png">
    <link rel="apple-touch-icon" href="LS.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #090a0c;
            --panel: #0d1013;
            --panel2: #111419;
            --panel3: #15191e;
            --ink: #f2f0eb;
            --muted: #a0a49e;
            --soft: #737871;
            --faint: #4b504c;
            --line: rgba(242, 240, 235, .10);
            --line2: rgba(242, 240, 235, .16);
            --signal: #ef6c2f;
            --signal2: #ff965d;
            --info: #79c5cf;
            --ok: #7eb48b;
            --warn: #d5b36b;
            --critical: #d96b63;
            --display: "Sora", sans-serif;
            --ui: "Inter Tight", sans-serif;
            --mono: "IBM Plex Mono", monospace;
            --sidebar: 232px;
            --topbar: 76px;
            --shadow: 0 22px 70px rgba(0, 0, 0, .28);
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--ui)
        }

        body {
            overflow-x: hidden
        }

        button,
        input {
            font: inherit;
            color: inherit
        }

        button {
            border: 0;
            background: none
        }

        a {
            color: inherit;
            text-decoration: none
        }

        :focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: var(--sidebar) 1fr;
            grid-template-rows: var(--topbar) 1fr
        }

        .sidebar {
            grid-column: 1;
            grid-row: 1 / span 2;
            position: sticky;
            top: 0;
            height: 100vh;
            border-right: 1px solid var(--line);
            background: linear-gradient(180deg, #0a0c0e, #08090b 75%);
            padding: 18px 12px 16px;
            display: flex;
            flex-direction: column;
            z-index: 20
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 4px 8px 22px
        }

        .brand img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            display: block;
            flex: 0 0 auto
        }

        .brand-copy {
            min-width: 0
        }

        .brand-name {
            font: 600 15px var(--display);
            letter-spacing: .13em;
            white-space: nowrap;
            line-height: 1
        }

        .brand-name span {
            color: var(--signal);
            font-weight: 600
        }

        .side-rule {
            height: 1px;
            background: var(--line);
            margin: 0 8px 18px
        }

        .nav-label {
            padding: 0 10px 9px;
            font: 500 7px var(--mono);
            letter-spacing: .16em;
            color: var(--faint);
            text-transform: uppercase
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 3px
        }

        .nav button {
            display: flex;
            align-items: center;
            gap: 11px;
            width: 100%;
            padding: 10px 11px;
            border: 1px solid transparent;
            color: var(--soft);
            cursor: pointer;
            text-align: left;
            border-radius: 2px;
            transition: background .25s, border-color .25s, color .25s, transform .25s
        }

        .nav button:hover {
            color: var(--ink);
            background: rgba(255, 255, 255, .025);
            transform: translateX(1px)
        }

        .nav button.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(239, 108, 47, .12), rgba(239, 108, 47, .025));
            border-color: rgba(239, 108, 47, .18)
        }

        .nav .icon {
            width: 18px;
            height: 18px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            color: currentColor
        }

        .nav .icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 1.45;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .nav-text {
            font: 500 10px var(--mono);
            letter-spacing: .07em
        }

        .nav-sep {
            height: 1px;
            background: var(--line);
            margin: 14px 8px
        }

        .sidebar-footer {
            margin-top: auto;
            padding: 14px 10px 4px;
            color: var(--faint);
            font: 500 7px/1.6 var(--mono);
            letter-spacing: .10em
        }

        .sidebar-footer strong {
            display: block;
            color: #9ea39c;
            font-weight: 500;
            margin-bottom: 4px
        }

        .topbar {
            grid-column: 2;
            grid-row: 1;
            position: sticky;
            top: 0;
            z-index: 15;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 22px;
            border-bottom: 1px solid var(--line);
            background: rgba(9, 10, 12, .86);
            backdrop-filter: blur(18px)
        }

        .crumbs {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0
        }

        .crumbs .small {
            font: 500 8px var(--mono);
            letter-spacing: .12em;
            color: var(--faint);
            text-transform: uppercase
        }

        .crumbs .current {
            font: 600 12px var(--display);
            white-space: nowrap
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            border: 1px solid var(--line2);
            padding: 6px 9px;
            border-radius: 999px;
            font: 500 8px var(--mono);
            letter-spacing: .07em;
            color: var(--muted);
            white-space: nowrap
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 4px rgba(126, 180, 139, .08)
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .search {
            height: 34px;
            width: min(280px, 28vw);
            border: 1px solid var(--line);
            background: #0c0f12;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 0 11px;
            color: var(--faint);
            font: 500 8px var(--mono);
            letter-spacing: .06em
        }

        .search svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5
        }

        .utility {
            width: 34px;
            height: 34px;
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            color: var(--soft);
            cursor: pointer
        }

        .utility svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.45;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .avatar {
            width: 32px;
            height: 32px;
            border: 1px solid var(--line2);
            display: grid;
            place-items: center;
            font: 600 9px var(--mono);
            color: #fff
        }

        .main {
            grid-column: 2;
            grid-row: 2;
            padding: 20px 20px 28px;
            min-width: 0
        }

        .page {
            max-width: 1560px;
            margin: 0 auto
        }

        .case-hero {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 22px;
            padding: 22px 24px;
            border: 1px solid var(--line);
            background: linear-gradient(135deg, #0f1216 0%, #0c0f12 62%, #101318 100%);
            box-shadow: var(--shadow)
        }

        .eyebrow {
            font: 500 8px var(--mono);
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--faint)
        }

        .eyebrow:before {
            content: "";
            display: inline-block;
            width: 23px;
            height: 1px;
            background: var(--signal);
            margin: 0 9px 3px 0
        }

        h1 {
            margin: 10px 0 0;
            font: 600 clamp(30px, 3.2vw, 48px)/.96 var(--display);
            letter-spacing: -.045em
        }

        .lede {
            margin: 10px 0 0;
            max-width: 760px;
            color: #9fa39d;
            font-size: 13px;
            line-height: 1.5
        }

        .case-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 14px
        }

        .chip {
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .018);
            padding: 6px 8px;
            font: 500 7px var(--mono);
            letter-spacing: .07em;
            color: #a6aaa4;
            text-transform: uppercase
        }

        .chip.signal {
            border-color: rgba(239, 108, 47, .28);
            color: var(--signal)
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(90px, 1fr));
            gap: 1px;
            min-width: 390px;
            background: var(--line);
            align-self: stretch
        }

        .stat {
            padding: 15px 14px;
            background: rgba(10, 12, 14, .64);
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .stat span {
            font: 500 7px var(--mono);
            letter-spacing: .10em;
            color: var(--faint);
            text-transform: uppercase
        }

        .stat strong {
            margin-top: 8px;
            font: 600 25px var(--display);
            letter-spacing: -.04em
        }

        .stat em {
            margin-top: 4px;
            font-style: normal;
            font: 500 7px var(--mono);
            color: var(--soft)
        }

        .work-grid {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr) 310px;
            gap: 14px;
            margin-top: 14px
        }

        .panel {
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #0f1215, #0b0e11);
            min-width: 0
        }

        .panel-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            padding: 15px 15px 12px;
            border-bottom: 1px solid var(--line)
        }

        .panel-title {
            font: 600 13px var(--display);
            letter-spacing: -.01em
        }

        .panel-kicker {
            margin-top: 4px;
            font: 500 7px var(--mono);
            letter-spacing: .10em;
            color: var(--faint);
            text-transform: uppercase
        }

        .panel-tag {
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            color: var(--info);
            white-space: nowrap
        }

        .intake {
            padding: 14px
        }

        .dropzone {
            min-height: 176px;
            border: 1px dashed rgba(242, 240, 235, .18);
            display: grid;
            place-items: center;
            text-align: center;
            padding: 18px;
            background: radial-gradient(circle at 50% 35%, rgba(239, 108, 47, .05), transparent 42%), #0b0e11;
            cursor: pointer;
            transition: border-color .25s, background .25s
        }

        .dropzone:hover {
            border-color: rgba(239, 108, 47, .45);
            background: radial-gradient(circle at 50% 35%, rgba(239, 108, 47, .08), transparent 46%), #0d1013
        }

        .drop-icon {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line2);
            display: grid;
            place-items: center;
            margin: 0 auto 12px;
            color: #c7cac4
        }

        .drop-icon svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.3;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .dropzone strong {
            display: block;
            font: 600 12px var(--display)
        }

        .dropzone p {
            margin: 6px auto 0;
            max-width: 220px;
            color: var(--soft);
            font: 500 8px/1.55 var(--mono)
        }

        .intake-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 8px
        }

        .small-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            padding: 10px;
            background: #0d1013;
            color: #b5b9b2;
            cursor: pointer;
            font: 500 8px var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .small-btn:hover {
            border-color: var(--line2);
            color: #fff
        }

        .small-btn svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .module-list {
            margin-top: 12px;
            border-top: 1px solid var(--line)
        }

        .module {
            display: grid;
            grid-template-columns: 26px 1fr auto;
            gap: 9px;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--line)
        }

        .module-icon {
            width: 26px;
            height: 26px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            color: var(--soft)
        }

        .module-icon svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .module strong {
            display: block;
            font: 600 10px var(--display)
        }

        .module span {
            display: block;
            margin-top: 3px;
            font: 500 7px var(--mono);
            color: var(--faint)
        }

        .module-status {
            font: 500 7px var(--mono);
            letter-spacing: .06em;
            color: var(--faint)
        }

        .module-status.ready {
            color: var(--ok)
        }

        .module-status.partial {
            color: var(--warn)
        }

        .trust {
            position: relative;
            overflow: hidden
        }

        .trust-canvas {
            height: 480px;
            position: relative;
            background: radial-gradient(circle at 50% 48%, rgba(239, 108, 47, .05), transparent 27%), radial-gradient(circle at 54% 50%, rgba(121, 197, 207, .025), transparent 48%), #0a0d10
        }

        .trust-grid {
            position: absolute;
            inset: 0;
            opacity: .42;
            background-image: linear-gradient(rgba(242, 240, 235, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(242, 240, 235, .025) 1px, transparent 1px);
            background-size: 24px 24px;
            mask-image: linear-gradient(to bottom, transparent, #000 10%, #000 90%, transparent)
        }

        .trust-vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0, 0, 0, .48) 86%)
        }

        .edge {
            position: absolute;
            height: 1px;
            transform-origin: left center;
            background: linear-gradient(90deg, rgba(239, 108, 47, .72), rgba(239, 108, 47, .04));
            filter: drop-shadow(0 0 5px rgba(239, 108, 47, .15))
        }

        .edge.cyan {
            background: linear-gradient(90deg, rgba(121, 197, 207, .72), rgba(121, 197, 207, .04));
            filter: drop-shadow(0 0 5px rgba(121, 197, 207, .13))
        }

        .edge.green {
            background: linear-gradient(90deg, rgba(126, 180, 139, .72), rgba(126, 180, 139, .04));
            filter: drop-shadow(0 0 5px rgba(126, 180, 139, .13))
        }

        .edge.red {
            background: linear-gradient(90deg, rgba(217, 107, 99, .72), rgba(217, 107, 99, .04));
            filter: drop-shadow(0 0 5px rgba(217, 107, 99, .13))
        }

        .node {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px
        }

        .node-dot {
            width: 44px;
            height: 44px;
            border: 1px solid var(--line2);
            display: grid;
            place-items: center;
            background: #0d1115;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .25)
        }

        .node-dot svg {
            width: 19px;
            height: 19px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.25;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .node-label {
            text-align: center;
            font: 500 7px/1.35 var(--mono);
            letter-spacing: .06em;
            color: #9da19a;
            white-space: nowrap
        }

        .node-label b {
            display: block;
            color: #d1d3cd;
            font-weight: 500
        }

        .node--claim .node-dot {
            border-color: rgba(239, 108, 47, .65);
            color: var(--signal);
            box-shadow: 0 0 0 10px rgba(239, 108, 47, .03), 0 8px 30px rgba(0, 0, 0, .25)
        }

        .node--visual .node-dot {
            border-color: rgba(121, 197, 207, .48);
            color: var(--info)
        }

        .node--audio .node-dot {
            border-color: rgba(217, 107, 99, .42);
            color: var(--critical)
        }

        .node--id .node-dot {
            border-color: rgba(126, 180, 139, .42);
            color: var(--ok)
        }

        .node--person .node-dot {
            border-radius: 50%;
            color: #babdb7
        }

        .node--case .node-dot {
            width: 82px;
            height: 82px;
            border: 1px solid rgba(239, 108, 47, .65);
            color: var(--signal);
            box-shadow: 0 0 0 20px rgba(239, 108, 47, .025), 0 0 44px rgba(239, 108, 47, .12)
        }

        .node--case .node-dot svg {
            width: 26px;
            height: 26px
        }

        .node--case .node-label {
            color: #c5c8c1
        }

        .node--case .node-label b {
            font: 600 9px var(--display);
            margin-bottom: 2px
        }

        .node--case .node-label span {
            color: var(--signal)
        }

        .n1 {
            left: 12%;
            top: 18%
        }

        .n2 {
            right: 12%;
            top: 15%
        }

        .n3 {
            left: 9%;
            bottom: 16%
        }

        .n4 {
            right: 11%;
            bottom: 15%
        }

        .n5 {
            left: 50%;
            top: 43%;
            transform: translate(-50%, -50%)
        }

        .n6 {
            left: 50%;
            top: 7%;
            transform: translateX(-50%)
        }

        .n6 .node-dot {
            color: var(--ok);
            border-color: rgba(126, 180, 139, .38)
        }

        .e1 {
            left: 22%;
            top: 33%;
            width: 250px;
            transform: rotate(28deg)
        }

        .e2 {
            left: 55%;
            top: 30%;
            width: 215px;
            transform: rotate(-26deg)
        }

        .e3 {
            left: 21%;
            top: 66%;
            width: 260px;
            transform: rotate(-23deg)
        }

        .e4 {
            left: 54%;
            top: 66%;
            width: 245px;
            transform: rotate(22deg)
        }

        .e5 {
            left: 50%;
            top: 22%;
            width: 110px;
            transform: rotate(90deg);
            background: linear-gradient(90deg, rgba(126, 180, 139, .7), rgba(126, 180, 139, .05))
        }

        .trust-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 13px;
            border-top: 1px solid var(--line);
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            color: var(--faint);
            text-transform: uppercase
        }

        .legend {
            display: flex;
            gap: 13px;
            flex-wrap: wrap
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 5px
        }

        .legend i {
            display: inline-block;
            width: 12px;
            height: 1px;
            background: var(--signal)
        }

        .legend .cyan {
            background: var(--info)
        }

        .legend .green {
            background: var(--ok)
        }

        .legend .red {
            background: var(--critical)
        }

        .lui-card {
            display: flex;
            flex-direction: column;
            min-height: 100%
        }

        .lui-body {
            padding: 14px
        }

        .lui-online {
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            color: var(--ok)
        }

        .lui-prompt {
            border: 1px solid var(--line);
            background: #0a0d10;
            padding: 13px;
            margin-bottom: 10px;
            color: #9ea39c;
            font: 500 9px/1.55 var(--mono)
        }

        .lui-prompt span {
            display: block;
            color: #5d635d;
            margin-bottom: 6px
        }

        .question {
            width: 100%;
            text-align: left;
            border: 1px solid var(--line);
            background: #0e1114;
            padding: 10px 10px;
            color: #aeb2ab;
            cursor: pointer;
            font: 500 8px/1.4 var(--mono);
            margin-top: 7px
        }

        .question:hover {
            border-color: rgba(239, 108, 47, .28);
            color: #fff
        }

        .lui-foot {
            margin-top: auto;
            padding: 10px 14px;
            border-top: 1px solid var(--line);
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            color: var(--faint)
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1.05fr 1fr .9fr;
            gap: 14px;
            margin-top: 14px
        }

        .finding-list,
        .timeline,
        .assessment {
            padding: 0 14px 14px
        }

        .finding {
            display: grid;
            grid-template-columns: 30px 1fr auto;
            gap: 9px;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--line)
        }

        .finding:last-child {
            border-bottom: 0
        }

        .finding-icon {
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            color: var(--info)
        }

        .finding-icon.orange {
            color: var(--signal)
        }

        .finding-icon.red {
            color: var(--critical)
        }

        .finding-icon svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;

            content: "";

            right: 0;

            transform: translateX(-50%);

        .ls-acoustic-decision-card:nth-child(2) {
            animation-delay: .06s
        }

        @keyframes lsAcousticCardIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .ls-acoustic-intro {
            padding: 0;
            border-bottom: 1px solid var(--line);
            background: #0a0d10
        }

        .ls-acoustic-manipulation {
            padding: 13px 14px 14px;
            border-top: 1px solid var(--line)
        }

        .ls-acoustic-section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px
        }

        .ls-acoustic-section-heading strong {
            font: 600 8px var(--mono);
            letter-spacing: .11em;
            text-transform: uppercase;
            color: #bfc4bd
        }

        .ls-acoustic-section-heading span {
            font: 500 6px var(--mono);
            color: #555d56;
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .ls-acoustic-signals {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line)
        }

        .ls-acoustic-signal {
            padding: 11px 12px;
            background: #0b0e11;
            min-width: 0
        }

        .ls-acoustic-signal-label {
            font: 500 7px var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #707870
        }

        .ls-acoustic-signal-value {
            margin-top: 6px;
            font: 600 17px var(--display);
            letter-spacing: -.03em;
            color: #dfe3dc
        }

        .ls-acoustic-signal-track {
            height: 5px;
            margin-top: 8px;
            background: rgba(255, 255, 255, .045);
            overflow: hidden
        }

        .ls-acoustic-signal-track i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--info), var(--signal));
            transition: width .65s cubic-bezier(.16, 1, .3, 1)
        }

        .ls-acoustic-signal-note {
            margin-top: 5px;
            color: #555e57;
            font: 500 6px/1.4 var(--mono)
        }

        .ls-acoustic-primary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(320px, .42fr);
            gap: 14px;
            padding: 14px
        }

        .ls-acoustic-panel {
            border: 1px solid var(--line);
            background: #0a0d10;
            min-width: 0
        }

        .ls-acoustic-panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            border-bottom: 1px solid var(--line)
        }

        .ls-acoustic-panel-head strong {
            font: 600 8px var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            color: #bfc4bd
        }

        .ls-acoustic-panel-head span {
            font: 500 7px var(--mono);
            color: var(--faint)
        }

        .ls-acoustic-wave-wrap {
            padding: 12px;
            background: #07090b
        }

        .ls-acoustic-canvas {
            display: block;
            width: 100%;
            height: 135px;
            border: 1px solid rgba(121, 197, 207, .10);
            background: linear-gradient(rgba(121, 197, 207, .025) 1px, transparent 1px), linear-gradient(90deg, rgba(121, 197, 207, .025) 1px, transparent 1px), #050708;
            background-size: 24px 24px
        }

        .ls-acoustic-spectral-wrap {
            padding: 12px;
            background: #07090b;
            border-top: 1px solid var(--line)
        }

        .ls-acoustic-spectral-canvas {
            display: block;
            width: 100%;
            height: 135px;
            border: 1px solid rgba(121, 197, 207, .10);
            background: #050708
        }

        .ls-acoustic-timeaxis {
            display: flex;
            justify-content: space-between;
            padding: 7px 2px 0;
            color: #4e554f;
            font: 500 6px var(--mono)
        }

        .ls-acoustic-fingerprint {
            display: grid;
            gap: 6px;
            padding: 12px
        }

        .ls-acoustic-feature {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr) 68px;
            gap: 8px;
            align-items: center;
            min-width: 0
        }

        .ls-acoustic-feature label {
            font: 500 7px var(--mono);
            color: #717871;
            letter-spacing: .05em;
            text-transform: uppercase
        }

        .ls-acoustic-feature-track {
            height: 6px;
            background: rgba(255, 255, 255, .045);
            border: 1px solid rgba(255, 255, 255, .035);
            overflow: hidden
        }

        .ls-acoustic-feature-track i {
            display: block;
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--info), var(--signal));
            transition: width .7s cubic-bezier(.16, 1, .3, 1)
        }

        .ls-acoustic-feature-value {
            font: 500 7px var(--mono);
            color: #a8ada6;
            text-align: right;
            white-space: nowrap
        }

        .ls-acoustic-feature-note {
            padding: 0 12px 12px;
            color: #4f564f;
            font: 500 6px/1.55 var(--mono)
        }

        .ls-acoustic-metrics {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border-top: 1px solid var(--line)
        }

        .ls-acoustic-metric {
            padding: 12px;
            background: #0a0d10
        }

        .ls-acoustic-metric span {
            display: block;
            font: 500 6px var(--mono);
            letter-spacing: .09em;
            color: var(--faint);
            text-transform: uppercase
        }

        .ls-acoustic-metric strong {
            display: block;
            margin-top: 6px;
            font: 600 16px var(--display);
            letter-spacing: -.03em;
            color: #e1e4de
        }

        .ls-acoustic-metric em {
            display: block;
            margin-top: 4px;
            font: 500 6px var(--mono);
            color: #5e655f;
            font-style: normal
        }

        /* Transcript is intentionally full width so the spoken content is readable before the report. */
        .ls-acoustic-lower {
            display: block;
            padding: 0 14px 14px
        }

        .ls-acoustic-transcript-wrap {
            border: 1px solid var(--line);
            background: #0a0d10
        }

        .ls-acoustic-transcript {
            min-height: 160px;
            padding: 15px;
            color: #d0d4ce;
            font: 500 9px/1.78 var(--mono);
            white-space: pre-wrap;
            word-break: break-word
        }

        .ls-acoustic-transcript.is-empty {
            color: var(--faint);
            font-style: italic
        }

        .ls-acoustic-report {
            padding: 0 14px 14px
        }

        .ls-acoustic-report-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line)
        }

        .ls-acoustic-report-col {
            background: #0a0d10;
            min-width: 0;
            padding: 14px
        }

        .ls-acoustic-report-lang {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding-bottom: 9px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--line);
            font: 600 7px var(--mono);
            letter-spacing: .12em;
            color: var(--info);
            text-transform: uppercase
        }

        .ls-acoustic-report-item {
            margin-top: 10px
        }

        .ls-acoustic-report-item:first-child {
            margin-top: 0
        }

        .ls-acoustic-report-item strong {
            display: block;
            font: 600 7px var(--mono);
            letter-spacing: .08em;
            color: #969d96;
            text-transform: uppercase
        }

        .ls-acoustic-report-item p {
            margin: 5px 0 0;
            color: #b1b6b0;
            font: 500 7px/1.65 var(--mono);
            white-space: pre-wrap;
            word-break: break-word
        }

        .ls-acoustic-report-empty {
            padding: 14px;
            color: #5d645e;
            font: 500 7px/1.6 var(--mono)
        }

        .ls-acoustic-run {
            position: relative;
            overflow: hidden
        }

        .ls-acoustic-run.is-busy {
            cursor: wait;
            opacity: .92
        }

        .ls-acoustic-run.is-busy:before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--info), var(--signal), transparent);
            animation: lsAcousticButtonSweep .9s linear infinite
        }

        @keyframes lsAcousticButtonSweep {
            0% {
                transform: translateX(-100%)
            }

            100% {
                transform: translateX(100%)
            }
        }

        .ls-acoustic-bio {
            padding: 13px;
            border-top: 1px solid var(--line);
            background: #0a0d10
        }

        .ls-acoustic-bio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px
        }

        .ls-acoustic-bio-box {
            padding: 10px;
            border: 1px solid var(--line);
            background: #0b0f12
        }

        .ls-acoustic-bio-box span {
            display: block;
            font: 500 6px var(--mono);
            letter-spacing: .09em;
            color: var(--faint);
            text-transform: uppercase
        }

        .ls-acoustic-bio-box strong {
            display: block;
            margin-top: 5px;
            font: 600 11px var(--display);
            color: #d8dcd5
        }

        .ls-acoustic-stack {
            padding: 0 14px 14px;
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 1px;
            background: var(--line)
        }

        .ls-acoustic-stack-step {
            min-height: 74px;
            padding: 10px;
            background: #0a0d10;
            position: relative
        }

        .ls-acoustic-stack-step:after {
            content: '›';
            position: absolute;
            right: 7px;
            top: 50%;
            transform: translateY(-50%);
            color: #4d554f;
            font: 500 17px var(--mono)
        }

        .ls-acoustic-stack-step:last-child:after {
            content: ''
        }

        .ls-acoustic-stack-step em {
            display: block;
            color: var(--info);
            font: 600 7px var(--mono);
            letter-spacing: .08em;
            font-style: normal
        }

        .ls-acoustic-stack-step strong {
            display: block;
            margin-top: 7px;
            max-width: 90px;
            font: 600 9px/1.25 var(--display);
            color: #cdd1cb
        }

        .ls-acoustic-stack-step span {
            display: block;
            margin-top: 5px;
            color: #5f665f;
            font: 500 6px/1.4 var(--mono)
        }

        .ls-acoustic-disclaimer {
            padding: 0 14px 14px;
            color: #4b524c;
            font: 500 6px/1.55 var(--mono)
        }

        .ls-acoustic-stack-step {
            animation: lsAcousticStepIn .45s ease both
        }

        .ls-acoustic-stack-step:nth-child(1) {
            animation-delay: .03s
        }

        .ls-acoustic-stack-step:nth-child(2) {
            animation-delay: .08s
        }

        .ls-acoustic-stack-step:nth-child(3) {
            animation-delay: .13s
        }

        .ls-acoustic-stack-step:nth-child(4) {
            animation-delay: .18s
        }

        .ls-acoustic-stack-step:nth-child(5) {
            animation-delay: .23s
        }

        .ls-acoustic-stack-step:nth-child(6) {
            animation-delay: .28s
        }

        @keyframes lsAcousticStepIn {
            from {
                opacity: 0;
                transform: translateY(6px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @media(max-width:900px) {

            .ls-acoustic-head,
            .ls-acoustic-intake,
            .ls-acoustic-primary {
                grid-template-columns: 1fr
            }

            .ls-acoustic-decision,
            .ls-acoustic-signals,
            .ls-acoustic-report-grid {
                grid-template-columns: 1fr 1fr
            }

            .ls-acoustic-title {
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            .ls-acoustic-verdict {
                border-left: 0;
                border-top: 2px solid var(--info)
            }

            .ls-acoustic-verdict.is-threat {
                border-left: 0;
                border-top-color: var(--critical)
            }

            .ls-acoustic-verdict.is-clear {
                border-left: 0;
                border-top-color: var(--ok)
            }

            .ls-acoustic-stack {
                grid-template-columns: repeat(3, minmax(0, 1fr))
            }
        }

        @media(max-width:620px) {

            .ls-acoustic-decision,
            .ls-acoustic-signals,
            .ls-acoustic-report-grid,
            .ls-acoustic-metrics {
                grid-template-columns: 1fr
            }

            .ls-acoustic-stack {
                grid-template-columns: 1fr 1fr
            }

            .ls-acoustic-feature {
                grid-template-columns: 98px minmax(0, 1fr) 60px
            }

            .ls-acoustic-canvas,
            .ls-acoustic-spectral-canvas {
                height: 125px
            }
        }

        /* Text-analysis presentation: dedicated centered workspace */
        .text-modal-shell {
            width: min(820px, 100%);
            position: relative;
            transform: translateY(18px) scale(.985);
            opacity: 0;
            transition: transform .42s cubic-bezier(.16, 1, .3, 1), opacity .42s ease
        }

        .analysis-modal.open.text-modal-shell {
            transform: translateY(0) scale(1);
            opacity: 1
        }

        .text-modal-card {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(242, 240, 235, .12);
            background: linear-gradient(145deg, rgba(17, 21, 25, .98), rgba(9, 12, 14, .98) 70%);
            box-shadow: 0 34px 110px rgba(0, 0, 0, .62)
        }

        .text-modal-card:before {
            content: "";
            position: absolute;
            inset: -25% -10% auto;
            height: 240px;
            background: radial-gradient(circle at 18% 20%, rgba(239, 108, 47, .13), transparent 42%), radial-gradient(circle at 80% 8%, rgba(121, 197, 207, .07), transparent 35%);
            pointer-events: none
        }

        .text-modal-top {
            position: relative;
            display: grid;
            grid-template-columns: 1.05fr .95fr;
            gap: 0;
            border-bottom: 1px solid var(--line)
        }

        .text-modal-intro {
            padding: 28px 28px 24px;
            border-right: 1px solid var(--line)
        }

        .text-modal-mark {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(239, 108, 47, .32);
            color: var(--signal);
            background: rgba(239, 108, 47, .05);
            box-shadow: 0 0 30px rgba(239, 108, 47, .06);
            margin-bottom: 18px
        }

        .text-modal-mark svg {
            width: 21px;
            height: 21px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.25;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .text-modal-title {
            margin: 0;
            font: 600 clamp(27px, 4vw, 39px)/.98 var(--display);
            letter-spacing: -.045em;
            color: #fff
        }

        .text-modal-copy {
            margin-top: 10px;
            max-width: 520px;
            color: #8c928c;
            font: 500 9px/1.7 var(--mono)
        }

        .text-modal-meta {
            padding: 28px 24px;
            display: grid;
            align-content: end;
            gap: 12px;
            background: linear-gradient(180deg, rgba(255, 255, 255, .012), rgba(255, 255, 255, .0))
        }

        .text-signal-line {
            display: flex;
            align-items: center;
            gap: 9px;
            color: #9aa099;
            font: 500 8px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .text-signal-line i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 0 4px rgba(126, 180, 139, .07)
        }

        .text-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px
        }

        .text-meta-box {
            padding: 11px 12px;
            border: 1px solid var(--line);
            background: #0b0f12
        }

        .text-meta-box span {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .text-meta-box strong {
            display: block;
            margin-top: 5px;
            color: #e8e9e4;
            font: 600 11px var(--display)
        }

        .text-modal-body {
            position: relative;
            padding: 22px 28px 24px
        }

        .text-composer-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 9px
        }

        .text-composer-label span:first-child {
            font: 500 8px var(--mono);
            letter-spacing: .11em;
            color: #757b74;
            text-transform: uppercase
        }

        .text-counter {
            font: 500 7px var(--mono);
            color: #555b56;
            letter-spacing: .06em
        }

        .text-composer {
            position: relative
        }

        .text-composer textarea {
            min-height: 220px;
            padding: 18px 18px 18px;
            background: linear-gradient(180deg, #0b0f12, #090c0f);
            border: 1px solid rgba(242, 240, 235, .10);
            font: 500 12px/1.75 var(--mono);
            color: #e8e9e4
        }

        .text-composer textarea:focus {
            border-color: rgba(239, 108, 47, .45);
            box-shadow: 0 0 0 3px rgba(239, 108, 47, .06), 0 0 34px rgba(239, 108, 47, .04)
        }

        .text-composer textarea::placeholder {
            color: #4e544f
        }

        .text-compose-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-top: 12px
        }

        .text-profile {
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 0
        }

        .text-profile label {
            font: 500 8px var(--mono);
            letter-spacing: .09em;
            text-transform: uppercase;
            color: #656b65
        }

        .text-profile select {
            width: 190px;
            border: 1px solid var(--line);
            background: #0b0f12;
            color: #cfd2cc;
            padding: 9px 11px;
            font: 500 8px var(--mono);
            outline: none
        }

        .text-run {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            border: 1px solid rgba(239, 108, 47, .34);
            background: linear-gradient(135deg, rgba(239, 108, 47, .16), rgba(239, 108, 47, .05));
            color: #ff9a67;
            padding: 12px 16px;
            font: 600 8px var(--mono);
            letter-spacing: .09em;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform .22s, box-shadow .22s, border-color .22s

            border-color: rgba(239, 108, 47, .55);
            box-shadow: 0 12px 28px rgba(239, 108, 47, .09)

        .text-run svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5
        }

        .text-processing {
            display: none;
            margin-top: 12px;
            align-items: center;
            gap: 8px;
            color: #7b827a;
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .text-processing.show {
            display: flex
        }

        .text-processing i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--signal);
            animation: textPulse 1.1s ease-in-out infinite
        }

        @keyframes textPulse {

            0%,
            100% {
                opacity: .35;
                transform: scale(.75)
            }

            50% {
                opacity: 1;
                transform: scale(1)
            }
        }

        .dialog-backdrop {
            position: fixed;
            inset: 0;
            z-index: 160;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .74);
            backdrop-filter: blur(14px)
        }

        .dialog-backdrop.open {
            display: flex
        }

        .system-dialog {
            width: min(480px, 100%);
            border: 1px solid rgba(217, 107, 99, .28);
            background: linear-gradient(180deg, #12171b, #0a0d10);
            box-shadow: 0 28px 90px rgba(0, 0, 0, .62);
            transform: translateY(14px) scale(.98);
            opacity: 0;
            transition: transform .28s cubic-bezier(.16, 1, .3, 1), opacity .28s ease

            opacity: 1

            gap: 12px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--line)
        }

        .dialog-icon {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(217, 107, 99, .28);
            color: var(--critical);
            background: rgba(217, 107, 99, .06)
        }

        .dialog-icon svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .system-dialog-kicker {
            font: 500 7px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #7d837d
        }

        .system-dialog-title {
            margin-top: 4px;
            font: 600 16px var(--display);
            color: #f1f1ed
        }

        .system-dialog-body {
            padding: 18px;
            color: #9ea39c;
            font: 500 9px/1.7 var(--mono)
        }

        .system-dialog-detail {
            margin-top: 9px;
            padding: 9px;
            border: 1px solid var(--line);
            background: #0b0f12;
            color: #686e68;
            max-height: 120px;
            overflow: auto;
            white-space: pre-wrap
        }

        .system-dialog-foot {
            display: flex;
            justify-content: flex-end;
            padding: 12px 18px;
            border-top: 1px solid var(--line)
        }

        .system-dialog-ok {
            border: 1px solid rgba(217, 107, 99, .28);
            background: rgba(217, 107, 99, .06);
            color: #e79a93;
            padding: 9px 14px;
            font: 600 8px var(--mono);
            letter-spacing: .08em;

            gap: 14px;

            background: linear-gradient(180deg, #0f1316, #0b0e11);

            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .09em;
            text-transform: uppercase;

            overflow: hidden;

        .ls-live-timeline-grid {
            position: absolute;
            inset: 0;
            opacity: .55;

            box-shadow: 0 0 14px rgba(239, 108, 47, .15);

        }

        .ls-live-log-dot.ok {

            width: 168px;
            height: 168px;
            border: 1px dashed rgba(242, 240, 235, .08);
            border-radius: 50%;
        }

        .ls-visual-signal-link {
            position: absolute;
            width: 190px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(121, 197, 207, .18), transparent);
            transform-origin: center;
            pointer-events: none;
        }

        .ls-visual-signal-link.h {
            transform: rotate(0deg);
        }

        .ls-visual-signal-link.v {
            transform: rotate(90deg);
        }

        .ls-visual-signal-node {
            width: min(100%, 178px);
            padding: 11px;
            border: 1px solid var(--line);
            background: rgba(13, 16, 19, .92);
            position: relative;
            z-index: 2;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
        }

        .ls-visual-signal-node.mid {
            border-color: rgba(213, 179, 107, .22);
        }

        .ls-visual-signal-node.strong {
            border-color: rgba(239, 108, 47, .26);
            box-shadow: inset 2px 0 0 rgba(239, 108, 47, .45);
        }

        .ls-visual-signal-node:hover {
            transform: translateY(-2px);
            border-color: rgba(121, 197, 207, .26);
            background: #0f1417;
        }

        .ls-visual-signal-node-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .ls-visual-signal-node-head span {
            color: #8d948d;
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .ls-visual-signal-node-head b {
            color: #d3d6d0;
            font: 600 9px var(--mono);
        }

        .ls-visual-signal-meter {
            margin-top: 9px;
            height: 3px;
            background: rgba(255, 255, 255, .06);
        }

        .ls-visual-signal-meter i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--info), var(--signal2));
            transform-origin: left center;
            animation: lsVisualBar .8s cubic-bezier(.16, 1, .3, 1) both;
        }

        .ls-visual-signal-node small {
            display: block;
            margin-top: 6px;
            color: #4f5650;
            font: 500 6px var(--mono);
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .ls-visual-evidence-text {
            max-height: 245px;
            overflow: auto;
            padding: 15px;
            color: #d0d4ce;
            font: 500 10px/1.8 var(--mono);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ls-visual-evidence-text.is-empty {
            color: var(--faint);
            font-style: italic;
        }

        .ls-visual-brief {
            padding: 15px;
            color: #979d96;
            font: 500 9px/1.75 var(--mono);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ls-visual-chain {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            background: #090c0f;
        }

        .ls-visual-chain-step {
            position: relative;
            padding: 13px 14px 14px;
            border-right: 1px solid var(--line);
            min-width: 0;
        }

        .ls-visual-chain-step:last-child {
            border-right: 0;
        }

        .ls-visual-chain-step:not(:last-child):after {
            content: "›";
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 13px;
            height: 13px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: #0a0d10;
            color: #727972;
            font: 500 10px var(--mono);
            z-index: 2;
        }

        .ls-visual-chain-step.is-threat {
            background: rgba(217, 107, 99, .045);
        }

        .ls-visual-chain-step.is-threat em {
            color: var(--critical);
        }

        .ls-visual-chain-step.is-clear {
            background: rgba(126, 180, 139, .045);
        }

        .ls-visual-chain-step.is-clear em {
            color: var(--ok);
        }

        .ls-visual-chain-step.is-neutral {
            background: rgba(121, 197, 207, .035);
        }

        .ls-visual-chain-step em {
            display: block;
            color: var(--info);
            font: 600 7px var(--mono);
            letter-spacing: .10em;
            font-style: normal;
        }

        .ls-visual-chain-step strong {
            display: block;
            margin-top: 7px;
            color: #d6d9d3;
            font: 600 9px var(--display);
        }

        .ls-visual-chain-step span {
            display: block;
            margin-top: 4px;
            color: var(--faint);
            font: 500 6px/1.5 var(--mono);
            text-transform: uppercase;
            letter-spacing: .05em;
        }


        /* Visual result state + OCR evidence board */
        .ls-visual-state {
            transition: border-color .28s ease, background .28s ease, box-shadow .28s ease;
        }

        .ls-visual-state.is-threat {
            border-color: rgba(217, 107, 99, .34);
            background:
                linear-gradient(145deg, rgba(42, 21, 22, .72), rgba(14, 11, 13, .98) 68%),
                radial-gradient(circle at 92% 4%, rgba(217, 107, 99, .14), transparent 30%);
            box-shadow: inset 3px 0 0 var(--critical), 0 18px 46px rgba(0, 0, 0, .22);
        }

        .ls-visual-state.is-clear {
            border-color: rgba(126, 180, 139, .34);
            background:
                linear-gradient(145deg, rgba(20, 34, 25, .76), rgba(10, 14, 12, .98) 68%),
                radial-gradient(circle at 92% 4%, rgba(126, 180, 139, .14), transparent 30%);
            box-shadow: inset 3px 0 0 var(--ok), 0 18px 46px rgba(0, 0, 0, .22);
        }

        .ls-visual-state.is-neutral {
            border-color: rgba(121, 197, 207, .28);
            background:
                linear-gradient(145deg, rgba(20, 29, 32, .72), rgba(10, 14, 16, .98) 68%),
                radial-gradient(circle at 92% 4%, rgba(121, 197, 207, .14), transparent 30%);
            box-shadow: inset 3px 0 0 var(--info), 0 18px 46px rgba(0, 0, 0, .22);
        }

        .ls-visual-decision-line {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 13px;
            color: #8c948d;
            font: 600 7px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .ls-visual-decision-line i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex: 0 0 auto;
            background: var(--info);
            box-shadow: 0 0 0 4px rgba(121, 197, 207, .06);
        }

        .ls-visual-state.is-threat .ls-visual-decision-line i {
            background: var(--critical);
            box-shadow: 0 0 0 4px rgba(217, 107, 99, .07);
        }

        .ls-visual-state.is-clear .ls-visual-decision-line i {
            background: var(--ok);
            box-shadow: 0 0 0 4px rgba(126, 180, 139, .07);
        }

        .ls-visual-state-title-wrap {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-top: 11px;
        }

        .ls-visual-state-symbol {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(121, 197, 207, .2);
            background: rgba(5, 8, 10, .56);
            color: var(--info);
            flex: 0 0 auto;
        }

        .ls-visual-state-symbol svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.45;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .ls-visual-state.is-threat .ls-visual-state-symbol {
            color: var(--critical);
            border-color: rgba(217, 107, 99, .24);
            background: rgba(217, 107, 99, .05);
        }

        .ls-visual-state.is-clear .ls-visual-state-symbol {
            color: var(--ok);
            border-color: rgba(126, 180, 139, .24);
            background: rgba(126, 180, 139, .05);
        }

        .ls-visual-state-title-wrap .ls-visual-state-title {
            margin-top: 0;
        }

        .ls-visual-state-statecode {
            margin-top: 7px;
            color: #6f7771;
            font: 600 7px var(--mono);
            letter-spacing: .10em;
            text-transform: uppercase;
        }

        .ls-visual-state.is-threat .ls-visual-state-statecode {
            color: rgba(228, 154, 147, .78);
        }

        .ls-visual-state.is-clear .ls-visual-state-statecode {
            color: rgba(155, 199, 164, .78);
        }

        .ls-visual-confidence-readout {
            margin-top: 17px;
            padding-top: 13px;
            border-top: 1px solid var(--line);
        }

        .ls-visual-confidence-caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .09em;
            text-transform: uppercase;
        }

        .ls-visual-confidence-caption b {
            color: #cdd2cc;
            font-weight: 600;
        }

        .ls-visual-state.is-threat .ls-visual-confidence-caption b {
            color: #e3a19a;
        }

        .ls-visual-state.is-clear .ls-visual-confidence-caption b {
            color: #a4cfad;
        }

        .ls-visual-confidence-scale {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            height: 7px;
        }

        .ls-visual-confidence-scale i {
            display: block;
            background: rgba(255, 255, 255, .055);
            border: 1px solid rgba(255, 255, 255, .025);
        }

        .ls-visual-state.is-threat .ls-visual-confidence-scale i.on {
            background: var(--critical);
            border-color: rgba(217, 107, 99, .32);
        }

        .ls-visual-state.is-clear .ls-visual-confidence-scale i.on {
            background: var(--ok);
            border-color: rgba(126, 180, 139, .32);
        }

        .ls-visual-state.is-neutral .ls-visual-confidence-scale i.on {
            background: var(--info);
            border-color: rgba(121, 197, 207, .32);
        }

        .ls-visual-evidence-text {
            padding: 0;
            max-height: none;
        }

        .ls-visual-ocr-board {
            padding: 6px 0;
            background:
                linear-gradient(90deg, rgba(121, 197, 207, .03), transparent 18%),
                #080b0e;
        }

        .ls-visual-ocr-line {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr);
            gap: 0;
            min-height: 48px;
            border-bottom: 1px solid rgba(242, 240, 235, .055);
            animation: lsVisualOCRReveal .38s cubic-bezier(.16, 1, .3, 1) both;
        }

        .ls-visual-ocr-line:last-child {
            border-bottom: 0;
        }

        .ls-visual-ocr-no {
            padding: 14px 11px 13px 14px;
            color: #4b5550;
            font: 600 7px var(--mono);
            letter-spacing: .08em;
            border-right: 1px solid rgba(242, 240, 235, .055);
            background: rgba(255, 255, 255, .008);
        }

        .ls-visual-ocr-content {
            position: relative;
            padding: 12px 15px 12px 18px;
            color: #d7dad5;
            font: 600 10px/1.7 var(--mono);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ls-visual-ocr-content:before {
            content: "";
            position: absolute;
            left: 0;
            top: 11px;
            bottom: 11px;
            width: 2px;
            background: rgba(121, 197, 207, .28);
        }

        .ls-visual-ocr-line:hover .ls-visual-ocr-content {
            background: rgba(121, 197, 207, .025);
        }

        .ls-visual-ocr-empty {
            padding: 18px;
            color: var(--faint);
            font: 500 8px var(--mono);
            letter-spacing: .04em;
        }

        .ls-visual-brief {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            align-items: stretch;
            padding: 0;
            min-width: 0;
        }

        .ls-visual-brief-block {
            min-width: 0;
            padding: 14px 15px 15px;
            border-right: 1px solid rgba(242, 240, 235, .055);
            border-bottom: 0;
        }

        .ls-visual-brief-block:last-child {
            border-right: 0;
        }

        .ls-visual-brief-label {
            color: var(--info);
            font: 600 7px var(--mono);
            letter-spacing: .11em;
            text-transform: uppercase;
        }

        .ls-visual-brief-copy {
            margin-top: 8px;
            color: #9ca39c;
            font: 500 8px/1.7 var(--mono);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .ls-visual-brief-subhead {
            display: block;
            margin: 0 0 5px;
            color: #c3c8c1;
            font: 600 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        @keyframes lsVisualOCRReveal {
            from {
                opacity: 0;
                transform: translateX(-7px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width:920px) {
            .ls-visual-brief {
                grid-template-columns: 1fr;
            }

            .ls-visual-brief-block {
                border-right: 0;
                border-bottom: 1px solid rgba(242, 240, 235, .055);
            }

            .ls-visual-brief-block:last-child {
                border-bottom: 0;
            }

            .ls-visual-result-grid {
                grid-template-columns: 1fr;
            }

            .ls-visual-evidence {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .ls-visual-finding {
                padding-top: 16px;
            }
        }

        @media (max-width:640px) {
            .ls-visual-evidence {
                padding: 10px;
            }

            .ls-visual-state {
                padding: 15px;
            }

            .ls-visual-state-title-wrap {
                gap: 9px;
            }

            .ls-visual-state-symbol {
                width: 34px;
                height: 34px;
            }

            .ls-visual-state-title {
                font-size: 29px;
            }

            .ls-visual-ocr-line {
                grid-template-columns: 40px minmax(0, 1fr);
            }

            .ls-visual-ocr-no {
                padding-left: 9px;
            }
        }

        /* Custom theme crop tool */
        .ls-visual-crop-trigger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            border: 1px solid rgba(121, 197, 207, .22);
            background: rgba(121, 197, 207, .035);
            color: #8dcbd3;
            font: 600 7px var(--mono);
            letter-spacing: .10em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color .2s ease, background .2s ease, color .2s ease, transform .2s ease;
        }

        .ls-visual-crop-trigger:hover:not(:disabled) {
            border-color: rgba(121, 197, 207, .42);
            background: rgba(121, 197, 207, .07);
            color: #c3edf0;
            transform: translateY(-1px);
        }

        .ls-visual-crop-trigger:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .ls-visual-crop-modal {
            position: fixed;
            inset: 0;
            z-index: 180;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background: rgba(3, 5, 6, .82);
            backdrop-filter: blur(16px);
        }

        .ls-visual-crop-modal.open {
            display: flex;
        }

        .ls-visual-crop-panel {
            width: min(980px, 100%);
            max-height: min(90vh, 820px);
            overflow: hidden;
            border: 1px solid rgba(121, 197, 207, .20);
            background: linear-gradient(180deg, #0d1114, #080b0e);
            box-shadow: 0 34px 120px rgba(0, 0, 0, .72);
            animation: lsVisualCropIn .28s cubic-bezier(.16, 1, .3, 1) both;
        }

        .ls-visual-crop-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .ls-visual-crop-head small {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .ls-visual-crop-head strong {
            display: block;
            margin-top: 5px;
            color: #e7e9e3;
            font: 600 14px var(--display);
        }

        .ls-visual-crop-close {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            color: #8a908a;
            cursor: pointer;
        }

        .ls-visual-crop-stage-wrap {
            padding: 16px;
            background: #050708;
        }

        .ls-visual-crop-stage {
            position: relative;
            width: min(920px, 100%);
            height: min(62vh, 560px);
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid var(--line);
            background:
                linear-gradient(rgba(121, 197, 207, .035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(121, 197, 207, .035) 1px, transparent 1px),
                #07090b;
            background-size: 24px 24px;
            touch-action: none;
            user-select: none;
        }

        .ls-visual-crop-image {
            display: block;
            box-sizing: border-box;
            min-width: 0;
            min-height: 0;
            max-width: calc(100% - 2px);
            max-height: calc(100% - 2px);
            width: auto;
            height: auto;
            object-fit: contain;
            flex: 0 1 auto;
            pointer-events: none;
        }

        .ls-visual-crop-dim {
            position: absolute;
            border: 1px solid rgba(121, 197, 207, .58);
            background: rgba(0, 0, 0, .20);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, .56), 0 0 0 1px rgba(121, 197, 207, .08) inset;
            cursor: move;
            touch-action: none;
        }

        .ls-visual-crop-dim:before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent 49.5%, rgba(121, 197, 207, .28) 49.5%, rgba(121, 197, 207, .28) 50.5%, transparent 50.5%),
                linear-gradient(transparent 49.5%, rgba(121, 197, 207, .28) 49.5%, rgba(121, 197, 207, .28) 50.5%, transparent 50.5%);
            pointer-events: none;
        }

        .ls-visual-crop-corner {
            position: absolute;
            width: 12px;
            height: 12px;
            border-color: #a9e1e5;
            border-style: solid;
            pointer-events: none;
        }

        .ls-visual-crop-corner.tl {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .ls-visual-crop-corner.tr {
            top: -1px;
            right: -1px;
            border-width: 2px 2px 0 0;
        }

        .ls-visual-crop-corner.bl {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 2px 2px;
        }

        .ls-visual-crop-corner.br {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .ls-visual-crop-handle {
            position: absolute;
            right: -7px;
            bottom: -7px;
            width: 14px;
            height: 14px;
            border: 1px solid #b8e8eb;
            background: #0a1012;
            box-shadow: 0 0 0 3px rgba(121, 197, 207, .08);
            cursor: nwse-resize;
        }

        .ls-visual-crop-hint {
            margin-top: 9px;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .ls-visual-crop-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border-top: 1px solid var(--line);
        }

        .ls-visual-crop-actions {
            display: flex;
            gap: 7px;
        }

        .ls-visual-crop-btn {
            padding: 9px 12px;
            border: 1px solid var(--line);
            background: #0c1013;
            color: #9ca29b;
            font: 600 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
        }

        .ls-visual-crop-btn.primary {
            border-color: rgba(121, 197, 207, .30);
            background: rgba(121, 197, 207, .08);
            color: #a8e0e4;
        }

        .ls-visual-crop-status {
            color: #5e6761;
            font: 500 7px var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        @keyframes lsVisualCropIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(.985);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .ls-visual-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 13px;
            border-top: 1px solid var(--line);
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .07em;
            text-transform: uppercase;
        }

        .ls-visual-footer strong {
            color: #7d847d;
            font-weight: 500;
        }

        @keyframes lsVisualReveal {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes lsVisualBar {
            from {
                transform: scaleX(0);
            }

            to {
                transform: scaleX(1);
            }
        }

        @keyframes lsVisualScan {

            0%,
            100% {
                transform: translateY(0);
                opacity: .15;
            }

            50% {
                transform: translateY(420px);
                opacity: .85;
            }
        }

        @media (max-width: 1000px) {

            .ls-visual-intake,
            .ls-visual-result-grid {
                grid-template-columns: 1fr;
            }

            .ls-visual-drop {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .ls-visual-evidence {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .ls-visual-evidence-frame {
                height: min(56vh, 520px);
            }

            .ls-visual-chain {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .ls-visual-chain-step:nth-child(3) {
                border-right: 0;
            }

            .ls-visual-chain-step:nth-child(3):after {
                display: none;
            }

        .ls-tp-source-top {

        .ls-tp-source-mark {

            place-items: center;
            color: var(--info)

        .ls-tp-source-mark svg {

            height: 15px;

            fill: none;

            stroke-linecap: round;
            stroke-linejoin: round

        .ls-tp-source b {
            font: 600 9px var(--display)
        }

        .ls-tp-source small {
            display: block;
            margin-top: 5px;
            color: var(--faint);
            font: 500 7px/1.55 var(--mono)
        }

        .ls-tp-file-name {
            margin-top: 14px;
            font: 600 9px var(--mono);
            color: #c9cdc7;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .ls-tp-file-meta {
            margin-top: 4px;
            color: #616760;
            font: 500 7px var(--mono)
        }

        .ls-tp-file-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px
        }

        .ls-tp-mini-btn {
            border: 1px solid var(--line);
            padding: 6px 8px;
            color: #9ba09a;
            background: #0d1013;
            font: 500 7px var(--mono);
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer

        .ls-tp-mini-btn:hover {
            border-color: var(--line2);
            color: #fff
        }

        .ls-tp-voice {
            display: none;

            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--line)
        }
