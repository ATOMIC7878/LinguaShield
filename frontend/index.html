            display: grid
        }

        .ls-tp-voice-card {
            border: 1px solid var(--line);
            background: #0a0d10;
            padding: 12px
        }

        .ls-tp-voice-label {
            font: 500 7px var(--mono);
            letter-spacing: .12em;
            color: var(--info);
            text-transform: uppercase
        }

        .ls-tp-voice-card b {
            display: block;
            margin-top: 6px;
            font: 600 10px var(--display)
        }

        .ls-tp-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 7px;
            font: 500 7px var(--mono);
            color: #5c635c;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        .ls-tp-status i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4f554f;
            box-shadow: 0 0 0 4px rgba(79, 85, 79, .08)
        }

        .ls-tp-status.ready {
            color: var(--ok)
        }

        .ls-tp-status.ready i {
            background: var(--ok);
            box-shadow: 0 0 0 4px rgba(126, 180, 139, .08)
        }

        .ls-tp-ready {
            border: 1px solid var(--line);
            background: linear-gradient(90deg, rgba(121, 197, 207, .035), rgba(239, 108, 47, .025));
            padding: 10px 12px;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .ls-tp-ready-copy {
            font: 500 7px/1.6 var(--mono);
            color: #717871
        }

        .ls-tp-ready-copy strong {
            display: block;
            color: #c8ccc6;
            font: 600 8px var(--display);
            margin-bottom: 2px
        }

        .ls-tp-ready-count {
            font: 600 19px var(--display);
            color: var(--ink)
        }

        .ls-tp-runbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            padding-top: 11px;
            border-top: 1px solid var(--line)
        }

        .ls-tp-run-note {
            color: #60675f;
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .ls-tp-run-actions {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ls-tp-run {
            min-width: 190px
        }

        .ls-tp-clear {
            border: 1px solid var(--line);
            padding: 10px 11px;
            background: #0d1013;
            color: #888e87;
            cursor: pointer;
            font: 500 7px var(--mono);
            letter-spacing: .07em;
            text-transform: uppercase
        }

        .ls-tp-clear:hover {
            color: #fff;
            border-color: var(--line2)
        }

        .ls-tp-intel {
            display: grid;
            gap: 10px
        }

        .ls-tp-intel-block {
            border: 1px solid var(--line);
            background: #0a0d10;
            padding: 12px
        }

        .ls-tp-intel-kicker {
            font: 500 7px var(--mono);
            letter-spacing: .11em;
            color: var(--faint);
            text-transform: uppercase
        }

        .ls-tp-intel-title {
            margin-top: 7px;
            font: 600 12px var(--display)
        }

        .ls-tp-intel-copy {
            margin-top: 5px;
            color: #7e847e;
            font: 500 7px/1.65 var(--mono)
        }

        .ls-tp-trace {
            display: grid;
            gap: 1px;
            background: var(--line);
            margin-top: 9px
        }

        .ls-tp-trace-row {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 9px;
            padding: 8px;
            background: #0a0d10
        }

        .ls-tp-trace-row b {
            font: 500 7px var(--mono);
            color: var(--signal);
            letter-spacing: .08em
        }

        .ls-tp-trace-row span {
            font: 500 7px/1.4 var(--mono);
            color: #70766f
        }

        /* TrustPath result view — visual / multi-tab system. */
        .ls-tp-results {
            display: grid;
            gap: 14px;
            animation: lsTpIn .36s ease both;
        }

        .ls-tp-verdict {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 250px 190px;
            min-height: 178px;
            border: 1px solid var(--line);
            background: #0b0e11;
            overflow: hidden;
        }

        .ls-tp-verdict-main {
            position: relative;
            padding: 23px 26px;
            display: grid;
            align-content: center;
            background:
                radial-gradient(circle at 92% 44%, rgba(239, 108, 47, .11), transparent 28%),
                linear-gradient(120deg, #101419, #0a0d10 72%);
            border-right: 1px solid var(--line);
        }

        .ls-tp-verdict-main:after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--signal), transparent 72%);
        }

        .ls-tp-case-kicker {
            font: 500 9px var(--mono);
            letter-spacing: .16em;
            color: var(--faint);
            text-transform: uppercase;
        }

        .ls-tp-case-title {
            margin-top: 9px;
            font: 600 clamp(31px, 3.7vw, 56px)/.96 var(--display);
            letter-spacing: -.05em;
            max-width: 850px;
        }

        .ls-tp-case-summary {
            margin-top: 12px;
            max-width: 760px;
            color: #929891;
            font: 500 12px/1.6 var(--mono);
        }

        .ls-tp-verdict-stat {
            padding: 22px 20px;
            border-right: 1px solid var(--line);
            display: grid;
            align-content: center;
            gap: 8px;
        }

        .ls-tp-verdict-stat:last-child {
            border-right: 0;
        }

        .ls-tp-verdict-stat span {
            font: 500 8px var(--mono);
            letter-spacing: .12em;
            color: var(--faint);
            text-transform: uppercase;
        }

        .ls-tp-verdict-stat strong {
            font: 600 22px var(--display);
            word-break: break-word;
        }

        .ls-tp-risk-clear {
            color: var(--ok);
        }

        .ls-tp-risk-risk {
            color: var(--critical);
        }

        .ls-tp-risk-mid {
            color: var(--warn);
        }

        .ls-tp-nav {
            display: flex;
            gap: 5px;
            padding: 7px;
            border: 1px solid var(--line);
            background: #0a0d10;
            overflow-x: auto;
        }

        .ls-tp-nav button {
            flex: 1 0 auto;
            min-width: 110px;
            padding: 10px 13px;
            border: 1px solid transparent;
            background: #0d1013;
            color: #767d76;
            font: 500 8px var(--mono);
            letter-spacing: .1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: .2s ease;
        }

        .ls-tp-nav button:hover {
            color: #d9ddd7;
            border-color: var(--line2);
        }

        .ls-tp-nav button.active {
            color: #fff;
            border-color: rgba(239, 108, 47, .32);
            background: linear-gradient(180deg, rgba(239, 108, 47, .13), rgba(239, 108, 47, .035));
            box-shadow: inset 0 -2px 0 var(--signal);
        }

        .ls-tp-tab {
            display: none;
            gap: 14px;
        }

        .ls-tp-tab.active {
            display: grid;
            animation: lsTpTabIn .25s ease both;
        }

        @keyframes lsTpTabIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .ls-tp-grid-hero {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(310px, .8fr);
            gap: 14px;
        }

        .ls-tp-panel {
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #0f1215, #090c0f);
            min-width: 0;
        }

        .ls-tp-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 17px;
            border-bottom: 1px solid var(--line);
        }

        .ls-tp-panel-head strong {
            font: 600 16px var(--display);
        }

        .ls-tp-panel-head span {
            font: 500 8px var(--mono);
            color: var(--faint);
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .ls-tp-map {
            position: relative;
            min-height: 430px;
            overflow: hidden;
            background:
                linear-gradient(rgba(242, 240, 235, .018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(242, 240, 235, .018) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(239, 108, 47, .10), transparent 28%),
                #090c0f;
            background-size: 34px 34px, 34px 34px, auto, auto;
        }

        .ls-tp-map svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ls-tp-map-line {
            stroke: rgba(121, 197, 207, .38);
            stroke-width: 1.2;
            fill: none;
        }

        .ls-tp-map-line.risk {
            stroke: rgba(217, 107, 99, .46);
            stroke-dasharray: 5 5;
        }

        .ls-tp-map-node {
            position: absolute;
            width: 154px;
            min-height: 72px;
            padding: 11px 12px;
            border: 1px solid var(--line2);
            background: rgba(10, 13, 16, .95);
            box-shadow: 0 16px 40px rgba(0, 0, 0, .22);
            transition: .22s ease;
            z-index: 2;
        }

        .ls-tp-map-node:hover {
            transform: translateY(-2px);
            border-color: rgba(239, 108, 47, .35);
        }

        .ls-tp-map-node .k {
            font: 500 7px var(--mono);
            letter-spacing: .1em;
            color: var(--faint);
            text-transform: uppercase;
        }

        .ls-tp-map-node .t {
            margin-top: 6px;
            font: 600 13px var(--display);
        }

        .ls-tp-map-node .m {
            margin-top: 4px;
            color: #6e756e;
            font: 500 8px var(--mono);
        }

        .ls-tp-map-node.risk {
            border-color: rgba(217, 107, 99, .28);
        }

        .ls-tp-map-node.risk .k {
            color: var(--critical);
        }

        .ls-tp-map-node.ok {
            border-color: rgba(126, 180, 139, .24);
        }

        .ls-tp-map-node.ok .k {
            color: var(--ok);
        }

        .ls-tp-map-node.center {
            width: 220px;
            min-height: 220px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            border-color: rgba(239, 108, 47, .55);
            background: radial-gradient(circle, rgba(239, 108, 47, .14), rgba(10, 13, 16, .97) 62%);
            box-shadow: 0 0 0 15px rgba(239, 108, 47, .035), 0 0 60px rgba(239, 108, 47, .08);
        }

        .ls-tp-map-node.center:hover {
            transform: translate(-50%, -50%);
        }

        .ls-tp-map-node.center .k {
            color: var(--signal);
        }

        .ls-tp-map-node.center .t {
            font-size: 29px;
        }

        .ls-tp-map-node.center .m {
            color: #a1a69f;
            font-size: 10px;
        }

        .ls-tp-map-01 {
            left: 5%;
            top: 20%;
        }

        .ls-tp-map-02 {
            left: 5%;
            top: 63%;
        }

        .ls-tp-map-03 {
            right: 5%;
            top: 42%;
        }

        .ls-tp-signal-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--line);
        }

        .ls-tp-signal {
            padding: 17px;
            background: #0b0e11;
        }

        .ls-tp-signal span {
            display: block;
            font: 500 8px var(--mono);
            color: var(--faint);
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .ls-tp-signal b {
            display: block;
            margin-top: 8px;
            font: 600 24px var(--display);
        }

        .ls-tp-signal small {
            display: block;
            margin-top: 4px;
            color: #6f766f;
            font: 500 8px var(--mono);
        }

        .ls-tp-story-visual {
            padding: 20px;
            min-height: 430px;
            display: grid;
            align-content: center;
            gap: 13px;

                radial-gradient(circle at 90% 15%, rgba(239, 108, 47, .12), transparent 34%),

        }

        .ls-tp-story-kicker {
            font: 500 8px var(--mono);
            letter-spacing: .15em;
            color: var(--signal);
            text-transform: uppercase;
        }

            letter-spacing: -.045em;
            max-width: 700px;

            margin: 4px 0 0;
            color: #969c95;
            font: 500 12px/1.7 var(--mono);
            max-width: 730px;
        }

            margin-top: 7px;

            border: 1px solid var(--line);
            background: #0d1013;
        }

        .ls-tp-story-node span {

            font: 500 7px var(--mono);
            color: var(--info);
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .ls-tp-story-node b {
            display: block;
            margin-top: 7px;
            color: #d9ddd7;
            font: 600 11px/1.45 var(--display);
        }

            overflow: hidden;

            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--info), transparent);

        .ls-tp-evidence-card.risk:after {
            background: linear-gradient(90deg, var(--critical), transparent);
        }

        .ls-tp-evidence-no {
            font: 500 9px var(--mono);
            color: var(--signal);
        }

        .ls-tp-evidence-type {
            float: right;
            font: 500 8px var(--mono);
            color: var(--faint);
            letter-spacing: .1em;
        }

        .ls-tp-evidence-card h3 {
            margin: 20px 0 0;
            font: 600 18px var(--display);
        }

        .ls-tp-evidence-card p {
            margin: 7px 0 0;
            color: #7e857e;
            font: 500 9px/1.6 var(--mono);
        }

            margin-top: 15px;

            padding: 5px 7px;

            text-transform: uppercase;
            letter-spacing: .07em;
        }

            gap: 14px;

            background: linear-gradient(135deg, #101317, #0a0d10 70%);

            letter-spacing: -.04em;
        }

            color: #8f958e;
            font: 500 12px/1.75 var(--mono);
            max-width: 760px;

        .ls-tp-story-points {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }

        }

        .ls-tp-story-point b {

            font: 500 8px var(--mono);
            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .ls-tp-story-point span {

            color: #a5aaa3;
            font: 500 10px/1.55 var(--mono);

            gap: 14px;

            border: 1px solid var(--line);

            background: #0b0e11;
        }

        .ls-tp-story-side-item span {
            display: block;
            font: 500 8px var(--mono);
            color: var(--faint);
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .ls-tp-story-side-item b {
            display: block;
            margin-top: 7px;
            font: 600 14px/1.4 var(--display);

            gap: 14px;

            background: radial-gradient(circle at 50% 50%, rgba(121, 197, 207, .06), transparent 35%), #090c0f;

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            height: 260px;
            border: 1px dashed rgba(121, 197, 207, .18);
            border-radius: 50%;
        }

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            background: #0b0e11;
            box-shadow: 0 0 0 14px rgba(239, 108, 47, .03);

            margin-top: 4px;
            font: 500 7px var(--mono);

            top: 14%;

        .ls-tp-rel-node.b {
            right: 6%;
            top: 20%;
        }

        .ls-tp-rel-node.c {
            left: 11%;
            bottom: 12%;
        }

        .ls-tp-rel-node.d {
            right: 11%;
            bottom: 12%;
        }

        .ls-tp-rel-node span {
            display: block;
            font: 500 7px var(--mono);
            color: var(--faint);
            letter-spacing: .09em;
            text-transform: uppercase;

        .ls-tp-rel-node b {
            display: block;
            margin-top: 5px;
            font: 600 10px var(--display);
        }

        .ls-tp-connection-svg {

            inset: 0;
            width: 100%;
            height: 100%;
        }

            stroke: rgba(239, 108, 47, .36);
            stroke-width: 1.2;

        }

        .ls-tp-final-hero-main {
            padding: 24px 26px;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .ls-tp-final-kicker {
            font: 500 8px var(--mono);
            letter-spacing: .14em;
            color: var(--signal);
            text-transform: uppercase
        }

        .ls-tp-final-hero h2 {
            margin: 8px 0 0;

            letter-spacing: -.045em
        }

        .ls-tp-final-hero p {
            max-width: 800px;
            margin: 10px 0 0;
            color: #929891;
            font: 500 11px/1.6 var(--mono)

        .ls-tp-final-verdict {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            padding: 22px;
            border-left: 1px solid var(--line);
            background: #0b0e11
        }

        .ls-tp-final-verdict span {
            font: 500 7px var(--mono);
            letter-spacing: .14em;
            color: var(--faint)
        }

        .ls-tp-final-verdict strong {
            margin-top: 6px;
            font: 600 34px var(--display);
            letter-spacing: -.04em
        }

        .ls-tp-final-verdict small {
            margin-top: 6px;
            color: #8b918a;
            font: 600 8px var(--mono);
            letter-spacing: .06em
        }

        .ls-tp-final-verdict.risk {
            border-top: 2px solid var(--critical);
            background: linear-gradient(180deg, rgba(217, 107, 99, .10), #0b0e11 55%)
        }

        .ls-tp-final-verdict.risk strong {
            color: var(--critical)
        }

        .ls-tp-final-verdict.warn {
            border-top: 2px solid var(--warn)
        }

        .ls-tp-final-verdict.ok {
            border-top: 2px solid var(--ok)
        }

        .ls-tp-final-verdict.info {
            border-top: 2px solid var(--info)
        }

        .ls-tp-final-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line)
        }

        .ls-tp-final-tab {
            min-height: 48px;
            background: #0b0e11;
            color: #727870;
            cursor: pointer;
            border: 0;
            font: 500 8px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
            transition: color .2s, background .2s, box-shadow .2s
        }

        .ls-tp-final-tab:hover {
            color: #fff;
            background: #0e1114
        }

        .ls-tp-final-tab.active {
            color: #fff;
            background: linear-gradient(180deg, rgba(239, 108, 47, .10), #101215);
            box-shadow: inset 0 -3px 0 var(--signal)
        }

        .ls-tp-final-panel {
            display: none
        }

        .ls-tp-final-panel.active {
            display: block;
            animation: lsTpFinalIn .28s ease both
        }

        @keyframes lsTpFinalIn {
            from {
                opacity: .35;
                transform: translateY(4px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .ls-tp-overview-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
            gap: 12px
        }

        .ls-tp-case-map,
        .ls-tp-what-panel,
        .ls-tp-final-panel>.ls-tp-panel-title,
        .ls-tp-connection-visual,
        .ls-tp-connection-list,
        .ls-tp-forecast-main,
        .ls-tp-voice-card-final {
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #0f1215, #0a0d10)
        }

        .ls-tp-panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line)
        }

        .ls-tp-panel-title b {
            display: block;
            font: 600 14px var(--display)
        }

        .ls-tp-panel-title small {
            display: block;
            margin-top: 3px;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase
        }

        .ls-tp-panel-title>span {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .1em
        }

        .ls-tp-panel-title.large b {
            font-size: 17px
        }

        .ls-tp-overview-map {
            height: 405px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(rgba(242, 240, 235, .024) 1px, transparent 1px),
                linear-gradient(90deg, rgba(242, 240, 235, .024) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(239, 108, 47, .06), transparent 34%), #080b0e;
            background-size: 28px 28px
        }

        .ls-tp-map-line {
            position: absolute;

            left: 23%;
            top: 31%;
            width: 300px;
            transform: rotate(21deg)
        }

        .ls-tp-map-line.l2 {
            left: 24%;
            top: 72%;
            width: 285px;
            transform: rotate(-24deg)
        }

        .ls-tp-map-line.l3 {
            left: 69%;
            top: 51%;
            width: 180px;
            transform: rotate(180deg);
            background: linear-gradient(90deg, rgba(217, 107, 99, .60), rgba(217, 107, 99, .03));
            transform-origin: right center
        }

        .ls-tp-final-node {
            position: absolute;
            width: 190px;
            padding: 13px;
            border: 1px solid var(--line2);
            background: rgba(10, 13, 16, .92);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .18)
        }

        .ls-tp-final-node span {
            display: block;
            color: var(--info);
            font: 500 6px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp-final-node b {
            display: block;
            margin-top: 6px;
            font: 600 12px var(--display)
        }

        .ls-tp-final-node.node-1 {
            left: 6%;
            top: 19%;
            border-color: rgba(239, 108, 47, .24)
        }

        .ls-tp-final-node.node-2 {
            left: 6%;
            bottom: 18%;
            border-color: rgba(121, 197, 207, .24)
        }

        .ls-tp-final-node.node-3 {
            right: 5%;
            top: 40%;
            border-color: rgba(217, 107, 99, .22)
        }

        .ls-tp-final-core {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 170px;
            height: 170px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            border: 1px solid var(--signal);
            background: radial-gradient(circle, rgba(239, 108, 47, .12), #090c0f 68%);
            box-shadow: 0 0 0 18px rgba(239, 108, 47, .025), 0 0 70px rgba(239, 108, 47, .09)
        }

        .ls-tp-final-core span {
            display: block;
            color: var(--faint);
            font: 500 6px var(--mono);
            letter-spacing: .15em
        }

        .ls-tp-final-core strong {
            display: block;
            margin-top: 4px;
            font: 600 30px var(--display)
        }

        .ls-tp-final-core small {
            display: block;
            margin-top: 3px;
            color: var(--signal);
            font: 600 8px var(--mono)
        }

        .ls-tp-final-core.risk strong {
            color: var(--critical)
        }

        .ls-tp-what-panel {
            min-height: 100%
        }

        .ls-tp-answer {
            padding: 20px 18px;
            border-bottom: 1px solid var(--line);
            min-height: 122px;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .ls-tp-answer:last-child {
            border-bottom: 0
        }

        .ls-tp-answer span {
            font: 500 7px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--faint)
        }

        .ls-tp-answer strong {
            margin-top: 8px;
            font: 600 clamp(18px, 2vw, 25px)/1.2 var(--display);
            letter-spacing: -.025em;
            color: #e6e8e3
        }

        .ls-tp-answer.answer-objective {
            border-left: 2px solid var(--signal)
        }

        .ls-tp-answer.answer-action {
            border-left: 2px solid var(--ok)
        }

        .ls-tp-answer.answer-next {
            border-left: 2px solid var(--critical)
        }

        .ls-tp-overview-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line);
            margin-top: 12px
        }

        .ls-tp-overview-stats>div {
            background: #0c0f12;
            padding: 15px 16px
        }

        .ls-tp-overview-stats span {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp-overview-stats b {
            display: block;
            margin-top: 7px;
            font: 600 25px var(--display);
            letter-spacing: -.04em
        }

        .risk-text {
            color: var(--critical)
        }

        .ls-tp-source-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
            border: 1px solid var(--line)
        }

        .ls-tp-source-tile {
            min-height: 245px;
            padding: 16px;
            background: #0b0e11;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        .ls-tp-source-tile:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: var(--info)
        }

        .ls-tp-source-tile.is-risk:after {
            background: var(--critical)
        }

        .ls-tp-source-tile.is-clear:after {
            background: var(--ok)
        }

        .ls-tp-source-top {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .ls-tp-source-index {
            color: var(--signal);
            font: 600 8px var(--mono)
        }

        .ls-tp-source-kind {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .1em
        }

        .ls-tp-source-state {
            margin-left: auto;
            color: #747a73;
            font: 500 7px var(--mono);
            letter-spacing: .08em
        }

        .ls-tp-source-symbol {
            width: 68px;
            height: 68px;
            display: grid;
            place-items: center;
            margin: 22px 0 16px;
            border: 1px solid var(--line2);
            color: var(--info);
            font: 600 28px var(--mono);
            background: #090c0f
        }

        .ls-tp-source-tile.is-risk .ls-tp-source-symbol {
            color: var(--critical)
        }

        .ls-tp-source-tile.is-clear .ls-tp-source-symbol {
            color: var(--ok)
        }

        .ls-tp-source-tile h3 {
            margin: 0;
            font: 600 17px var(--display)
        }

        .ls-tp-source-foot {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: auto;
            padding-top: 15px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-connections-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(360px, .95fr);
            gap: 12px
        }

        .ls-tp-connection-map {
            height: 570px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(rgba(242, 240, 235, .022) 1px, transparent 1px),
                linear-gradient(90deg, rgba(242, 240, 235, .022) 1px, transparent 1px),
                radial-gradient(circle at 50% 50%, rgba(121, 197, 207, .05), transparent 30%), #080b0e;
            background-size: 28px 28px
        }

        .ls-tp-orbit {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 310px;
            height: 310px;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(121, 197, 207, .16);
            border-radius: 50%
        }

        .ls-tp-connection-core {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 122px;
            height: 122px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            text-align: center;
            border: 1px solid rgba(239, 108, 47, .55);
            background: #0b0e11;
            box-shadow: 0 0 0 16px rgba(239, 108, 47, .025)
        }

        .ls-tp-connection-core strong {
            display: block;
            font: 600 34px var(--display)
        }

        .ls-tp-connection-core span {
            display: block;
            margin-top: -2px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-connection-node {
            position: absolute;
            padding: 12px 13px;
            border: 1px solid var(--line2);
            background: #0a0d10;
            min-width: 135px;
            text-align: center
        }

        .ls-tp-connection-node span {
            font: 500 7px var(--mono);
            letter-spacing: .08em;
            color: #c5c9c2
        }

        .ls-tp-connection-node.cn-1 {
            left: 7%;
            top: 19%;
            border-color: rgba(239, 108, 47, .2)
        }

        .ls-tp-connection-node.cn-2 {
            right: 8%;
            top: 24%;
            border-color: rgba(121, 197, 207, .2)
        }

        .ls-tp-connection-node.cn-3 {
            left: 8%;
            bottom: 18%;
            border-color: rgba(121, 197, 207, .2)
        }

        .ls-tp-connection-node.cn-4 {
            right: 7%;
            bottom: 17%;
            border-color: rgba(217, 107, 99, .24)
        }

        .ls-tp-connection-list {
            min-height: 570px
        }

        .ls-tp-connection-card,
        .ls-tp-alert-card {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr) auto;
            gap: 12px;
            padding: 15px;
            border-bottom: 1px solid var(--line);
            background: #0b0e11
        }

        .ls-tp-connection-card:last-of-type,
        .ls-tp-alert-card:last-of-type {
            border-bottom: 0
        }

        .ls-tp-connection-card.is-contradiction {
            background: linear-gradient(90deg, rgba(217, 107, 99, .055), #0b0e11 65%)
        }

        .ls-tp-connection-id,
        .ls-tp-alert-id {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(121, 197, 207, .2);
            color: var(--info);
            font: 600 8px var(--mono)
        }

        .ls-tp-connection-card.is-contradiction .ls-tp-connection-id,
        .ls-tp-alert-id {
            border-color: rgba(217, 107, 99, .22);
            color: var(--critical)
        }

        .ls-tp-connection-path {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            font: 600 12px var(--display)
        }

        .ls-tp-connection-path span {
            color: var(--signal)
        }

        .ls-tp-connection-relation {
            margin-top: 5px;
            color: #c0c5be;
            font: 500 8px var(--mono);
            text-transform: uppercase
        }

        .ls-tp-connection-evidence {
            margin-top: 6px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-connection-status {
            align-self: start;
            padding: 4px 6px;
            border: 1px solid var(--line);
            color: #858a83;
            font: 500 7px var(--mono);
            letter-spacing: .06em
        }

        .ls-tp-alert-card {
            grid-template-columns: 42px minmax(0, 1fr) auto;
            background: linear-gradient(90deg, rgba(217, 107, 99, .07), #0b0e11 62%);
            margin-top: 1px
        }

        .ls-tp-alert-card b {
            display: block;
            font: 600 13px var(--display)
        }

        .ls-tp-alert-card span {
            display: block;
            margin-top: 5px;
            color: #8f958e;
            font: 500 8px/1.5 var(--mono)
        }

        .ls-tp-alert-card small {
            display: block;
            margin-top: 6px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-alert-card em {
            font-style: normal;
            color: var(--critical);
            font: 500 7px var(--mono);
            border: 1px solid rgba(217, 107, 99, .2);
            padding: 4px 6px;
            height: max-content
        }

        .ls-tp-forecast-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(330px, .9fr);
            gap: 12px
        }

        .ls-tp-forecast-main,
        .ls-tp-voice-card-final {
            min-height: 380px
        }

        .ls-tp-forecast-card {
            margin: 16px;
            border: 1px solid rgba(217, 107, 99, .2);
            background: radial-gradient(circle at 85% 0, rgba(217, 107, 99, .11), transparent 35%), #0b0e11;
            padding: 24px
        }

        .ls-tp-forecast-card>span,
        .ls-tp-best-step>span,
        .ls-tp-voice-state>span {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .14em
        }

        .ls-tp-forecast-card>strong {
            display: block;
            margin-top: 13px;
            max-width: 700px;
            font: 600 clamp(24px, 3vw, 38px)/1.12 var(--display);
            letter-spacing: -.04em
        }

        .ls-tp-forecast-confidence {
            margin-top: 28px
        }

        .ls-tp-forecast-confidence>div {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: #858b84;
            font: 500 8px var(--mono)
        }

        .ls-tp-forecast-confidence b {
            color: #dfe2dc
        }

        .ls-tp-forecast-confidence>i {
            display: block;
            height: 7px;
            margin-top: 8px;
            background: #1a1e21;
            overflow: hidden
        }

        .ls-tp-forecast-confidence em {
            display: block;
            height: 100%;
            background: var(--signal);
            font-style: normal
        }

        .ls-tp-best-step {
            margin: 0 16px 16px;
            padding: 18px;
            border-left: 2px solid var(--ok);
            background: rgba(126, 180, 139, .035)
        }

        .ls-tp-best-step strong {
            display: block;
            margin-top: 8px;
            font: 600 19px/1.25 var(--display)
        }

        .ls-tp-voice-card-final {
            padding-bottom: 16px
        }

        .ls-tp-voice-state {
            margin: 16px;
            padding: 22px;
            border: 1px solid rgba(121, 197, 207, .18);
            background: linear-gradient(145deg, rgba(121, 197, 207, .055), #0b0e11 62%);
            min-height: 175px
        }

        .ls-tp-voice-state.is-ai {
            border-color: rgba(217, 107, 99, .28);
            background: linear-gradient(145deg, rgba(217, 107, 99, .075), #0b0e11 62%)
        }

        .ls-tp-voice-state.is-low {
            border-color: rgba(126, 180, 139, .24)
        }

        .ls-tp-voice-state strong {
            display: block;
            margin-top: 10px;
            font: 600 29px var(--display);
            letter-spacing: -.04em
        }

        .ls-tp-voice-state.is-ai strong {
            color: var(--critical)
        }

        .ls-tp-voice-state.is-low strong {
            color: var(--ok)
        }

        .ls-tp-voice-state>b {
            display: block;
            margin-top: 6px;
            color: var(--signal);
            font: 600 16px var(--mono)
        }

        .ls-tp-voice-state small {
            display: block;
            margin-top: 12px;
            color: #868d86;
            font: 500 8px/1.55 var(--mono)
        }

        .ls-tp-voice-subgrid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line);
            margin: 0 16px
        }

        .ls-tp-voice-subgrid>div {
            padding: 13px;
            background: #0b0e11
        }

        .ls-tp-voice-subgrid span,
        .ls-tp-secondary-assessment>span {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .08em
        }

        .ls-tp-voice-subgrid b {
            display: block;
            margin-top: 7px;
            font: 600 10px var(--display)
        }

        .ls-tp-no-voice {
            margin: 16px;
            padding: 28px;
            border: 1px dashed var(--line2);
            color: var(--faint);
            font: 500 8px var(--mono);
            text-align: center
        }

        .ls-tp-secondary-assessment {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-top: 12px;
            padding: 13px 16px;
            border: 1px solid var(--line);
            background: #0d1013
        }

        .ls-tp-secondary-assessment>div {
            display: flex;
            gap: 18px;
            flex-wrap: wrap
        }

        .ls-tp-secondary-assessment b {
            font: 500 8px var(--mono);
            color: #9aa098
        }

        .ls-tp-empty-final {
            grid-column: 1/-1;
            padding: 40px 20px;
            color: var(--faint);
            font: 500 8px var(--mono);
            text-align: center;
            background: #0b0e11

        @media(max-width:980px) {
            .ls-tp-final-hero {
                grid-template-columns: 1fr
            }

            .ls-tp-final-verdict {
                border-left: 0;
                border-top: 1px solid var(--line)
            }

            .ls-tp-overview-grid,
            .ls-tp-connections-layout,
            .ls-tp-forecast-grid {
                grid-template-columns: 1fr
            }

            .ls-tp-connection-map {
                height: 420px
            }
        }

        @media(max-width:700px) {
            .ls-tp-final-tabs {
                grid-template-columns: 1fr 1fr
            }

            .ls-tp-source-grid {
                grid-template-columns: 1fr
            }

            .ls-tp-overview-stats {
                grid-template-columns: 1fr 1fr
            }

            .ls-tp-overview-map {
                height: 460px
            }

            .ls-tp-final-node {
                width: 150px
            }

            .ls-tp-final-node.node-3 {
                right: 3%
            }

            .ls-tp-connection-card,
            .ls-tp-alert-card {
                grid-template-columns: 38px minmax(0, 1fr)
            }

        .ls-tp-bio-head span {

        }

        .ls-tp-bio-head strong {

            font: 600 12px var(--display)

        .ls-tp-bio-head small {

        .ls-tp-bio-grid {

        .ls-tp-bio-grid>div>b {
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--faint);
            font: 500 6px var(--mono)
        }

        .ls-tp-bio-grid button {
            width: max-content;
            min-height: 30px;
            padding: 0 9px;
            border: 1px solid var(--line);
            background: #0d1013;
            color: #999f98;

            font: 500 7px var(--mono);
            letter-spacing: .07em;

        .ls-tp-bio-arrow {

        }

            align-items: center;
            gap: 10px
        }

        .ls-tp-intake-runbar>div:first-child>span {
            color: var(--faint);
            font: 500 6px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp-intake-runbar strong {
            font: 600 10px var(--display)
        }

        .ls-tp-intake-runbar small {
            display: block;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-intake-runbar>div:first-child>b {
            color: var(--signal);
            font: 600 12px var(--mono)
        }

        .ls-tp-intake-runbar>div:last-child button {
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            background: #0d1013;
            color: #999f98;
            cursor: pointer;
            font: 500 7px var(--mono);
            letter-spacing: .07em;
            text-transform: uppercase

        .ls-tp-intake-runbar>div:last-child {
            gap: 7px
        }

        .ls-tp-intake-runbar>div:last-child #ls-tp-run {

            background: linear-gradient(180deg, #f27638, #d95b22);
            color: #fff
        }

        .ls-tp-intake-runbar #ls-tp-run:disabled {
            opacity: .42;
            cursor: not-allowed
        }

        .ls-tp3-results {
            display: grid;
            gap: 12px
        }

        .ls-tp3-casebar {
            display: grid;
            grid-template-columns: 1fr 250px;
            border: 1px solid var(--line);
            background: #0c0f12
        }

        .ls-tp3-casebar>div:first-child {
            padding: 20px 22px
        }

        .ls-tp3-casebar span {
            color: var(--signal);
            font: 500 7px var(--mono);
            letter-spacing: .15em
        }

        .ls-tp3-casebar h1 {

            letter-spacing: -.04em
        }

        .ls-tp3-casebar p {

            color: var(--faint);
            font: 500 8px var(--mono)
        }

            align-content: center;
            gap: 4px
        }

            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .1em
        }

        .ls-tp3-case-metric strong {
            font: 600 30px var(--display);
            letter-spacing: -.04em
        }

        .ls-tp3-case-metric small {
            color: var(--muted);
            font: 500 7px var(--mono)
        }

        .ls-tp3-case-metric.risk strong {
            color: var(--critical)
        }

        .ls-tp3-case-metric.warn strong {
            color: var(--warn)
        }

        .ls-tp3-case-metric.clear strong {
            color: var(--ok)
        }

        .ls-tp3-tabs {

            background: #0b0e11;
            color: var(--faint);
            cursor: pointer;
            font: 500 8px var(--mono);
            letter-spacing: .12em;
            text-transform: uppercase
        }

        .ls-tp3-tabs button.active {
            color: #fff;
            background: linear-gradient(180deg, rgba(239, 108, 47, .12), rgba(239, 108, 47, .03));
            box-shadow: inset 0 -2px 0 var(--signal)

        .ls-tp3-panel {
            display: none;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #0f1215, #0b0e11);
            min-width: 0
        }

        .ls-tp3-panel.active {
            display: block
        }

        .ls-tp3-analysis-top {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--line)

        .ls-tp3-case-status,
        .ls-tp3-scenario {
            min-height: 145px;
            padding: 18px;
            background: #0b0e11;
            display: grid;
            align-content: center;
            gap: 5px
        }

        .ls-tp3-case-status span,
        .ls-tp3-scenario span {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp3-case-status strong {
            font: 600 clamp(34px, 4vw, 52px) var(--display);
            letter-spacing: -.05em
        }

        .ls-tp3-case-status em,
        .ls-tp3-scenario em {
            color: var(--muted);
            font: 500 7px var(--mono);
            font-style: normal
        }

        .ls-tp3-case-status.risk strong {
            color: var(--critical)
        }

        .ls-tp3-case-status.warn strong {
            color: var(--warn)
        }

        .ls-tp3-case-status.clear strong {
            color: var(--ok)
        }

        .ls-tp3-scenario strong {
            font: 600 22px var(--display);
            letter-spacing: -.03em
        }

        .ls-tp3-section-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line)
        }

        .ls-tp3-section-label span {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp3-section-label small {
            color: #6e756e;
            font: 500 7px var(--mono)
        }

        .ls-tp3-evidence-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2px;
            background: rgba(242, 240, 235, .07)
        }

        .ls-tp3-evidence-grid.tp-count-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .ls-tp3-evidence-grid.tp-count-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .ls-tp3-evidence-grid.tp-count-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr))
        }

        .ls-tp3-evidence-card {
            min-height: 275px;
            padding: 15px;
            background: #0a0d10;
            display: grid;
            grid-template-rows: auto 76px auto auto 1fr;
            gap: 10px;
            border-bottom: 2px solid var(--line)
        }

        .ls-tp3-evidence-card.risk {
            border-bottom-color: var(--critical)
        }

        .ls-tp3-evidence-card.clear {
            border-bottom-color: var(--ok)
        }

        .ls-tp3-evidence-head {
            display: flex;
            justify-content: space-between;
            gap: 10px
        }

        .ls-tp3-evidence-head span {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .1em
        }

        .ls-tp3-evidence-head b {
            font: 600 7px var(--mono);
            letter-spacing: .08em
        }

        .ls-tp3-evidence-card.risk .ls-tp3-evidence-head b {
            color: var(--critical)
        }

        .ls-tp3-evidence-card.clear .ls-tp3-evidence-head b {
            color: var(--ok)
        }

        .ls-tp3-evidence-card.neutral .ls-tp3-evidence-head b {
            color: var(--faint)
        }

        .ls-tp3-evidence-icon {
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            background: #080b0e;
            color: var(--info)
        }

        .ls-tp3-evidence-card.risk .ls-tp3-evidence-icon {
            color: var(--critical)
        }

        .ls-tp3-evidence-card.clear .ls-tp3-evidence-icon {
            color: var(--ok)
        }

        .ls-tp3-evidence-icon svg {
            width: 38px;
            height: 38px;
            stroke-width: 1.15
        }

        .ls-tp3-evidence-card>strong {
            font: 600 17px var(--display)
        }

        .ls-tp3-evidence-meta {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp3-voice-mini {
            margin-top: 4px;
            padding: 10px;
            border-left: 1px solid var(--info);
            background: rgba(121, 197, 207, .025);
            display: grid;
            gap: 3px
        }

        .ls-tp3-voice-mini span {
            color: var(--faint);
            font: 500 6px var(--mono);
            letter-spacing: .1em
        }

        .ls-tp3-voice-mini b {
            color: var(--info);
            font: 600 10px var(--display)
        }

        .ls-tp3-voice-mini em {
            color: var(--muted);
            font: 500 6px var(--mono);
            font-style: normal
        }

        .ls-tp3-legend {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            padding: 10px 15px;
            border-top: 1px solid var(--line);
            color: var(--faint);
            font: 500 6px var(--mono);
            letter-spacing: .07em
        }

        .ls-tp3-legend span {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .risk-dot,
        .clear-dot,
        .info-dot,
        .neutral-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block
        }

        .risk-dot {
            background: var(--critical)
        }

        .clear-dot {
            background: var(--ok)
        }

        .info-dot {
            background: var(--info)
        }

        .neutral-dot {
            background: var(--faint)
        }

        .ls-tp3-panel-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 15px 17px;
            border-bottom: 1px solid var(--line)
        }

        .ls-tp3-panel-title b {
            display: block;
            font: 600 17px var(--display)
        }

        .ls-tp3-panel-title small {
            display: block;
            margin-top: 4px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp3-panel-title>span {
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp3-correlation-layout {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
            min-height: 540px
        }

        .ls-tp3-correlation-map {
            position: relative;
            min-height: 540px;
            border-right: 1px solid var(--line);
            overflow: hidden;
            background: linear-gradient(rgba(242, 240, 235, .018) 1px, transparent 1px), linear-gradient(90deg, rgba(242, 240, 235, .018) 1px, transparent 1px), #090c0f;
            background-size: 32px 32px
        }

        .ls-tp3-map-ring {
            position: absolute;
            width: 330px;
            height: 330px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 1px dashed rgba(121, 197, 207, .12);
            border-radius: 50%
        }

        .ls-tp3-map-core {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            border: 1px solid rgba(239, 108, 47, .52);
            border-radius: 50%;
            display: grid;
            place-items: center;
            align-content: center;
            background: radial-gradient(circle, rgba(239, 108, 47, .08), #0a0d10 68%)
        }

        .ls-tp3-map-core strong {
            font: 600 34px var(--display)
        }

        .ls-tp3-map-core span {
            color: var(--faint);
            font: 500 6px var(--mono);
            letter-spacing: .1em;
            text-align: center
        }

        .ls-tp3-map-node {
            position: absolute;
            width: 145px;
            padding: 14px;
            border: 1px solid var(--line2);
            background: #0b0e11;
            display: grid;
            justify-items: center;
            gap: 8px
        }

        .ls-tp3-map-node svg {
            width: 24px;
            height: 24px
        }

        .ls-tp3-map-node b {
            font: 600 8px var(--mono);
            letter-spacing: .08em
        }

        .ls-tp3-map-node.m-text {
            left: 7%;
            top: 18%;
            color: var(--signal)
        }

        .ls-tp3-map-node.m-visual {
            right: 7%;
            top: 18%;
            color: var(--info)
        }

        .ls-tp3-map-node.m-id {
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%);
            border-color: rgba(126, 180, 139, .42);
            color: var(--ok);
        }

        .ls-tp3-map-node.m-audio {
            left: 50%;
            bottom: 12%;
            transform: translateX(-50%);
            color: var(--info)
        }

        .ls-tp3-map-node.missing {
            opacity: .34;
            border-style: dashed
        }

        .ls-tp3-map-line {
            position: absolute;
            height: 1px;
            transform-origin: left center;
            background: transparent
        }

        .ls-tp3-map-line.on {
            background: rgba(121, 197, 207, .55)
        }

        .l-tv {
            left: 21%;
            top: 33%;
            width: 58%;
            transform: rotate(0)
        }

        .l-ta {
            left: 22%;
            top: 34%;
            width: 52%;
            transform: rotate(29deg)
        }

        .l-va {
            left: 50%;
            top: 66%;
            width: 30%;
            transform: rotate(-29deg)
        }

        .ls-tp3-pairs {
            padding: 0 15px
        }

        .ls-tp3-section-label.inline {
            padding-left: 0;
            padding-right: 0
        }

        .ls-tp3-pair-card {
            padding: 13px 0;
            border-bottom: 1px solid var(--line);
            display: grid;
            gap: 5px
        }

        .ls-tp3-pair-top {
            display: flex;
            justify-content: space-between
        }

        .ls-tp3-pair-top span {
            color: var(--signal);
            font: 500 7px var(--mono)
        }

        .ls-tp3-pair-top b {
            font: 500 6px var(--mono);
            letter-spacing: .08em
        }

        .ls-tp3-pair-card.connected .ls-tp3-pair-top b {
            color: var(--info)
        }

        .ls-tp3-pair-card.risk .ls-tp3-pair-top b {
            color: var(--critical)
        }

        .ls-tp3-pair-card.neutral .ls-tp3-pair-top b {
            color: var(--faint)
        }

        .ls-tp3-pair-title {
            font: 600 13px var(--display)
        }

        .ls-tp3-pair-title span {
            color: var(--signal);
            padding: 0 5px
        }

        .ls-tp3-pair-score {
            font: 600 22px var(--display)
        }

        .ls-tp3-pair-score small {
            display: block;
            margin-top: 3px;
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp3-returned {
            margin-top: 8px;
            padding-bottom: 12px
        }

        .ls-tp3-returned-row {
            display: grid;
            grid-template-columns: 34px 1fr auto;
            gap: 7px;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid var(--line)
        }

        .ls-tp3-returned-row span,
        .ls-tp3-returned-row>b {
            font: 500 7px var(--mono);
            color: var(--faint)
        }

        .ls-tp3-returned-row strong {
            font: 600 10px var(--display)
        }

        .ls-tp3-returned-row i {
            color: var(--signal);
            font-style: normal
        }

        .ls-tp3-empty {
            margin: 15px 0;
            padding: 20px;
            border: 1px dashed var(--line2);
            color: var(--faint);
            font: 500 8px/1.6 var(--mono)
        }

        .ls-tp3-threat-head {
            padding: 17px 19px;
            border-bottom: 1px solid var(--line)
        }

        .ls-tp3-threat-head span {
            color: var(--signal);
            font: 500 7px var(--mono);
            letter-spacing: .15em
        }

        .ls-tp3-threat-head strong {
            display: block;
            margin-top: 4px;
            font: 600 17px var(--display)
        }

        .ls-tp3-threat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--line)
        }

        .ls-tp3-threat-card {
            min-height: 360px;
            padding: 22px;
            background: #0a0d10;
            display: grid;
            align-content: center;
            gap: 10px;
            border-bottom: 2px solid var(--line)
        }

        .ls-tp3-threat-card.objective {
            border-bottom-color: var(--signal)
        }

        .ls-tp3-threat-card.action {
            border-bottom-color: var(--ok)
        }

        .ls-tp3-threat-card.forecast {
            border-bottom-color: var(--critical)
        }

        .ls-tp3-threat-card>span {
            color: var(--faint);
            font: 500 7px var(--mono);
            letter-spacing: .12em
        }

        .ls-tp3-threat-card strong {
            font: 600 clamp(23px, 2.5vw, 33px)/1.12 var(--display);
            letter-spacing: -.035em
        }

        .ls-tp3-threat-card div {
            color: var(--muted);
            font: 500 8px/1.6 var(--mono)
        }

        .ls-tp-crop-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            background: rgba(4, 6, 8, .82);
            backdrop-filter: blur(12px);
            padding: 22px
        }

        .ls-tp-crop-modal.hidden {
            display: none
        }

        .ls-tp-crop-box {
            width: min(900px, 94vw);
            border: 1px solid var(--line2);
            background: #0b0e11
        }

        .ls-tp-crop-head {
            display: flex;
            justify-content: space-between;
            padding: 13px 15px;
            border-bottom: 1px solid var(--line)
        }

        .ls-tp-crop-head strong {
            font: 600 11px var(--display)
        }

        .ls-tp-crop-head span {
            color: var(--faint);
            font: 500 7px var(--mono)
        }

        .ls-tp-crop-stage {
            min-height: 320px;
            padding: 14px;
            display: grid;
            place-items: center;
            gap: 10px;
            background: #070a0c;
            color: var(--faint);
            font: 500 7px var(--mono);
            text-align: center
        }

        .ls-tp-crop-stage canvas {
            max-width: 100%;
            height: auto
        }

        .ls-tp-crop-foot {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            padding: 12px;
            border-top: 1px solid var(--line)
        }

        .ls-tp-crop-foot button {
            min-height: 32px;
            padding: 0 11px;
            border: 1px solid var(--line);
            background: #0d1013;
            color: #aaa;
            cursor: pointer;
            font: 500 7px var(--mono);
            text-transform: uppercase
        }

        .ls-tp-crop-foot button:last-child {
            border-color: rgba(239, 108, 47, .4);
            background: #e56b2d;
            color: #fff
        }

        @media(max-width:960px) {

            .ls-tp-intake-channels,
            .ls-tp3-evidence-grid,
            .ls-tp3-threat-grid {
                grid-template-columns: 1fr
            }

            .ls-tp3-correlation-layout {
                grid-template-columns: 1fr
            }

            .ls-tp3-correlation-map {
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            .ls-tp3-map-node.m-audio {
                left: 50%
            }

            .ls-tp3-casebar {
                grid-template-columns: 1fr
            }

            .ls-tp3-case-metric {
                border-left: 0;
                border-top: 1px solid var(--line)
            }

            .ls-tp3-analysis-top {
                grid-template-columns: 1fr
            }

            .ls-tp-mode-final {
                flex-wrap: wrap
            }

            .ls-tp-mode-final small {
                width: 100%;
                margin-left: 0
            }

            .ls-tp-std-runbar {
                display: grid
            }

            .ls-tp-intake-runbar {
                display: grid
            }

            .ls-tp-intake-runbar>div:last-child {
                justify-content: flex-end
            }

            .ls-tp-bio-grid {
                grid-template-columns: 1fr
            }

            .ls-tp-bio-arrow {
                display: none
            }
        }

        /* ================================================================
           LUI MODULAR COPILOT — behavioral compatibility layer
           Visible on all six investigation tabs; automatic investigation responses are enabled on Text / Visual / Acoustic / Biometric / Live.
           ================================================================ */
        #lui-fab {
            position: fixed;
            top: 92px;
            right: 22px;
            z-index: 90;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(121, 197, 207, .28);
            background: rgba(10, 13, 16, .94);
            color: var(--info);
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .28), 0 0 22px rgba(121, 197, 207, .07);
            transition: transform .2s, border-color .2s, color .2s, opacity .2s;
        }

        #lui-fab:hover {
            transform: translateY(-1px);
            border-color: rgba(121, 197, 207, .5);
            color: #fff;
        }

        #lui-fab[aria-hidden="true"] {
            display: none;
        }

        #lui-fab .lui-fab-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--info);
            box-shadow: 0 0 14px rgba(121, 197, 207, .55);
        }

        #lui-fab.is-busy .lui-fab-dot {
            background: var(--warn);
            box-shadow: 0 0 14px rgba(213, 179, 107, .55);
            animation: luiPulse 1s infinite;
        }

        #lui-fab.is-risk .lui-fab-dot {
            background: var(--critical);
            box-shadow: 0 0 14px rgba(217, 107, 99, .55);
        }

        #lui-fab.is-clear .lui-fab-dot {
            background: var(--ok);
            box-shadow: 0 0 14px rgba(126, 180, 139, .55);
        }

        @keyframes luiPulse {
            50% {
                transform: scale(.65);
                opacity: .5;
            }
        }

        #lui-layer {
            position: fixed;
            inset: 0;
            z-index: 89;
            pointer-events: none;
        }

        #lui-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            opacity: 0;
            transition: opacity .2s;
            pointer-events: none;
        }

        #lui-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        #lui-drawer {
            position: absolute;
            top: 0;
            right: 0;
            width: min(430px, 100vw);
            height: 100%;
            background: linear-gradient(180deg, #0a0d10, #090b0e 60%, #080a0c);
            border-left: 1px solid rgba(242, 240, 235, .1);
            box-shadow: -30px 0 80px rgba(0, 0, 0, .42);
            transform: translateX(102%);
            transition: transform .24s ease;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }

        #lui-drawer.open {
            transform: translateX(0);
        }

        .lui-drawer-head {
            padding: 16px 17px 14px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;

            font: 500 8px/1.5 var(--mono);
        }

        .lui-close {

            -webkit-appearance: none;
            width: 34px;
            height: 34px;
            margin: 0;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: #0d1115;
            color: var(--soft);
            font: 500 20px/1 var(--mono);
            cursor: pointer;
            display: grid;
            place-items: center;
            box-shadow: none;
            text-shadow: none;

        #lui-send-btn,
