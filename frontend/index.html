    <script>
        (function () {
            'use strict';

            /* ================= LUI DEBUG LOGGING =================
               Temporary diagnostics. Open DevTools -> Console and
               filter for [LUI-DBG].
               Set window.__LINGUASHIELD_LUI_DEBUG__ = false in the
               console to silence logs without changing behavior.
            ======================================================= */
            window.__LINGUASHIELD_LUI_DEBUG__ = true;
            const LUI_DEBUG_PREFIX = '[LUI-DBG][HOST]';
            function luiDbg(event, details = {}) {
                if (window.__LINGUASHIELD_LUI_DEBUG__ === false) return;
                try {
                    const payload = {
                        t: new Date().toISOString(),
                        event,
                        ...details
                    };
                    console.log(LUI_DEBUG_PREFIX, event, payload);
                } catch (_) { }
            }
            function luiDbgWarn(event, details = {}) {
                if (window.__LINGUASHIELD_LUI_DEBUG__ === false) return;
                try { console.warn(LUI_DEBUG_PREFIX, event, { t: new Date().toISOString(), ...details }); } catch (_) { }
            }
            function luiDbgError(event, details = {}) {
                try { console.error(LUI_DEBUG_PREFIX, event, { t: new Date().toISOString(), ...details }); } catch (_) { }
            }
            function luiDebugPayload(value, max = 900) {
                try {
                    const s = typeof value === 'string' ? value : JSON.stringify(value);
                    return s.length > max ? s.slice(0, max) + '…' : s;
                } catch (_) { return String(value ?? ''); }
            }
            window.addEventListener('error', event => luiDbgError('window.error', {
                message: event?.message || '',
                source: event?.filename || '',
                line: event?.lineno || 0,
                column: event?.colno || 0
            }));
            window.addEventListener('unhandledrejection', event => luiDbgError('window.unhandledrejection', {
                reason: String(event?.reason?.stack || event?.reason?.message || event?.reason || '')
            }));

            const API_BASE_URL = "http://127.0.0.1:8000", stage = document.getElementById('ls-stage'), statusEl = document.getElementById('ls-status-text'), nameEl = document.getElementById('ls-current-name'), dialog = document.getElementById('ls-dialog'), dTitle = document.getElementById('ls-dialog-title'), dMsg = document.getElementById('ls-dialog-msg'), dDetail = document.getElementById('ls-dialog-detail');

            // Persist Live event history for the lifetime of this page.
            const lsLiveEventHistory = [];
            const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c]));
            const norm = v => String(v ?? '—').replace(/_/g, ' ').toUpperCase();
            const pct = v => { const n = Number(v); return Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0; };

            function showDialog(t, m, d = '') { dTitle.textContent = t; dMsg.textContent = m; dDetail.textContent = d; dDetail.hidden = !d; dialog.classList.add('open'); dialog.setAttribute('aria-hidden', 'false'); }
            function closeDialog() { dialog.classList.remove('open'); dialog.setAttribute('aria-hidden', 'true'); }
            document.getElementById('ls-dialog-ok').onclick = closeDialog;
            dialog.onclick = e => { if (e.target === dialog) closeDialog(); };

            async function jsonFetch(url, options = {}) {
                const started = performance.now();
                const method = options?.method || 'GET';
                const endpoint = String(url || '').replace(API_BASE_URL, '');
                let bodyPreview = '';
                try {
                    const raw = options?.body;
                    if (typeof raw === 'string') bodyPreview = luiDebugPayload(raw, 700);
                } catch (_) { }
                luiDbg('fetch:start', { method, endpoint, hasSignal: !!options?.signal, bodyPreview });
                try {
                    const r = await fetch(url, options);
                    const ms = Math.round(performance.now() - started);
                    luiDbg('fetch:response', { method, endpoint, status: r.status, ok: r.ok, ms });
                    if (!r.ok) {
                        let d = '';
                        try { d = await r.text(); } catch (_) { }
                        luiDbgError('fetch:http-error', { method, endpoint, status: r.status, ms, responsePreview: luiDebugPayload(d, 1200) });
                        throw new Error(d || `HTTP ${r.status}`);
                    }
                    const out = await r.json();
                    luiDbg('fetch:json-ok', { method, endpoint, ms, responseKeys: out && typeof out === 'object' ? Object.keys(out).slice(0, 30) : [], responsePreview: luiDebugPayload(out, 1200) });
                    return out;
                } catch (error) {
                    const ms = Math.round(performance.now() - started);
                    luiDbgError('fetch:exception', {
                        method, endpoint, ms,
                        name: error?.name || '',
                        message: error?.message || String(error)
                    });
                    throw error;
                }
            }

            const b = { sessionId: localStorage.getItem('lingua_session_id') || ('sess-' + Math.random().toString(36).slice(2, 9)), assetId: null, generation: 0, seq: Number(localStorage.getItem('lingua_activation_seq') || 0), activeController: null };
            localStorage.setItem('lingua_session_id', b.sessionId);

            const LUI_VISIBLE_TABS = new Set(['text', 'visual', 'acoustic', 'biometric', 'live', 'trustpath']);
            const LUI_AUTO_TABS = new Set(['text', 'visual', 'acoustic', 'biometric', 'live']);
            const lui = { streaming: false, analysisBusy: false, chatStreaming: false, currentTab: 'text', language: localStorage.getItem('lingua_language') || 'en', lastThreat: null, frameReady: false, pendingResult: null, pendingAssistant: null, expression: 'idle', lastAnnouncedTab: '', resultClaimedKeys: new Set(), resultAckedId: '', assistantAckedId: '', chatQueue: [], explanationCache: new Map(), resultContextCache: new Map(), explanationInFlight: new Map() };
            const LUI_LEDGER_STORAGE_PREFIX = 'lingua_lui_case_ledger_v1:';
            let luiCaseLedger = [];

            function ledgerStorageKey() { return LUI_LEDGER_STORAGE_PREFIX + (b.sessionId || 'local'); }
            function loadLuiCaseLedger() {
                try {
                    const parsed = JSON.parse(localStorage.getItem(ledgerStorageKey()) || '[]');
                    luiCaseLedger = Array.isArray(parsed) ? parsed.slice(-2000) : [];
                } catch (_) { luiCaseLedger = []; }
            }
            function persistLuiCaseLedger() {
                try { localStorage.setItem(ledgerStorageKey(), JSON.stringify(luiCaseLedger.slice(-2000))); } catch (_) { }
            }
            function ledgerPayload(value) {
                try { return JSON.stringify(value, null, 0); } catch (_) { return String(value ?? ''); }
            }
            function recordLuiLedgerEvent(phase, tab, payload, meta = {}) {
                const row = {
                    session_id: b.sessionId || '',
                    case_id: currentCaseId(),
                    timestamp: new Date().toISOString(),
                    tab: String(tab || lui.currentTab || '').toLowerCase(),
                    phase: String(phase || 'EVENT').toUpperCase(),
                    role: meta.role || '',
                    state: meta.state || '',
                    asset_id: meta.assetId ?? b.assetId ?? '',
                    generation: meta.generation ?? b.generation ?? '',
                    language: meta.language || lui.language || 'en',
                    message_id: meta.messageId || '',
                    payload: ledgerPayload(payload).slice(0, 16000)
                };
                luiCaseLedger.push(row);
                if (luiCaseLedger.length > 2000) luiCaseLedger = luiCaseLedger.slice(-2000);
                persistLuiCaseLedger();
                return row;
            }

            const LUI_FAB_STATES = new Set(['idle', 'working', 'processing', 'suspect', 'inquisitive', 'riskfree']); // FINAL v17
            const LUI_FAB_LABELS = { idle: 'IDLE', working: 'WORKING', processing: 'PROCESSING', suspect: 'ALERT', inquisitive: 'INQUISITIVE', riskfree: 'CLEAR' };

            function renderLuiFabFace(state) {
                const s = LUI_FAB_STATES.has(String(state || '').toLowerCase()) ? String(state).toLowerCase() : 'idle';
                if (s === 'suspect') return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#130f11" stroke="#ef5a5a" stroke-width="1.2"/><path d="M8 11 L13 14" stroke="#ef5a5a" stroke-width="1.4" stroke-linecap="round"/><path d="M24 11 L19 14" stroke="#ef5a5a" stroke-width="1.4" stroke-linecap="round"/><circle cx="11" cy="16" r="2.5" fill="#ef5a5a"/><circle cx="21" cy="16" r="2.5" fill="#ef5a5a"/><circle cx="11.8" cy="15.4" r=".8" fill="#fff"/><circle cx="21.8" cy="15.4" r=".8" fill="#fff"/><path d="M12 22 L14 24 L16 20.5 L18 24 L20 22" stroke="#ef5a5a" stroke-width="1.1" fill="none" stroke-linecap="round"/></svg>`;
                if (s === 'inquisitive') return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#171124" stroke="#a855f7" stroke-width="1.2" transform="rotate(3 16 16)"/><path d="M8 10 L13 12" stroke="#a855f7" stroke-width="1.35" stroke-linecap="round"/><path d="M19 14 L24 13" stroke="#a855f7" stroke-width="1.35" stroke-linecap="round"/><circle cx="11" cy="16" r="3" fill="#a855f7"/><circle cx="21" cy="16" r="2.8" fill="#a855f7"/><circle cx="12" cy="15" r="1.2" fill="#fff"/><circle cx="22" cy="15" r="1.1" fill="#fff"/><path d="M14 21 Q17 23.5 19.5 21" stroke="#a855f7" stroke-width="1" fill="none" stroke-linecap="round"/></svg>`;
                if (s === 'riskfree') return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#0d1a12" stroke="#35c76f" stroke-width="1.2"/><path d="M8 18 Q11 12.5 14 18" stroke="#35c76f" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M18 18 Q21 12.5 24 18" stroke="#35c76f" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M12 22 Q16 24.5 20 22" stroke="#35c76f" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;
                if (s === 'processing') return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#0b1722" stroke="#38bdf8" stroke-width="1.2"/><path d="M11 11.5 L12 14.6 L15.2 16 L12 17.4 L11 20.5 L9.8 17.4 L6.8 16 L9.8 14.6 Z" fill="#38bdf8"/><path d="M21 11.5 L22 14.6 L25.2 16 L22 17.4 L21 20.5 L19.8 17.4 L16.8 16 L19.8 14.6 Z" fill="#38bdf8"/><path d="M13 22 Q16 24 19 22" stroke="#38bdf8" stroke-width="1" fill="none" stroke-linecap="round"/></svg>`;
                if (s === 'working') return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#0d1722" stroke="#38bdf8" stroke-width="1.2"/><line x1="6" y1="16" x2="26" y2="16" stroke="#38bdf8" stroke-width="1" opacity=".85"/><circle cx="11" cy="16" r="2.6" fill="#38bdf8"/><circle cx="21" cy="16" r="2.6" fill="#38bdf8"/><circle cx="11.8" cy="15.4" r=".8" fill="#fff"/><circle cx="21.8" cy="15.4" r=".8" fill="#fff"/></svg>`;
                return `<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="25" height="22" rx="11" fill="#0e1820" stroke="#00f0d0" stroke-width="1.2"/><circle cx="11" cy="16" r="3.1" fill="#00f0d0"/><circle cx="21" cy="16" r="3.1" fill="#00f0d0"/><circle cx="12" cy="15" r="1.2" fill="#fff"/><circle cx="22" cy="15" r="1.2" fill="#fff"/><path d="M13 21 Q16 23 19 21" stroke="#00f0d0" stroke-width="1" fill="none" stroke-linecap="round"/></svg>`;
            }

            function setLuiFabExpression(state) {
                const key = LUI_FAB_STATES.has(String(state || '').toLowerCase()) ? String(state).toLowerCase() : 'idle';
                lui.expression = key;
                if (!luiFab) return;
                const face = luiFab.querySelector('.lui-fab-face');
                if (face) face.innerHTML = renderLuiFabFace(key);
                luiFab.dataset.expression = key;
                luiFab.classList.remove('is-idle', 'is-working', 'is-processing', 'is-inquisitive', 'is-riskfree', 'is-clear', 'is-suspect', 'is-risk');
                luiFab.classList.add(`is-${key}`);
                if (key === 'riskfree') luiFab.classList.add('is-clear');
                if (key === 'suspect') luiFab.classList.add('is-risk');
                const label = LUI_FAB_LABELS[key] || key.toUpperCase();
                luiFab.setAttribute('aria-label', `Open Lui copilot — ${label}`);
                luiFab.setAttribute('title', `LUI — ${label}`);
            }

            let luiAmbientTimer = null;
            let luiAmbientReturnTimer = null;
            let luiExpressionRevision = 0;
            let luiExpressionResyncTimers = [];
            let luiExpressionWatchdog = null;
            let luiResultExpressionTimer = null;
            let luiResultExpressionRevision = 0;
            const LUI_RESULT_EXPRESSION_HOLD_MS = 7000;
            const LUI_EXPRESSION_BUS = 'linguashield:lui-expression:v25';
            const LUI_EXPRESSION_STORAGE = 'linguashield:lui-expression:v25:state';
            let luiExpressionChannel = null;
            try { luiExpressionChannel = new BroadcastChannel(LUI_EXPRESSION_BUS); } catch (_) { luiExpressionChannel = null; }

            function publishLuiExpression(key, revision) {
                const message = { state: key, revision: Number(revision) || 0, timestamp: Date.now() };
                try { localStorage.setItem(LUI_EXPRESSION_STORAGE, JSON.stringify(message)); } catch (_) { }
                try { luiExpressionChannel?.postMessage(message); } catch (_) { }
            }

            function clearLuiExpressionResyncTimers() {
                luiExpressionResyncTimers.forEach(id => clearTimeout(id));
                luiExpressionResyncTimers = [];
            }

            function syncLuiExpressionToFrame(state, revision = luiExpressionRevision) {
                clearLuiExpressionResyncTimers();
                const key = LUI_FAB_STATES.has(String(state || '').toLowerCase()) ? String(state).toLowerCase() : 'idle';
                const delays = [0, 40, 120, 300, 700, 1200];
                delays.forEach(delay => {
                    const timer = setTimeout(() => {
                        if (revision !== luiExpressionRevision) return;
                        if (!luiFrame?.contentWindow) return;
                        try {
                            const api = luiFrame.contentWindow.LUI;
                            const childState = api?.getExpression?.();
                            const childRevision = Number(api?.getExpressionRevision?.() ?? -1);
                            if (childState !== key || (childRevision >= 0 && childRevision < revision)) {
                                if (typeof api?.setExpression === 'function') {
                                    api.setExpression(key, { source: 'parent', revision });
                                } else {
                                    luiFrame.contentWindow.postMessage({ type: 'LUI_SET_EXPRESSION', payload: { state: key, revision } }, window.location.origin);
                                }
                            }
                        } catch (_) {
                            try {
                                luiFrame.contentWindow.postMessage({ type: 'LUI_SET_EXPRESSION', payload: { state: key, revision } }, window.location.origin);
                            } catch (__) { }
                        }
                    }, delay);
                    luiExpressionResyncTimers.push(timer);
                });
            }

            function startLuiExpressionWatchdog() {
                if (luiExpressionWatchdog) clearInterval(luiExpressionWatchdog);
                luiExpressionWatchdog = setInterval(() => {
                    if (!luiFrame?.contentWindow) return;
                    try {
                        const api = luiFrame.contentWindow.LUI;
                        const childState = api?.getExpression?.();
                        const childRevision = Number(api?.getExpressionRevision?.() ?? -1);
                        if (childState !== lui.expression || (childRevision >= 0 && childRevision < luiExpressionRevision)) {
                            syncLuiExpressionToFrame(lui.expression, luiExpressionRevision);
                        }
                    } catch (_) { }
                }, 150);
            }

            function stopLuiAmbientCycle() {
                if (luiAmbientTimer) { clearTimeout(luiAmbientTimer); luiAmbientTimer = null; }
                if (luiAmbientReturnTimer) { clearTimeout(luiAmbientReturnTimer); luiAmbientReturnTimer = null; }
            }

            function scheduleLuiAmbientCycle() {
                stopLuiAmbientCycle();
                if (lui.streaming || !['idle', 'inquisitive'].includes(lui.expression)) return;
                const delay = 9000 + Math.round(Math.random() * 4000);
                luiAmbientTimer = setTimeout(() => {
                    if (lui.streaming || !['idle', 'inquisitive'].includes(lui.expression)) {
                        scheduleLuiAmbientCycle();
                        return;
                    }
                    const next = lui.expression === 'idle' ? 'inquisitive' : 'idle';
                    setLuiExpression(next, true);
                    if (next === 'inquisitive') {
                        luiAmbientReturnTimer = setTimeout(() => {
                            if (!lui.streaming && lui.expression === 'inquisitive') setLuiExpression('idle', true);
                            scheduleLuiAmbientCycle();
                        }, 2200);
                    } else {
                        scheduleLuiAmbientCycle();
                    }
                }, delay);
            }

            function clearLuiResultExpressionTimer() {
                if (luiResultExpressionTimer) {
                    clearTimeout(luiResultExpressionTimer);
                    luiResultExpressionTimer = null;
                }
                luiResultExpressionRevision = 0;
            }

            function holdLuiResultExpression(state, delay = LUI_RESULT_EXPRESSION_HOLD_MS) {
                const key = LUI_FAB_STATES.has(String(state || '').toLowerCase()) ? String(state).toLowerCase() : 'idle';
                clearLuiResultExpressionTimer();

                setLuiExpression(key, false);
                if (!['suspect', 'riskfree'].includes(key) || delay <= 0) return;

                luiResultExpressionRevision = luiExpressionRevision;
                luiResultExpressionTimer = setTimeout(() => {
                    luiResultExpressionTimer = null;
                    if (luiResultExpressionRevision !== luiExpressionRevision) return;
                    if (lui.expression !== key) return;
                    if (['suspect', 'riskfree'].includes(lui.expression)) setLuiExpression('idle', true);
                    luiResultExpressionRevision = 0;
                }, delay);
            }

            function setLuiExpression(state, syncFrame = true) {
                const key = LUI_FAB_STATES.has(String(state || '').toLowerCase()) ? String(state).toLowerCase() : 'idle';
                // Any explicit expression change supersedes a pending result-return timer.
                if (luiResultExpressionTimer && !['suspect', 'riskfree'].includes(key)) clearLuiResultExpressionTimer();
                lui.expression = key;
                const revision = ++luiExpressionRevision;
                publishLuiExpression(key, revision);
                setLuiFabExpression(key);
                if (['working', 'processing', 'suspect', 'riskfree'].includes(key)) stopLuiAmbientCycle();
                syncLuiExpressionToFrame(key, revision);
                if (!lui.streaming && ['idle', 'inquisitive'].includes(key)) scheduleLuiAmbientCycle();
            }

            const luiFab = document.getElementById('lui-fab');
            const luiLayer = document.getElementById('lui-layer');
            const luiDrawer = document.getElementById('lui-drawer');
            const luiBackdrop = document.getElementById('lui-backdrop');
            const luiClose = document.getElementById('lui-close');
            const luiFrame = document.getElementById('lui-iframe');

            function luiAllowed(tab) { return LUI_VISIBLE_TABS.has(String(tab || '').toLowerCase()); }
            function luiAutoAllowed(tab) { return LUI_AUTO_TABS.has(String(tab || '').toLowerCase()); }

            function luiPost(type, payload = {}, extra = {}) {
                const win = luiFrame?.contentWindow;
                if (!win) {
                    luiDbgWarn('bridge:post-skip', { type, reason: 'no_iframe_window', frameReady: lui.frameReady });
                    return false;
                }
                try {
                    const outbound = { type, payload, ...extra };
                    // Result and assistant delivery use the browser message channel as the
                    // canonical protocol. The child sends an ACK after it has actually
                    // rendered the message, so a successful expression update can never
                    // masquerade as successful message delivery.
                    if (type === 'LUI_RESULT' || type === 'LUI_ASSISTANT_MESSAGE') {
                        if (!lui.frameReady) {
                            luiDbgWarn('bridge:post-skip', { type, reason: 'frame_not_ready', frameReady: false, messageId: payload?.messageId || '' });
                            return false;
                        }
                        win.postMessage(outbound, window.location.origin);
                        luiDbg('bridge:host->child', { type, messageId: payload?.messageId || '', tab: payload?.tab || '', state: payload?.state || '', textPreview: luiDebugPayload(payload?.text || '', 1000) });
                        return true;
                    }
                    // Same-origin direct API remains useful for lightweight state/context.
                    const api = win.LUI;
                    if (api) {
                        if (type === 'LUI_CONTEXT' && typeof api.setContext === 'function') {
                            const result = api.setContext(payload);
                            luiDbg('bridge:direct-context', { result: luiDebugPayload(result, 900) });
                            return true;
                        }
                        if (type === 'LUI_TAB_ANNOUNCEMENT' && typeof api.receiveTabAnnouncement === 'function') {
                            const result = api.receiveTabAnnouncement(payload);
                            luiDbg('bridge:direct-tab-briefing', { result: luiDebugPayload(result, 900), tab: payload?.tab || '' });
                            return result?.success !== false;
                        }
                        if (type === 'LUI_SET_BUSY' && typeof api.setBusy === 'function') {
                            const result = api.setBusy(payload?.busy, payload?.phase || 'processing');
                            luiDbg('bridge:direct-busy', { busy: payload?.busy, phase: payload?.phase || 'processing', result: luiDebugPayload(result, 500) });
                            return true;
                        }
                        if (type === 'LUI_SET_EXPRESSION' && typeof api.setExpression === 'function') {
                            const result = api.setExpression(payload?.state ?? extra?.state, { source: 'parent', revision: Number(payload?.revision ?? luiExpressionRevision) });
                            luiDbg('bridge:direct-expression', { requested: payload?.state ?? extra?.state, revision: Number(payload?.revision ?? luiExpressionRevision), result: luiDebugPayload(result, 500) });
                            return true;
                        }
                    }
                    if (!lui.frameReady) {
                        luiDbgWarn('bridge:post-skip', { type, reason: 'frame_not_ready_after_direct_api', frameReady: false });
                        return false;
                    }
                    win.postMessage(outbound, window.location.origin);
                    luiDbg('bridge:host->child', { type, payload: luiDebugPayload(payload, 1300) });
                    return true;
                } catch (error) {
                    luiDbgError('bridge:post-error', { type, messageId: payload?.messageId || '', message: error?.message || String(error), stack: error?.stack || '' });
                    return false;
                }
            }

            function dispatchPendingLuiResult() {
                if (!lui.pendingResult || !lui.frameReady) {
                    luiDbg('result:dispatch-skip', { hasPending: !!lui.pendingResult, frameReady: lui.frameReady });
                    return false;
                }
                const p = lui.pendingResult;
                if (lui.resultAckedId === p.messageId) {
                    luiDbg('result:already-acked', { messageId: p.messageId });
                    lui.pendingResult = null;
                    return true;
                }
                luiDbg('result:dispatch', { messageId: p.messageId, tab: p.tab, state: p.state, level: p.level, textPreview: luiDebugPayload(p.text, 700) });

                // SAME-ORIGIN PRIMARY DELIVERY: invoke the LUI renderer directly and
                // use its synchronous return value as the delivery acknowledgement.
                // This removes the postMessage/iframe-ready race that allowed the
                // expression to arrive while the actual result card was lost.
                try {
                    const api = luiFrame?.contentWindow?.LUI;
                    if (typeof api?.receiveResult === 'function') {
                        const rendered = api.receiveResult(p);
                        luiDbg('result:direct-render', { messageId: p.messageId, success: rendered?.success !== false, renderResult: luiDebugPayload(rendered, 800) });
                        if (rendered?.success !== false) {
                            lui.resultAckedId = p.messageId;
                            lui.pendingResult = null;
                            luiDbg('result:delivered', { messageId: p.messageId, transport: 'direct_api' });
                            return true;
                        }
                    }
                } catch (error) {
                    luiDbgError('result:direct-render-error', { messageId: p.messageId, message: error?.message || String(error), stack: error?.stack || '' });
                }

                // postMessage remains the compatibility fallback when direct same-origin
                // access is temporarily unavailable.
                return luiPost('LUI_RESULT', p);
            }

            function dispatchPendingLuiAssistant() {
                if (!lui.pendingAssistant || !lui.frameReady) {
                    luiDbg('assistant:dispatch-skip', { hasPending: !!lui.pendingAssistant, frameReady: lui.frameReady });
                    return false;
                }
                const p = lui.pendingAssistant;
                if (lui.assistantAckedId === p.messageId) {
                    luiDbg('assistant:already-acked', { messageId: p.messageId });
                    lui.pendingAssistant = null;
                    return true;
                }
                luiDbg('assistant:dispatch', { messageId: p.messageId, tab: p.tab, state: p.state, textPreview: luiDebugPayload(p.text, 700) });

                // Same-origin direct renderer is the primary chat-delivery path too.
                try {
                    const api = luiFrame?.contentWindow?.LUI;
                    if (typeof api?.receiveAssistantMessage === 'function') {
                        const rendered = api.receiveAssistantMessage(p);
                        luiDbg('assistant:direct-render', { messageId: p.messageId, success: rendered?.success !== false, renderResult: luiDebugPayload(rendered, 800) });
                        if (rendered?.success !== false) {
                            lui.assistantAckedId = p.messageId;
                            lui.pendingAssistant = null;
                            luiDbg('assistant:delivered', { messageId: p.messageId, transport: 'direct_api' });
                            return true;
                        }
                    }
                } catch (error) {
                    luiDbgError('assistant:direct-render-error', { messageId: p.messageId, message: error?.message || String(error), stack: error?.stack || '' });
                }

                return luiPost('LUI_ASSISTANT_MESSAGE', p);
            }

            function queueLuiResult(resultPayload) {
                lui.pendingResult = resultPayload;
                luiDbg('result:queued', { messageId: resultPayload?.messageId, tab: resultPayload?.tab, frameReady: lui.frameReady, pendingAssistant: !!lui.pendingAssistant });
                dispatchPendingLuiResult();
                [80, 180, 400, 800, 1500, 2500, 4000].forEach(delay => setTimeout(() => {
                    if (lui.pendingResult?.messageId === resultPayload.messageId) {
                        luiDbg('result:retry', { messageId: resultPayload.messageId, delay, frameReady: lui.frameReady });
                        dispatchPendingLuiResult();
                    }
                }, delay));
            }

            function queueLuiAssistant(payload) {
                const messageId = payload.messageId || `lui_chat_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
                const canonicalText = cleanLuiBridgeText(payload?.text || '');
                const tab = String(payload?.tab || lui.currentTab || '').toLowerCase();

                // Chat responses have the same translation/copy surface as result cards,
                // but remain ordinary chat records. Cache the exact clean English reply
                // so a HINDI/MARATHI button never re-investigates the case.
                lui.explanationCache.set(messageId, { en: canonicalText, hi: '', mr: '', translationValidation: { en: true, hi: false, mr: false } });
                lui.resultContextCache.set(messageId, {
                    sessionId: b.sessionId,
                    assetId: b.assetId,
                    generation: b.generation,
                    tab,
                    sourceText: canonicalText,
                    chat: true
                });
                while (lui.explanationCache.size > 100) {
                    const oldestKey = lui.explanationCache.keys().next().value;
                    if (!oldestKey) break;
                    lui.explanationCache.delete(oldestKey);
                    lui.resultContextCache.delete(oldestKey);
                }
                while (lui.resultContextCache.size > 100) {
                    const oldestKey = lui.resultContextCache.keys().next().value;
                    if (!oldestKey) break;
                    lui.resultContextCache.delete(oldestKey);
                }

                lui.pendingAssistant = { ...payload, messageId, text: canonicalText };
                luiDbg('assistant:queued', { messageId, tab, frameReady: lui.frameReady, textPreview: luiDebugPayload(canonicalText, 700) });
                dispatchPendingLuiAssistant();
                [80, 180, 400, 800, 1500, 2500, 4000].forEach(delay => setTimeout(() => {
                    if (lui.pendingAssistant?.messageId === messageId) {
                        luiDbg('assistant:retry', { messageId, delay, frameReady: lui.frameReady });
                        dispatchPendingLuiAssistant();
                    }
                }, delay));
            }

            function currentCaseId() {
                return localStorage.getItem('lingua_case_id') || '';
            }

            loadLuiCaseLedger();

            function updateLuiHostToolbarMeta() {
                const chip = document.getElementById('lui-host-case-chip');
                if (chip) chip.textContent = `CASE — ${currentCaseId() || 'UNASSIGNED'}`;
                const lang = document.getElementById('lui-host-language');
                if (lang) lang.value = ['en', 'hi', 'mr'].includes(lui.language) ? lui.language : 'en';
            }

            function syncLuiContext() {
                updateLuiHostToolbarMeta();
                luiPost('LUI_CONTEXT', {
                    sessionId: b.sessionId,
                    assetId: b.assetId,
                    generation: b.generation,
                    caseId: currentCaseId(),
                    tab: lui.currentTab,
                    language: lui.language
                });
            }

            const LUI_TAB_ANNOUNCEMENTS = {
                text: 'Text Analysis examines written messages, claims, requests, payment prompts, and other linguistic evidence. Its result reports backend-detected findings and confidence without replacing the investigator’s judgement.',
                visual: 'Visual Analysis examines uploaded images as evidence, including manipulation and contextual signals returned by the backend. Its result separates visual findings from overall case risk.',
                acoustic: 'Acoustic Analysis examines audio or voice evidence, including speech content and synthetic-voice indicators. Its result keeps content risk separate from voice authenticity.',
                biometric: 'Biometric verifies a test voice against a trusted reference voice. Identity match or mismatch is shown as a separate identity finding from the threat assessment.',
                live: 'Live captures or accepts a voice session and sends it to the backend for content-risk and voice-authenticity analysis. The result preserves the session timeline and event context.'
            };

            function luiResultKey(tab, assetId = b.assetId, generation = b.generation) {
                return `${b.sessionId || ''}|${assetId || 'NO_ASSET'}|${generation ?? 'NO_GEN'}|${String(tab || '').toLowerCase()}`;
            }

            function announceLuiTab(tab) {
                const key = String(tab || '').toLowerCase();
                if (!luiAutoAllowed(key)) return false;
                const text = LUI_TAB_ANNOUNCEMENTS[key];
                if (!text) return false;
                // Once an authoritative result has been produced for this exact
                // session/asset/generation/tab, a late iframe READY must never append
                // another briefing beneath it.
                if (lui.resultClaimedKeys.has(luiResultKey(key))) return true;
                if (lui.lastAnnouncedTab === key) return true;
                const sent = luiPost('LUI_TAB_ANNOUNCEMENT', { tab: key, text });
                if (!sent) return false;
                lui.lastAnnouncedTab = key;
                recordLuiLedgerEvent('TAB_BRIEFING', key, { text }, { state: 'inquisitive' });
                return true;
            }

            function setLuiAvailability(tab) {
                const key = String(tab || '').toLowerCase();
                if (lui.currentTab !== key) lui.lastAnnouncedTab = '';
                lui.currentTab = key;
                const enabled = luiAllowed(key);
                luiFab?.setAttribute('aria-hidden', enabled ? 'false' : 'true');
                if (!enabled) closeLuiDrawer();
                syncLuiContext();
            }

            function openLuiDrawer() {
                if (!luiAllowed(lui.currentTab)) return;
                luiLayer.setAttribute('aria-hidden', 'false');
                luiDrawer.classList.add('open');
                luiBackdrop.classList.add('open');
                // Opening the copilot does not alter the authoritative expression.
                try { luiFrame?.contentWindow?.focus(); } catch (_) { }
            }
            function closeLuiDrawer() {
                luiDrawer.classList.remove('open');
                luiBackdrop.classList.remove('open');
                luiLayer.setAttribute('aria-hidden', 'true');
            }

            luiFab.onclick = openLuiDrawer;

            // Robust close handler: capture pointer/click before the iframe can consume it.
            const forceCloseLui = event => {
                if (event) {
                    event.preventDefault();
                    event.stopPropagation();
                    event.stopImmediatePropagation?.();
                }
                closeLuiDrawer();
                return false;
            };
            luiClose.addEventListener('pointerdown', forceCloseLui, true);
            luiClose.addEventListener('click', forceCloseLui, true);
            luiBackdrop.addEventListener('click', forceCloseLui, true);
            document.addEventListener('keydown', e => { if (e.key === 'Escape') forceCloseLui(e); });
            luiClose.setAttribute('onclick', 'return false;');
            luiFrame?.addEventListener('error', event => {
                luiDbgError('iframe:error', { src: luiFrame?.src || '', event: luiDebugPayload(event, 500) });
            });
            luiFrame?.addEventListener('load', () => {
                luiDbg('iframe:load', { src: luiFrame?.src || '', frameReadyBefore: lui.frameReady });
                // The browser load event is NOT the LUI integration-ready event.
                // Keep frameReady false until the child explicitly sends LUI_READY;
                // otherwise a result can be posted into an iframe before the child
                // message listener/API has finished installing.
                lui.frameReady = false;
                luiDbg('iframe:await-ready', { pendingResult: !!lui.pendingResult, pendingAssistant: !!lui.pendingAssistant });
            });

            async function readStreamText(resp, onText) {
                if (!resp.body) return;
                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buf = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buf += decoder.decode(value, { stream: true });
                    const parts = buf.split(/\n\n|\n/);
                    buf = parts.pop() || '';
                    for (const part of parts) {
                        const line = part.replace(/^data:\s?/, '');
                        if (!line || line === '[DONE]') continue;
                        onText(line);
                    }
                }
                if (buf) {
                    const line = buf.replace(/^data:\s?/, '');
                    if (line && line !== '[DONE]') onText(line);
                }
            }

            function setLuiBusy(v, phase = 'processing') {
                const p = String(phase || '').toLowerCase();
                const isChatPhase = ['chat', 'chat_delight', 'chat_complete', 'chat_delight_complete'].includes(p);
                if (isChatPhase) {
                    lui.chatStreaming = !!v;
                } else if (v) {
                    lui.analysisBusy = true;
                } else if (['result', 'result_ready', 'complete_result', 'error'].includes(p)) {
                    lui.analysisBusy = false;
                }
                lui.streaming = !!(lui.analysisBusy || lui.chatStreaming);
                if (v) setLuiExpression(isChatPhase ? 'inquisitive' : 'processing', true);
                luiFab?.classList.toggle('is-busy', lui.streaming);
                luiPost('LUI_SET_BUSY', { busy: lui.streaming, phase });
            }

            function authoritativeThreat(data) {
                const detected = data?.detected_data && typeof data.detected_data === 'object' ? data.detected_data : null;
                if (typeof detected?.threat_detected === 'boolean') return detected.threat_detected;
                if (typeof data?.threat_detected === 'boolean') return data.threat_detected;
                if (typeof data?.is_scam === 'boolean') return data.is_scam;
                return null;
            }

            function identityFinding(data) {
                const bio = data?.biometric_forensics && typeof data.biometric_forensics === 'object' ? data.biometric_forensics : {};
                const verified = typeof bio.biometric_verified === 'boolean' ? bio.biometric_verified : typeof bio.verified === 'boolean' ? bio.verified : typeof bio.match === 'boolean' ? bio.match : null;
                if (verified === false) return { state: 'MISMATCH', title: 'IDENTITY', tag: 'MISMATCH', status: 'tag-fail', val: 'IDENTITY MISMATCH', sub: 'Trusted reference and test voice do not match.' };
                if (verified === true) return { state: 'MATCH', title: 'IDENTITY', tag: 'MATCH', status: 'tag-pass', val: 'IDENTITY MATCH', sub: 'Trusted reference and test voice match.' };
                return null;
            }

            function luiExpressionForResult(data, tab) {
                const threat = authoritativeThreat(data);
                if (threat === true) return 'suspect';
                if (threat === false) return 'riskfree';
                if (String(tab).toLowerCase() === 'biometric' && identityFinding(data)?.state === 'MISMATCH') return 'inquisitive';
                return 'inquisitive';
            }

            function resultLevel(data) {
                const raw = String(data?.risk_classification || data?.detected_data?.risk_classification || '').toUpperCase();
                if (raw.includes('CRITICAL')) return 'l5';
                if (raw.includes('HIGH')) return 'l4';
                if (raw.includes('MEDIUM') || raw.includes('MODERATE') || raw.includes('SUSPICIOUS')) return 'l3';
                if (raw.includes('LOW')) return 'l1';
                if (raw.includes('CLEAR')) return 'l1';
                return 'l2';
            }

            function resultSummary(data, tab) {
                const direct = data?.summary || data?.message || data?.text_context || data?.processed_text || data?.extracted_text || data?.decision_basis;
                if (typeof direct === 'string' && direct.trim()) return direct.trim();
                if (direct && typeof direct === 'object') {
                    const nested = direct.summary || direct.text || direct.decision_basis || direct.processed_text;
                    if (typeof nested === 'string' && nested.trim()) return nested.trim();
                }
                const threat = authoritativeThreat(data);
                if (threat === true) return `${String(tab || 'Module').toUpperCase()} backend result returned a threat condition.`;
                if (threat === false) return `${String(tab || 'Module').toUpperCase()} backend result returned no threat condition.`;
                return `${String(tab || 'Module').toUpperCase()} backend result received. Review the returned classification and evidence signals.`;
            }

            // Convert the backend analysis explainer payload into stable,
            // human-readable text without inventing new findings. The backend
            // already provides EN/HI/MR explanations and its own LLM/fallback
            // cascade; this helper only flattens the structured fields for LUI.
            function normalizeForensicExplanationBundle(value) {
                const source = value && typeof value === 'object' ? value : {};
                const out = { en: '', hi: '', mr: '' };
                for (const lang of ['en', 'hi', 'mr']) {
                    const item = source[lang];
                    if (typeof item === 'string' && item.trim()) {
                        out[lang] = item.trim();
                        continue;
                    }
                    if (item && typeof item === 'object') {
                        const pieces = [
                            item.verdict_reason,
                            item.psychological_breakdown,
                            item.future_scam_forecast
                        ].filter(v => typeof v === 'string' && v.trim()).map(v => v.trim());
                        out[lang] = pieces.join('\n\n');
                    }
                }
                return out;
            }

            function minimalLuiFallbackExplanation(data, tab) {
                const threat = authoritativeThreat(data);
                const risk = data?.risk_classification ?? data?.detected_data?.risk_classification;
                const confidence = data?.confidence;
                const parts = [];
                if (threat === true) parts.push('The backend marked this result as a threat.');
                else if (threat === false) parts.push('The backend marked this result as clear.');
                else parts.push(`${String(tab || 'Module').toUpperCase()} backend result received.`);
                if (risk) parts.push(`Classification: ${String(risk)}.`);
                if (Number.isFinite(Number(confidence))) parts.push(`Confidence: ${Number(confidence).toFixed(2)}%.`);
                return parts.join('\n\n');
            }

            // Host-side copy of the transport sanitizer keeps the canonical English
            // source clean before it is cached or handed to translation. The LUI iframe
            // also sanitizes at render/copy time as a final defensive boundary.
            function cleanLuiBridgeText(value) {
                return String(value ?? '')
                    .replace(/\r\n/g, '\n')
                    .replace(/\\n/g, '\n')
                    .replace(/\\r/g, '\r')
                    .replace(/\s*\[DONE\]\s*(?:\{[\s\S]*?\})?\s*$/i, '')
                    .trim();
            }

            function buildLuiResultPayload(tab, data, explanation, resultContext = {}) {
                const key = String(tab || '').toLowerCase();
                const id = identityFinding(data);
                const vectors = [];
                if (id) vectors.push(id);
                if (key === 'live') {
                    const acoustic = data?.acoustic_forensics || {};
                    const synthetic = Number(acoustic?.vocoder_score);
                    if (Number.isFinite(synthetic)) vectors.push({ title: 'VOICE AUTHENTICITY', tag: acoustic?.is_synthetic_voice === true || acoustic?.synthetic_voice === true || acoustic?.ai_generated === true ? 'AI SIGNAL' : 'VOICE', status: acoustic?.is_synthetic_voice === true || acoustic?.synthetic_voice === true || acoustic?.ai_generated === true ? 'tag-fail' : 'tag-info', val: `${synthetic.toFixed(2)}% AI signal`, sub: 'Voice-origin indicator from backend acoustic forensics.' });
                }

                const preferredLanguage = 'en';
                const backendBundleRaw = normalizeForensicExplanationBundle(data?.forensic_explanation || data?.forensicExplanation);
                const backendBundle = {
                    en: cleanLuiBridgeText(backendBundleRaw.en),
                    hi: cleanLuiBridgeText(backendBundleRaw.hi),
                    mr: cleanLuiBridgeText(backendBundleRaw.mr)
                };
                const resultText = cleanLuiBridgeText(explanation || backendBundle[preferredLanguage] || backendBundle.en || minimalLuiFallbackExplanation(data, key));
                const localizedExplanations = { en: resultText, hi: '', mr: '' };
                localizedExplanations[preferredLanguage] = resultText;

                const resultPayload = {
                    messageId: `lui_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                    tab: key,
                    state: luiExpressionForResult(data, key),
                    level: resultLevel(data),
                    levelBadge: key === 'biometric' && id ? `IDENTITY FINDING // ${id.state}` : `BACKEND RESULT // ${String(data?.risk_classification || 'RETURNED').toUpperCase()}`,
                    exprLabel: key === 'biometric' && id ? (id.state === 'MISMATCH' ? 'INQUISITIVE // VERIFY IDENTITY' : 'IDENTITY // VERIFIED') : undefined,
                    text: resultText,
                    language: preferredLanguage,
                    explanations: localizedExplanations,
                    citation: 'LinguaShield Workbench · Authoritative Backend Result',
                    source: 'WORKBENCH',
                    metadata: {
                        authoritativeThreat: authoritativeThreat(data),
                        riskClassification: data?.risk_classification ?? data?.detected_data?.risk_classification ?? null,
                        confidence: Number.isFinite(Number(data?.confidence)) ? Number(data.confidence) : null,
                        identityFinding: id || null,
                        explanationSource: explanation ? 'LUI_DEBRIEF' : (Object.values(backendBundle).some(Boolean) ? 'ANALYSIS_FORENSIC_EXPLANATION' : 'MINIMAL_BACKEND_FALLBACK')
                    },
                    vectors
                };

                lui.explanationCache.set(resultPayload.messageId, { ...localizedExplanations, translationValidation: { en: true, hi: false, mr: false } });
                lui.resultContextCache.set(resultPayload.messageId, {
                    sessionId: resultContext.sessionId ?? b.sessionId,
                    assetId: resultContext.assetId ?? b.assetId,
                    generation: resultContext.generation ?? b.generation,
                    tab: key,
                    threat: authoritativeThreat(data),
                    riskClassification: data?.risk_classification ?? data?.detected_data?.risk_classification,
                    confidence: Number.isFinite(Number(data?.confidence)) ? Number(data.confidence) : null,
                    // Canonical source for translation-only requests. Never use
                    // a previously translated Hindi/Marathi value as the source.
                    sourceText: (
                        typeof localizedExplanations.en === 'string'
                        && localizedExplanations.en.trim()
                    )
                        ? localizedExplanations.en.trim()
                        : (preferredLanguage === 'en' ? resultText.trim() : '')
                });
                if (lui.explanationCache.size > 100) {
                    const oldestKey = lui.explanationCache.keys().next().value;
                    if (oldestKey) {
                        lui.explanationCache.delete(oldestKey);
                        lui.resultContextCache.delete(oldestKey);
                    }
                }
                if (lui.resultContextCache.size > 100) {
                    const oldestContextKey = lui.resultContextCache.keys().next().value;
                    if (oldestContextKey) lui.resultContextCache.delete(oldestContextKey);
                }
                return resultPayload;
            }

            async function streamEndpointText(url, body, controller) {
                const started = performance.now();
                const endpoint = String(url || '').replace(API_BASE_URL, '');
                luiDbg('stream:start', { endpoint, body: luiDebugPayload(body, 1400), aborted: !!controller?.signal?.aborted });
                try {
                    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: controller?.signal });
                    luiDbg('stream:response', { endpoint, status: resp.status, ok: resp.ok, ms: Math.round(performance.now() - started) });
                    if (!resp.ok) {
                        let bodyText = '';
                        try { bodyText = await resp.text(); } catch (_) { }
                        luiDbgError('stream:http-error', { endpoint, status: resp.status, bodyPreview: luiDebugPayload(bodyText, 1400) });
                        throw new Error(`HTTP ${resp.status}`);
                    }
                    let text = '';
                    let chunks = 0;
                    await readStreamText(resp, chunk => {
                        chunks++;
                        text += chunk;
                        luiDbg('stream:chunk', { endpoint, chunk: chunks, chunkPreview: luiDebugPayload(chunk, 700), totalLength: text.length });
                    });
                    const out = text.trim();
                    luiDbg('stream:complete', { endpoint, chunks, length: out.length, preview: luiDebugPayload(out, 1200), ms: Math.round(performance.now() - started) });
                    return out;
                } catch (error) {
                    luiDbgError('stream:exception', {
                        endpoint,
                        name: error?.name || '',
                        message: error?.message || String(error),
                        aborted: !!controller?.signal?.aborted,
                        ms: Math.round(performance.now() - started)
                    });
                    throw error;
                }
            }

            function deliverPendingLuiResult(resultPayload) {
                if (!resultPayload) return false;
                const targetKey = luiResultKey(resultPayload.tab, b.assetId, b.generation);
                if (!lui.resultClaimedKeys.has(targetKey)) return false;
                queueLuiResult(resultPayload);
                return true;
            }

            function luiTranslationSemanticFidelityOk(source, translated, lang) {
                const src = String(source || '').trim().toLowerCase();
                const out = String(translated || '').trim().toLowerCase();
                const target = String(lang || '').toLowerCase();
                if (!src || !out || !['hi', 'mr'].includes(target)) return false;
                const srcParagraphs = src.split(/\n\s*\n+/).map(x => x.trim()).filter(Boolean);
                const outParagraphs = out.split(/\n\s*\n+/).map(x => x.trim()).filter(Boolean);
                if (srcParagraphs.length !== outParagraphs.length) return false;

                const policy = target === 'hi' ? {
                    negation: ['नहीं', 'न', 'कभी नहीं'],
                    safety: ['सुरक्षित', 'वैध', 'प्रामाणिक', 'सत्यापित'],
                    suspicious: ['संदिग्ध', 'शंकास्पद'],
                    unknownCalls: ['अज्ञात कॉल', 'अनजान कॉल', 'अनचाही कॉल', 'अनोखी कॉल'],
                    unsolicited: ['अनचाहे', 'अनपेक्षित', 'अवांछित', 'अनाहूत', 'अनचाही'],
                    synthetic: ['सिंथेटिक', 'कृत्रिम', 'synthetic'],
                    voice: ['आवाज़', 'आवाज', 'voice'],
                    coercive: ['दबाव', 'जबरदस्ती', 'हेरफेर', 'manipulation'],
                    extortion: ['खंडणी', 'जबरन वसूली', 'extortion'],
                    conversational: ['बातचीत', 'संभाषण', 'मानवी', 'मानव', 'पैटर्न', 'नमूने'],
                    threat: ['खतरे', 'धमकी', 'जोखिम'],
                    financial: ['धन', 'पैसे', 'वित्तीय', 'हस्तांतरण', 'हस्तांतरित'],
                    urgent: ['तत्काल', 'तात्कालिक', 'तुरंत', 'अनचाहे', 'अनपेक्षित', 'जल्द'],
                    accepted: ['स्वीकार्य', 'स्वीकारार्ह']
                } : {
                    negation: ['नाही', 'न', 'कधीही नाही'],
                    safety: ['सुरक्षित', 'वैध', 'प्रामाणिक', 'सत्यापित', 'अधिकृत'],
                    suspicious: ['संशयास्पद', 'संशयित', 'शंकास्पद'],
                    unknownCalls: ['अज्ञात कॉल', 'अनओळखी कॉल', 'अनोळखी कॉल'],
                    unsolicited: ['अनाहूत', 'अवांछित', 'अनपेक्षित'],
                    synthetic: ['सिंथेटिक', 'कृत्रिम', 'synthetic'],
                    voice: ['आवाज', 'व्हॉइस', 'voice'],
                    coercive: ['दबाव', 'जबरदस्ती', 'हेरफेर', 'manipulation'],
                    extortion: ['खंडणी', 'जबरदस्तीची वसुली', 'extortion'],
                    conversational: ['संभाषण', 'बोलणे', 'मानवी', 'नमुने', 'पॅटर्न'],
                    threat: ['धोक्याची', 'धोका', 'जोखीम', 'धमकी'],
                    financial: ['पैसे', 'वित्तीय', 'हस्तांतरण', 'हस्तांतरित'],
                    urgent: ['तातडीचे', 'तातडीने', 'त्वरित', 'लगेच', 'अनाहूत', 'अनपेक्षित'],
                    accepted: ['स्वीकारार्ह', 'स्वीकार्य']
                };

                const hasAny = (text, terms) => terms.some(term => text.includes(term));
                const srcNegated = srcParagraphs.map(p => /\b(?:no|not|never|without|does not|do not|did not|was not|were not|isn't|aren't)\b/.test(p));
                for (let i = 0; i < srcNegated.length; i++) {
                    if (srcNegated[i] && !hasAny(outParagraphs[i], policy.negation)) return false;
                }
                if (!/(?:safe|secure|legitimate|verified|authentic)/.test(src) && hasAny(out, policy.safety)) return false;
                if (!/(?:suspicion|suspicious)/.test(src) && hasAny(out, policy.suspicious)) return false;
                if (/unsolicited requests?/.test(src)) {
                    if (hasAny(out, policy.unknownCalls) || !hasAny(out, policy.unsolicited)) return false;
                }
                if (/synthetic voice/.test(src) && (!hasAny(out, policy.synthetic) || !hasAny(out, policy.voice))) return false;
                if (/coercive manipulation/.test(src) && !hasAny(out, policy.coercive)) return false;
                if (/institutional extortion/.test(src) && !hasAny(out, policy.extortion)) return false;
                if (/normal human conversational patterns/.test(src) && !hasAny(out, policy.conversational)) return false;
                if (/acceptable threat levels/.test(src) && (!hasAny(out, policy.threat) || !hasAny(out, policy.accepted))) return false;
                if (/urgent financial transfers|urgent requests for otp/.test(src) && (!hasAny(out, policy.urgent) || (!hasAny(out, policy.financial) && !out.includes('otp')))) return false;
                if (!src.includes('mental pressure') && out.includes('मानसिक दबाव')) return false;
                if (!src.includes('fake voice') && (out.includes('नकली आवाज') || out.includes('बनावट आवाज'))) return false;
                return true;
            }

            async function streamTranslationText(url, body) {
                const started = performance.now();
                const endpoint = String(url || '').replace(API_BASE_URL, '');
                try {
                    const resp = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });
                    const validated = resp.headers.get('X-LinguaShield-Translation-Validated') === 'true';
                    const translationOnly = resp.headers.get('X-LinguaShield-Translation-Only') === 'true';
                    const validationSchema = resp.headers.get('X-LinguaShield-Translation-Schema') || '';
                    if (!resp.ok) {
                        let bodyText = '';
                        try { bodyText = await resp.text(); } catch (_) { }
                        throw new Error(`HTTP ${resp.status}`);
                    }
                    let text = '';
                    await readStreamText(resp, chunk => { text += chunk; });
                    const out = text.trim();
                    luiDbg('translation:response', { endpoint, validated, translationOnly, length: out.length, ms: Math.round(performance.now() - started) });
                    return { text: out, validated, translationOnly, validationSchema, sourceLanguage: String(body?.source_language || '').trim().toLowerCase() };
                } catch (error) {
                    luiDbgWarn('translation:request-failed', { endpoint, message: error?.message || String(error), ms: Math.round(performance.now() - started) });
                    throw error;
                }
            }

            async function triggerLuiDebrief(tab, payload) {
                const key = String(tab || '').toLowerCase();
                luiDbg('debrief:enter', { tab: key, autoAllowed: luiAutoAllowed(key), assetId: b.assetId, generation: b.generation, framePresent: !!luiFrame?.contentWindow, payloadPreview: luiDebugPayload(payload, 1100) });
                if (!luiAutoAllowed(key) || !b.assetId || !luiFrame?.contentWindow) {
                    luiDbgWarn('debrief:skip', { tab: key, reason: !luiAutoAllowed(key) ? 'tab_not_auto_allowed' : !b.assetId ? 'no_asset' : 'no_frame', frameReady: lui.frameReady });
                    return;
                }
                const operationAssetId = b.assetId;
                const operationGeneration = b.generation;
                const controller = b.activeController;
                setLuiBusy(true, 'processing');
                let explanation = '';
                let debriefSucceeded = false;
                try {
                    // One bounded debrief request. The backend chat service already
                    // owns its own LLM/fallback policy; the frontend does not retry
                    // the request recursively.
                    try {
                        explanation = await streamEndpointText(`${API_BASE_URL}/api/chat/debrief`, {
                            session_id: b.sessionId,
                            asset_id: operationAssetId,
                            generation: operationGeneration,
                            tab: key,
                            language: 'en',
                            authoritative_result: payload
                        }, controller);
                        debriefSucceeded = !!explanation.trim();
                    } catch (e) {
                        if (e?.name === 'AbortError') throw e;
                        console.warn('[LUI] debrief failed; LUI result delivery halted', e);
                        // The backend owns deterministic explanation fallback. If the
                        // debrief endpoint rejects the evidence context or the active
                        // generation is stale, do not render a partial result.
                        return;
                    }

                    const resultPayload = buildLuiResultPayload(key, payload, explanation, { sessionId: b.sessionId, assetId: operationAssetId, generation: operationGeneration });
                    lui.resultClaimedKeys.add(luiResultKey(key, operationAssetId, operationGeneration));
                    luiDbg('debrief:built-result', { tab: key, messageId: resultPayload.messageId, state: resultPayload.state, level: resultPayload.level, explanationLength: resultPayload.text.length, explanationSource: resultPayload.metadata?.explanationSource || '', authoritativeThreat: authoritativeThreat(payload), frameReady: lui.frameReady });
                    recordLuiLedgerEvent('DEBRIEF', key, { explanation: resultPayload.text, authoritativeThreat: authoritativeThreat(payload), resultState: resultPayload.state, explanationSource: resultPayload.metadata?.explanationSource || '' }, { state: resultPayload.state, language: resultPayload.language, messageId: resultPayload.messageId, assetId: operationAssetId, generation: operationGeneration });
                    holdLuiResultExpression(resultPayload.state);
                    queueLuiResult(resultPayload);

                    const threat = authoritativeThreat(payload);
                    const fab = document.getElementById('lui-fab');
                    fab?.classList.toggle('is-risk', threat === true);
                    fab?.classList.toggle('is-clear', threat === false);
                } finally {
                    setLuiBusy(false, 'result_ready');
                }
            }

            async function syncAsset(tab, phase, payload) {
                const key = String(tab || '').toLowerCase();
                luiDbg('sync:enter', { tab: key, phase, autoAllowed: luiAutoAllowed(key), sessionId: b.sessionId, assetId: b.assetId, generation: b.generation, payloadPreview: luiDebugPayload(payload, 1000) });
                if (!luiAutoAllowed(key)) {
                    luiDbgWarn('sync:skip', { tab: key, phase, reason: 'tab_not_auto_allowed' });
                    return true;
                }
                if (!b.assetId) await beginAsset();
                const operationAssetId = b.assetId;
                const operationGeneration = b.generation;
                try {
                    luiDbg('sync:request', { tab: key, phase, assetId: operationAssetId, generation: operationGeneration });
                    await jsonFetch(`${API_BASE_URL}/api/chat/sync`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: b.sessionId, asset_id: operationAssetId, generation: operationGeneration, tab: key, phase, payload }), signal: b.activeController?.signal });
                    recordLuiLedgerEvent(phase, key, payload, { assetId: operationAssetId, generation: operationGeneration });
                    if (phase === 'OUTPUT') {
                        lui.lastThreat = payload || null;
                        luiDbg('sync:output-complete', { tab: key, assetId: operationAssetId, generation: operationGeneration, threat: authoritativeThreat(payload) });
                        await triggerLuiDebrief(key, payload);
                    }
                } catch (e) {
                    if (e?.name === 'AbortError') throw e;
                    console.warn('[LUI] required evidence sync failed', e);
                    // INPUT and OUTPUT are prerequisites for a trustworthy LUI
                    // context. Never continue analysis/chat on a silently failed
                    // ledger write, otherwise LUI could reason from partial evidence.
                    throw e;
                }
                syncLuiContext();
                return true;
            }

            async function beginAsset() {
                const seq = ++b.seq; localStorage.setItem('lingua_activation_seq', String(seq));
                if (b.activeController) { try { b.activeController.abort(); } catch (_) { } }
                b.activeController = new AbortController();
                const id = crypto?.randomUUID ? crypto.randomUUID() : `asset-${Date.now()}-${Math.random().toString(36).slice(2)}`;
                const d = await jsonFetch(`${API_BASE_URL}/api/chat/activate_asset`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: b.sessionId, asset_id: id, activation_seq: seq }), signal: b.activeController.signal });
                if (d?.accepted === false) throw new Error('Asset activation rejected');
                b.assetId = d.active_asset_id;
                b.generation = d.generation;
                b.sessionId = d.session_id || b.sessionId;
                localStorage.setItem('lingua_session_id', b.sessionId);
                loadLuiCaseLedger();
                recordLuiLedgerEvent('ASSET_ACTIVATED', lui.currentTab, { accepted: d?.accepted !== false }, { assetId: b.assetId, generation: b.generation });
